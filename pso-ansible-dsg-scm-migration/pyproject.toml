[tool.poetry]
name = "scm-device-register"
version = "0.1.0"
description = "CLI tool for registering Palo Alto Next Generation Firewalls in Strata Cloud Manager"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "scm_device_register", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
rich = "^13.7.0"
requests = "^2.31.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.1"
ruff = "^0.1.9"

[tool.poetry.scripts]
scm-device-register = "scm_device_register.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
