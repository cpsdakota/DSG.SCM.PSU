---
# Push SCM candidate config to target folders and/or devices using the SCM public API.
#
# API Reference: https://pan.dev/scm/api/config/ngfw/operations/push-candidate-config-versions/
# Endpoint: POST https://api.strata.paloaltonetworks.com/config/operations/v1/config-versions/candidate:push
#
# Usage examples:
#
#   Push to specific devices by serial number:
#     ansible-playbook playbooks/scm_push_candidate_config.yml \
#       --vault-password-file .vault_pass \
#       -e 'push_devices=[7957000815595,7957000815592] push_description="Migrating from Panorama to SCM"'
#
#   Push to folders:
#     ansible-playbook playbooks/scm_push_candidate_config.yml \
#       --vault-password-file .vault_pass \
#       -e 'push_folders=["Shared","Remote Networks"] push_description="Policy update"'
#
#   Push to both folders and devices:
#     ansible-playbook playbooks/scm_push_candidate_config.yml \
#       --vault-password-file .vault_pass \
#       -e 'push_folders=["Shared"] push_devices=[7957000815595] push_description="Full push"'
#
#   Push to folder All (do not include admin field — omit push_admin):
#     ansible-playbook playbooks/scm_push_candidate_config.yml \
#       --vault-password-file .vault_pass \
#       -e 'push_folders=["All"] push_description="Full push"'
#
# Variables:
#   push_folders     (optional) - list of SCM folder names to push to
#   push_devices     (optional) - list of device serial numbers as integers
#   push_admin       (optional) - list of admin/service accounts; omit when pushing to folder "All"
#   push_description (required) - description of the push operation

- name: Push SCM candidate config via SCM public API
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/scm_credentials.yml

  vars:
    scm_api_base_url: "https://api.strata.paloaltonetworks.com/config/operations/v1"
    push_folders: []
    push_devices: []
    push_admin: []
    push_description: ""

  tasks:

    # ==========================================
    # Pre-flight Validation
    # ==========================================

    - name: 'Validate push_description is provided'
      ansible.builtin.fail:
        msg: "push_description is required. Example: -e 'push_description=\"Migrating from Panorama to SCM\"'"
      when: push_description == ""

    - name: 'Validate at least one target is provided (folder or device)'
      ansible.builtin.fail:
        msg: "You must provide at least one target. Use push_folders and/or push_devices."
      when:
        - push_folders | length == 0
        - push_devices | length == 0

    - name: 'Display push operation summary'
      ansible.builtin.debug:
        msg:
          - "=== SCM Candidate Config Push ==="
          - "Target Folders : {{ push_folders if push_folders | length > 0 else 'None' }}"
          - "Target Devices : {{ push_devices if push_devices | length > 0 else 'None' }}"
          - "Admins         : {{ push_admin if push_admin | length > 0 else 'N/A (pushing to All or no filter)' }}"
          - "Description    : {{ push_description }}"

    # ==========================================
    # Authenticate with SCM
    # ==========================================

    - name: Authenticate with SCM
      ansible.builtin.include_role:
        name: scm_auth

    # ==========================================
    # Build Request Body
    # ==========================================

    - name: 'Build push request body'
      ansible.builtin.set_fact:
        push_body: "{{ {'description': push_description} | combine({'folders': (push_folders | from_json) if push_folders is string else push_folders} if push_folders | length > 0 else {}) | combine({'devices': ((push_devices | from_json) if push_devices is string else push_devices) | map('string') | list} if push_devices | length > 0 else {}) | combine({'admin': (push_admin | from_json) if push_admin is string else push_admin} if push_admin | length > 0 else {}) }}"

    - name: 'Debug push body'
      ansible.builtin.debug:
        var: push_body

    # ==========================================
    # Push Candidate Config
    # ==========================================

    - name: 'Push candidate config via SCM public API'
      ansible.builtin.uri:
        url: "{{ scm_api_base_url }}/config-versions/candidate:push"
        method: POST
        headers:
          Authorization: "Bearer {{ scm_access_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ push_body }}"
        status_code: [200, 201, 202]
        return_content: true
      register: push_response
      no_log: false

    # ==========================================
    # Display Results
    # ==========================================

    - name: 'Display raw push response'
      ansible.builtin.debug:
        var: push_response.json

    - name: 'Display push job details'
      ansible.builtin.debug:
        msg:
          - "=== Push Submitted Successfully ==="
          - "Job ID      : {{ push_response.json.job_id | default('N/A') }}"
          - "Status      : {{ push_response.json.status | default('N/A') }}"
          - "Description : {{ push_description }}"
          - "Tip: Use the SCM UI or query the jobs API to monitor push progress."
      when: push_response.status in [200, 201, 202]
