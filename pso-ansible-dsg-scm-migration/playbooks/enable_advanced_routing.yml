---
- hosts: 'firewalls'
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    # Optional: restrict to specific firewalls
    # firewall_list: ["dicks-vmseries-lab-firewall01"]

  tasks:

    - name: Check if running for specific firewalls only
      ansible.builtin.set_fact:
        run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

    - name: Skip host if not in firewall_list
      ansible.builtin.meta: end_host
      when: not (run_for_this_host | bool)

    - name: Set target firewall provider
      ansible.builtin.set_fact:
        target_device:
          provider:
            ip_address: "{{ panorama_host }}"
            username: "{{ username | default(omit) }}"
            password: "{{ password | default(omit) }}"
            api_key: "{{ api_key | default(omit) }}"
      no_log: true

    # ==========================================
    # Step 1 — Check current advanced routing state
    # CLI equivalent: show system state | match advance-routing
    # ==========================================

    - name: Check current advanced routing state
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: "show system state"
        cmd_is_xml: false
      register: system_state_result

    - name: Parse current advanced routing status
      ansible.builtin.set_fact:
        advance_routing_enabled: "{{ 'cfg.general.advance-routing-enabled: True' in system_state_result.stdout }}"

    - name: Display current advanced routing status
      ansible.builtin.debug:
        msg:
          - "Firewall:         {{ inventory_hostname }}"
          - "Advanced routing: {{ 'ENABLED' if advance_routing_enabled else 'NOT ENABLED' }}"

    - name: Skip — advanced routing already enabled on this host
      when: advance_routing_enabled
      block:
        - name: Report already enabled
          ansible.builtin.debug:
            msg: "Advanced routing is already enabled on {{ inventory_hostname }}. No action needed."
        - name: End host processing
          ansible.builtin.meta: end_host

    # ==========================================
    # Step 2 — Enable advanced routing
    # CLI equivalent: configure
    #                 set deviceconfig setting advance-routing yes
    # ==========================================

    - name: Enable advanced routing in device configuration
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ target_device.provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting"
        element: "<advance-routing>yes</advance-routing>"

    # ==========================================
    # Step 3 — Commit
    # CLI equivalent: commit
    # ==========================================

    - name: Commit configuration
      paloaltonetworks.panos.panos_commit_firewall:
        provider: "{{ target_device.provider }}"
        description: "Enable advanced routing engine"
      register: commit_result

    - name: Display commit result
      ansible.builtin.debug:
        msg: "Configuration committed on {{ inventory_hostname }} — reboot required for advanced routing to take effect."

    # ==========================================
    # Step 4 — Reboot
    # CLI equivalent: request restart system
    # Note: must be sent from op mode (XML API handles this natively)
    # ==========================================

    - name: Reboot the firewall
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: "<request><restart><system/></restart></request>"
        cmd_is_xml: true
      ignore_errors: true   # connection drops immediately on reboot

    # ==========================================
    # Step 5 — Wait for reboot (max 12 minutes, check every minute)
    # First wait for port to go DOWN, then wait for it to come back UP
    # ==========================================

    - name: Wait for firewall to begin shutdown (port 443 closes)
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 15        # Give 15s before checking — reboot command takes a moment
        timeout: 120     # 2 minutes max for device to go down
        state: stopped   # Wait until the port is NO LONGER listening

    - name: Wait for firewall to come back online (port 443 reopens)
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 30        # 30s after port closed before first up-check
        timeout: 600     # 10 minutes max to come back  (total = 120 + 600 = 720s = 12 min)
        sleep: 60        # Check every minute
        state: started

    - name: Pause for management plane to fully initialize after port is up
      ansible.builtin.pause:
        seconds: 30

    # ==========================================
    # Step 6 — Verify advanced routing is now active
    # CLI equivalent: show system state | match advance-routing
    # ==========================================

    - name: Verify advanced routing state after reboot
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: "show system state"
        cmd_is_xml: false
      register: system_state_after
      retries: 5
      delay: 30
      until: system_state_after is not failed

    - name: Parse post-reboot advanced routing status
      ansible.builtin.set_fact:
        advance_routing_after_reboot: "{{ 'cfg.general.advance-routing-enabled: True' in system_state_after.stdout }}"

    - name: Display post-reboot advanced routing status
      ansible.builtin.debug:
        msg:
          - "Firewall:                  {{ inventory_hostname }}"
          - "Advanced routing (before): NOT ENABLED"
          - "Advanced routing (after):  {{ 'ENABLED' if advance_routing_after_reboot else 'NOT ENABLED — investigate' }}"

    - name: Fail if advanced routing is not active after reboot
      ansible.builtin.fail:
        msg: "Advanced routing is still NOT enabled after reboot on {{ inventory_hostname }}. Manual investigation required."
      when: not advance_routing_after_reboot
