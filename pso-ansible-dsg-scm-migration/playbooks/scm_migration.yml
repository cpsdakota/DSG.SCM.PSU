---
# =============================================================================
# SCM Migration Master Playbook
# Runs the full Panorama-to-SCM migration workflow in a single execution.
#
# Steps:
#   1.  List SCM devices BEFORE migration
#   2.  Backup firewall configurations + collect serial numbers
#   3.  Pre-migration snapshot
#   4.  Remove Panorama management from firewalls
#   5.  Set Panorama cloud-service
#   6.  Change hostname (prefix SCMMANAGED- to original hostname)
#   7.  Claim devices to SCM
#   8.  Wait 5 minutes for SCM bootstrap
#   9.  Post-migration snapshot + comparison report (retry after 3 min if needed)
#   10. List SCM devices AFTER migration
#   11. Generate CSV and HTML reports in ./overall_reports/
#
# Usage:
#   All firewalls:
#     ansible-playbook playbooks/scm_migration.yml --vault-password-file .vault_pass
#
#   Single firewall:
#     ansible-playbook playbooks/scm_migration.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab-firewall01
# =============================================================================


# =============================================================================
# STEP 1 — List SCM devices BEFORE migration
# =============================================================================
- name: "STEP 1 — List SCM devices before migration"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/scm_credentials.yml

  tasks:

    - name: "SCM AUTH — Obtain SCM token"
      ansible.builtin.include_role:
        name: scm_auth

    - name: "SCM LIST — Query registered devices"
      ansible.builtin.uri:
        url: "https://paas-11.prod.panorama.paloaltonetworks.com/ngfw/api/v1/devices"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
        status_code: [200, 201]
        return_content: true
      register: scm_before_response
      ignore_errors: true

    - name: "SCM LIST — Save pre-migration device list"
      ansible.builtin.set_fact:
        scm_devices_before: "{{ scm_before_response.json | default([]) }}"

    - name: "SCM LIST — Display devices before migration"
      ansible.builtin.debug:
        msg: "Serial: {{ item.id }} | Hostname: {{ item.hostname | default('N/A') }} | Connected: {{ item.is_connected | default('N/A') }} | SW: {{ item.software_version | default('N/A') }}"
      loop: "{{ scm_devices_before }}"
      when: scm_devices_before | length > 0

    - name: "SCM LIST — No devices registered yet"
      ansible.builtin.debug:
        msg: "No devices currently registered in SCM."
      when: scm_devices_before | length == 0


# =============================================================================
# STEP 2 — Backup firewall configurations + collect serial numbers
# =============================================================================
- name: "STEP 2 — Backup firewall configurations"
  hosts: firewalls
  connection: local
  gather_facts: true

  vars:
    config_backup_dir: "./firewalls_backups"
    command_output_dir: "./command_outputs"
    operational_commands:
      - "show system info"
      - "show system disk-space"

  tasks:

    - name: "INIT — Initialize result facts for all steps"
      ansible.builtin.set_fact:
        result_backup: "PENDING"
        result_pre_snapshot: "PENDING"
        result_remove_panorama: "PENDING"
        result_cloud_service: "PENDING"
        result_hostname_change: "PENDING"
        result_claim: "PENDING"
        result_post_snapshot: "PENDING"
        needs_post_retry: false
        device_serial: "UNKNOWN"
        device_hostname_original: "UNKNOWN"
        device_hostname_new: "UNKNOWN"

    - name: "INIT — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - name: "BACKUP — Get system info (serial + hostname)"
      paloaltonetworks.panos.panos_op:
        provider: "{{ provider }}"
        cmd: "show system info"
      register: system_info_raw
      ignore_errors: true

    - name: "BACKUP — Extract serial number and hostname"
      ansible.builtin.set_fact:
        device_serial: "{{ (system_info_raw.stdout | from_json).response.result.system.serial }}"
        device_hostname_original: "{{ (system_info_raw.stdout | from_json).response.result.system.hostname }}"
      when: system_info_raw is succeeded

    - name: "BACKUP — Create backup directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ config_backup_dir }}"
        - "{{ command_output_dir }}"
      delegate_to: localhost
      run_once: true

    - block:

        - name: "BACKUP — Export running configuration"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: '<show><config><running></running></config></show>'
            cmd_is_xml: true
          register: running_config_output

        - name: "BACKUP — Save running config as YAML"
          ansible.builtin.copy:
            content: |
              # Running Configuration for {{ inventory_hostname }}
              # Exported: {{ ansible_date_time.iso8601 | default('N/A') }}
              # Source: {{ panorama_host }}

              {{ (running_config_output.stdout | from_json).response.result.config | to_nice_yaml(indent=2, width=120) }}
            dest: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.yaml"
            mode: '0644'
          delegate_to: localhost

        - name: "BACKUP — Save running config as XML"
          ansible.builtin.copy:
            content: "{{ running_config_output.stdout_xml }}"
            dest: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.xml"
            mode: '0644'
          delegate_to: localhost

        - name: "BACKUP — Run operational commands"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "{{ item }}"
          register: command_results
          loop: "{{ operational_commands }}"

        - name: "BACKUP — Save command outputs"
          ansible.builtin.copy:
            content: "{{ command_results.results | map(attribute='stdout_xml') | join('\n\n---\n\n') }}"
            dest: "{{ command_output_dir }}/command-output-{{ inventory_hostname }}.txt"
            mode: '0644'
          delegate_to: localhost

        - name: "BACKUP — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_backup: "SUCCESS"

      rescue:

        - name: "BACKUP — Mark step FAILED"
          ansible.builtin.set_fact:
            result_backup: "FAILED"


# =============================================================================
# STEP 3 — Pre-migration snapshot
# =============================================================================
- name: "STEP 3 — Pre-migration snapshot"
  hosts: firewalls
  connection: local
  gather_facts: false

  vars:
    snapshot_directory: "./snapshots"

  tasks:

    - name: "PRE-SNAP — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "PRE-SNAP — Take pre-migration snapshot"
          ansible.builtin.include_role:
            name: take_snapshot
          vars:
            snapshot_filename: "pre_snapshot_{{ connection_id }}"

        - name: "PRE-SNAP — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_pre_snapshot: "SUCCESS"

      rescue:

        - name: "PRE-SNAP — Mark step FAILED"
          ansible.builtin.set_fact:
            result_pre_snapshot: "FAILED"


# =============================================================================
# STEP 4 — Remove Panorama management from firewalls
# =============================================================================
- name: "STEP 4 — Remove Panorama management"
  hosts: firewalls
  connection: local
  gather_facts: false

  tasks:

    - name: "RM-PANO — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "RM-PANO — Remove primary Panorama server IP"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama-server"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove secondary Panorama server IP"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama-server-2"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove Panorama server block (alternate xpath)"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/panorama-server"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove secondary Panorama server block (alternate xpath)"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/panorama-server-2"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove log collector enabled flag"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/log-collector-enabled"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove log forwarding profile"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/log-forwarding-profile"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove log export schedule"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/log-export-schedule"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove Panorama device-group metadata"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/local-panorama"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Remove Panorama managed config block"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/panorama"
            state: absent
          ignore_errors: true

        - name: "RM-PANO — Commit configuration"
          paloaltonetworks.panos.panos_commit_firewall:
            provider: "{{ provider }}"
            description: "Remove Panorama management - migrating to SCM"

        - name: "RM-PANO — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_remove_panorama: "SUCCESS"

      rescue:

        - name: "RM-PANO — Mark step FAILED"
          ansible.builtin.set_fact:
            result_remove_panorama: "FAILED"


# =============================================================================
# STEP 5 — Set Panorama cloud-service
# =============================================================================
- name: "STEP 5 — Set Panorama cloud-service"
  hosts: firewalls
  connection: local
  gather_facts: false

  tasks:

    - name: "CLOUD-SVC — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "CLOUD-SVC — Set Panorama cloud-service element"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama"
            element: '<cloud-service/>'

        - name: "CLOUD-SVC — Commit configuration"
          paloaltonetworks.panos.panos_commit_firewall:
            provider: "{{ provider }}"
            description: "Set Panorama cloud-service via Ansible"

        - name: "CLOUD-SVC — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_cloud_service: "SUCCESS"

      rescue:

        - name: "CLOUD-SVC — Mark step FAILED"
          ansible.builtin.set_fact:
            result_cloud_service: "FAILED"


# =============================================================================
# STEP 6 — Change hostname (prefix SCMMANAGED- to original hostname)
# Implements the same outcome as upload_partial_config.yml but using
# panos_config_element for a targeted, per-device change.
# =============================================================================
- name: "STEP 6 — Change hostname (add SCMMANAGED prefix)"
  hosts: firewalls
  connection: local
  gather_facts: false

  tasks:

    - name: "HOSTNAME — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "HOSTNAME — Get current hostname from device"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "show system info"
          register: hostname_info

        - name: "HOSTNAME — Build new hostname with SCMMANAGED prefix"
          ansible.builtin.set_fact:
            device_hostname_original: "{{ (hostname_info.stdout | from_json).response.result.system.hostname }}"
            device_hostname_new: "SCMMANAGED-{{ (hostname_info.stdout | from_json).response.result.system.hostname }}"

        - name: "HOSTNAME — Display hostname change"
          ansible.builtin.debug:
            msg: "Changing hostname: {{ device_hostname_original }} -> {{ device_hostname_new }}"

        - name: "HOSTNAME — Set new hostname via config element"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
            element: "<hostname>{{ device_hostname_new }}</hostname>"

        - name: "HOSTNAME — Commit configuration"
          paloaltonetworks.panos.panos_commit_firewall:
            provider: "{{ provider }}"
            description: "Rename hostname to {{ device_hostname_new }}"

        - name: "HOSTNAME — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_hostname_change: "SUCCESS"

      rescue:

        - name: "HOSTNAME — Mark step FAILED"
          ansible.builtin.set_fact:
            result_hostname_change: "FAILED"


# =============================================================================
# STEP 7 — Claim devices to SCM
# Collects serial numbers from all firewall hostvars gathered in Step 2.
# =============================================================================
- name: "STEP 7 — Claim devices to SCM"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/scm_credentials.yml

  tasks:

    - name: "CLAIM — Collect serial numbers from migration hosts"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ groups['firewalls']
             | map('extract', hostvars, 'device_serial')
             | reject('equalto', 'UNKNOWN')
             | list }}

    - name: "CLAIM — Display devices to be claimed"
      ansible.builtin.debug:
        msg:
          - "=== Claiming devices to SCM ==="
          - "Serial numbers: {{ migration_serials }}"

    - name: "CLAIM — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - block:

        - name: "CLAIM — Claim devices to SCM"
          ansible.builtin.uri:
            url: "https://admin.prod.panorama.paloaltonetworks.com/api/v2/device-registrations/claim"
            method: POST
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              devices: "{{ migration_serials }}"
              labels: []
            status_code: [200, 201]
            return_content: true
          register: claim_response
          when: migration_serials | length > 0

        - name: "CLAIM — Display claim results"
          ansible.builtin.debug:
            var: claim_response.json
          when: claim_response is not skipped

        - name: "CLAIM — Mark claim SUCCESS"
          ansible.builtin.set_fact:
            claim_result_localhost: "SUCCESS"

      rescue:

        - name: "CLAIM — Mark claim FAILED"
          ansible.builtin.set_fact:
            claim_result_localhost: "FAILED"

# --- Propagate claim result to firewall hosts ---
- name: "STEP 7b — Propagate claim result to firewall hosts"
  hosts: firewalls
  connection: local
  gather_facts: false

  tasks:

    - name: "CLAIM — Set claim result on each firewall host"
      ansible.builtin.set_fact:
        result_claim: "{{ hostvars['localhost'].claim_result_localhost | default('SKIPPED') }}"


# =============================================================================
# STEP 8 — Wait 5 minutes for SCM bootstrap
# =============================================================================
- name: "STEP 8 — Wait for SCM bootstrap"
  hosts: localhost
  gather_facts: false

  tasks:

    - name: "BOOTSTRAP — Wait 5 minutes for SCM bootstrap to complete"
      ansible.builtin.pause:
        minutes: 5
        prompt: "Waiting 5 minutes for SCM bootstrap to complete..."


# =============================================================================
# STEP 9 — Post-migration snapshot + report (first attempt)
# =============================================================================
- name: "STEP 9 — Post-migration snapshot (attempt 1)"
  hosts: firewalls
  connection: local
  gather_facts: false
  ignore_unreachable: true

  vars:
    snapshot_directory: "./snapshots"

  tasks:

    - name: "POST-SNAP — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "POST-SNAP — Take post-migration snapshot"
          ansible.builtin.include_role:
            name: take_snapshot
          vars:
            snapshot_filename: "post_snapshot_{{ connection_id }}"

        - name: "POST-SNAP — Compare pre and post snapshots"
          ansible.builtin.include_role:
            name: snapshot_report_from_files
          vars:
            left_snapshot: "pre_snapshot_{{ connection_id }}"
            right_snapshot: "post_snapshot_{{ connection_id }}"
            report_output_file: "{{ connection_id }}_comparison_report.json"

        - name: "POST-SNAP — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_post_snapshot: "SUCCESS"
            needs_post_retry: false

      rescue:

        - name: "POST-SNAP — Mark as needing retry"
          ansible.builtin.set_fact:
            result_post_snapshot: "PENDING_RETRY"
            needs_post_retry: true


# =============================================================================
# STEP 10 — Post-migration snapshot retry (3 min wait for unreachable hosts)
# =============================================================================
- name: "STEP 10 — Post-migration snapshot retry (if needed)"
  hosts: firewalls
  connection: local
  gather_facts: false
  ignore_unreachable: true

  vars:
    snapshot_directory: "./snapshots"

  tasks:

    - name: "RETRY — Skip host if no retry needed"
      ansible.builtin.meta: end_host
      when: not (hostvars[inventory_hostname].needs_post_retry | default(false))

    - name: "RETRY — Wait 3 minutes before retrying"
      ansible.builtin.pause:
        minutes: 3
        prompt: "Host {{ inventory_hostname }} needs retry. Waiting 3 minutes..."

    - name: "RETRY — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "RETRY — Take post-migration snapshot"
          ansible.builtin.include_role:
            name: take_snapshot
          vars:
            snapshot_filename: "post_snapshot_{{ connection_id }}"

        - name: "RETRY — Compare pre and post snapshots"
          ansible.builtin.include_role:
            name: snapshot_report_from_files
          vars:
            left_snapshot: "pre_snapshot_{{ connection_id }}"
            right_snapshot: "post_snapshot_{{ connection_id }}"
            report_output_file: "{{ connection_id }}_comparison_report.json"

        - name: "RETRY — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_post_snapshot: "SUCCESS"
            needs_post_retry: false

      rescue:

        - name: "RETRY — Mark step FAILED (retry also failed)"
          ansible.builtin.set_fact:
            result_post_snapshot: "FAILED"
            needs_post_retry: false


# =============================================================================
# STEP 11 — List SCM devices AFTER migration + generate CSV and HTML reports
# =============================================================================
- name: "STEP 11 — List SCM devices after migration and generate reports"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/scm_credentials.yml

  vars:
    report_dir: "./overall_reports"

  tasks:

    - name: "AFTER — Set report timestamp"
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: "AFTER — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - name: "AFTER — Query registered devices"
      ansible.builtin.uri:
        url: "https://paas-11.prod.panorama.paloaltonetworks.com/ngfw/api/v1/devices"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
        status_code: [200, 201]
        return_content: true
      register: scm_after_response
      ignore_errors: true

    - name: "AFTER — Save post-migration device list"
      ansible.builtin.set_fact:
        scm_devices_after: "{{ scm_after_response.json | default([]) }}"

    - name: "AFTER — Display SCM devices after migration"
      ansible.builtin.debug:
        msg: "Serial: {{ item.id }} | Hostname: {{ item.hostname | default('N/A') }} | Connected: {{ item.is_connected | default('N/A') }} | SW: {{ item.software_version | default('N/A') }}"
      loop: "{{ scm_devices_after }}"
      when: scm_devices_after | length > 0

    # -------------------------------------------------------------------------
    # Build migration results list from hostvars
    # -------------------------------------------------------------------------
    - name: "REPORT — Collect migration results from all firewall hosts"
      ansible.builtin.set_fact:
        migration_results: >-
          {{ migration_results | default([]) + [{
            'host':               item,
            'ip':                 hostvars[item].panorama_host       | default('N/A'),
            'serial':             hostvars[item].device_serial        | default('UNKNOWN'),
            'hostname_original':  hostvars[item].device_hostname_original | default('UNKNOWN'),
            'hostname_new':       hostvars[item].device_hostname_new  | default('UNKNOWN'),
            'backup':             hostvars[item].result_backup         | default('NOT RUN'),
            'pre_snapshot':       hostvars[item].result_pre_snapshot   | default('NOT RUN'),
            'remove_panorama':    hostvars[item].result_remove_panorama| default('NOT RUN'),
            'cloud_service':      hostvars[item].result_cloud_service  | default('NOT RUN'),
            'hostname_change':    hostvars[item].result_hostname_change | default('NOT RUN'),
            'claim':              hostvars[item].result_claim          | default('NOT RUN'),
            'post_snapshot':      hostvars[item].result_post_snapshot  | default('NOT RUN')
          }] }}
      loop: "{{ groups['firewalls'] }}"

    # -------------------------------------------------------------------------
    # Create output directory
    # -------------------------------------------------------------------------
    - name: "REPORT — Create overall_reports directory"
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # CSV report
    # -------------------------------------------------------------------------
    - name: "REPORT — Generate CSV report"
      ansible.builtin.copy:
        dest: "{{ report_dir }}/migration_report_{{ report_timestamp }}.csv"
        mode: '0644'
        content: |
          Device,IP Address,Serial,Original Hostname,New Hostname,Backup,Pre-Snapshot,Remove Panorama,Cloud Service,Hostname Change,Claim to SCM,Post-Snapshot
          {% for r in migration_results %}
          {{ r.host }},{{ r.ip }},{{ r.serial }},{{ r.hostname_original }},{{ r.hostname_new }},{{ r.backup }},{{ r.pre_snapshot }},{{ r.remove_panorama }},{{ r.cloud_service }},{{ r.hostname_change }},{{ r.claim }},{{ r.post_snapshot }}
          {% endfor %}

    # -------------------------------------------------------------------------
    # HTML report
    # -------------------------------------------------------------------------
    - name: "REPORT — Generate HTML report"
      ansible.builtin.copy:
        dest: "{{ report_dir }}/migration_report_{{ report_timestamp }}.html"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SCM Migration Report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; color: #333; }
              h1 { color: #2c3e50; border-bottom: 3px solid #2c3e50; padding-bottom: 8px; }
              h2 { color: #34495e; margin-top: 40px; }
              p.meta { color: #666; font-size: 13px; }
              table { border-collapse: collapse; width: 100%; background: #fff;
                      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
              th { background: #2c3e50; color: #fff; padding: 10px 14px;
                   text-align: left; font-size: 13px; white-space: nowrap; }
              td { padding: 9px 14px; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
              tr:last-child td { border-bottom: none; }
              tr:hover td { background: #f0f4f8; }
              .badge { display: inline-block; border-radius: 4px; padding: 3px 9px;
                       font-size: 12px; font-weight: bold; white-space: nowrap; }
              .SUCCESS       { background: #d4edda; color: #155724; }
              .FAILED        { background: #f8d7da; color: #721c24; }
              .PENDING_RETRY { background: #fff3cd; color: #856404; }
              .PENDING       { background: #fff3cd; color: #856404; }
              .NOT_RUN       { background: #e2e3e5; color: #383d41; }
              .SKIPPED       { background: #e2e3e5; color: #383d41; }
              .UNKNOWN       { background: #e2e3e5; color: #383d41; }
            </style>
          </head>
          <body>

            <h1>SCM Migration Report</h1>
            <p class="meta">Generated: {{ report_timestamp }} &nbsp;|&nbsp; Devices processed: {{ migration_results | length }}</p>

            <h2>Migration Steps Summary</h2>
            <table>
              <thead>
                <tr>
                  <th>Device</th>
                  <th>IP Address</th>
                  <th>Serial</th>
                  <th>Original Hostname</th>
                  <th>New Hostname</th>
                  <th>Backup</th>
                  <th>Pre-Snapshot</th>
                  <th>Remove Panorama</th>
                  <th>Cloud Service</th>
                  <th>Hostname Change</th>
                  <th>Claim to SCM</th>
                  <th>Post-Snapshot</th>
                </tr>
              </thead>
              <tbody>
                {% for r in migration_results %}
                <tr>
                  <td><strong>{{ r.host }}</strong></td>
                  <td>{{ r.ip }}</td>
                  <td>{{ r.serial }}</td>
                  <td>{{ r.hostname_original }}</td>
                  <td>{{ r.hostname_new }}</td>
                  <td><span class="badge {{ r.backup | replace(' ', '_') | replace('-', '_') }}">{{ r.backup }}</span></td>
                  <td><span class="badge {{ r.pre_snapshot | replace(' ', '_') | replace('-', '_') }}">{{ r.pre_snapshot }}</span></td>
                  <td><span class="badge {{ r.remove_panorama | replace(' ', '_') | replace('-', '_') }}">{{ r.remove_panorama }}</span></td>
                  <td><span class="badge {{ r.cloud_service | replace(' ', '_') | replace('-', '_') }}">{{ r.cloud_service }}</span></td>
                  <td><span class="badge {{ r.hostname_change | replace(' ', '_') | replace('-', '_') }}">{{ r.hostname_change }}</span></td>
                  <td><span class="badge {{ r.claim | replace(' ', '_') | replace('-', '_') }}">{{ r.claim }}</span></td>
                  <td><span class="badge {{ r.post_snapshot | replace(' ', '_') | replace('-', '_') }}">{{ r.post_snapshot }}</span></td>
                </tr>
                {% endfor %}
              </tbody>
            </table>

            <h2>SCM Devices — Before Migration</h2>
            {% if scm_devices_before | default([]) | length > 0 %}
            <table>
              <thead>
                <tr><th>Serial</th><th>Hostname</th><th>Model</th><th>Connected</th><th>Software Version</th></tr>
              </thead>
              <tbody>
                {% for d in scm_devices_before | default([]) %}
                <tr>
                  <td>{{ d.id | default('N/A') }}</td>
                  <td>{{ d.hostname | default('N/A') }}</td>
                  <td>{{ d.model | default('N/A') }}</td>
                  <td>{{ d.is_connected | default('N/A') }}</td>
                  <td>{{ d.software_version | default('N/A') }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
            {% else %}
            <p><em>No devices were registered in SCM before migration.</em></p>
            {% endif %}

            <h2>SCM Devices — After Migration</h2>
            {% if scm_devices_after | default([]) | length > 0 %}
            <table>
              <thead>
                <tr><th>Serial</th><th>Hostname</th><th>Model</th><th>Connected</th><th>Software Version</th></tr>
              </thead>
              <tbody>
                {% for d in scm_devices_after | default([]) %}
                <tr>
                  <td>{{ d.id | default('N/A') }}</td>
                  <td>{{ d.hostname | default('N/A') }}</td>
                  <td>{{ d.model | default('N/A') }}</td>
                  <td>{{ d.is_connected | default('N/A') }}</td>
                  <td>{{ d.software_version | default('N/A') }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
            {% else %}
            <p><em>No devices found in SCM after migration.</em></p>
            {% endif %}

          </body>
          </html>

    # -------------------------------------------------------------------------
    # Final summary
    # -------------------------------------------------------------------------
    - name: "REPORT — Display report file locations"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "  SCM Migration Complete"
          - "=========================================="
          - "  CSV  : {{ report_dir }}/migration_report_{{ report_timestamp }}.csv"
          - "  HTML : {{ report_dir }}/migration_report_{{ report_timestamp }}.html"
          - "=========================================="
