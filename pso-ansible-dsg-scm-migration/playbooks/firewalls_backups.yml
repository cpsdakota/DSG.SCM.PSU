---
- hosts: 'firewalls'
  strategy: linear
  connection: local
  gather_facts: true

  vars:
    # Directory for configuration backups
    config_backup_dir: "firewalls_backups"
    # Directory for command outputs
    command_output_dir: "command_outputs"
    # List of operational commands to run (easily extensible)
    operational_commands:
      - "show clock"
      - "show session info"
      - "show interface all"
      - "show vpn flow"
      - "show vpn ipsec-sa"
      - "show vpn ike-sa"
      - "show arp all"
      - "show routing resource"
      - "show routing fib"
      - "show routing route"
      - "show routing protocol ospf area virtual-router default"
      - "show routing protocol ospf dumplsdb virtual-router default"
      - "show routing protocol ospf graceful-restart virtual-router default"
      - "show routing protocol ospf interface virtual-router default"
      - "show routing protocol ospf lsdb virtual-router default"
      - "show routing protocol ospf neighbor virtual-router default"
      - "show routing protocol ospf summary virtual-router default"
      - "show routing protocol ospf virt-link virtual-router default"
      - "show routing protocol ospf virt-neighbor virtual-router default"
      - "show routing protocol bgp summary"
      - "show routing protocol bgp peer"
      - "show routing protocol bgp peer-group"
      - "show routing protocol bgp policy aggregate"
      - "show routing protocol bgp policy cond-adv"
      - "show routing protocol bgp policy import"
      - "show routing protocol bgp policy export"
      - "show routing protocol bgp loc-rib"
      - "show routing protocol bgp loc-rib-detail"
      - "show routing protocol bgp rib-out"
      - "show routing protocol bgp rib-out-detail"
      - "show routing multicast route"
      - "show routing multicast fib"
      - "show routing multicast group-permission"
      - "show routing multicast igmp interface"
      - "show routing multicast igmp membership"
      - "show routing multicast igmp statistics"
      - "show routing multicast pim state"
      - "show routing multicast pim statistics"
      - "show routing multicast pim neighbor"
    # Optional: filter specific firewalls via variable
    # firewall_list: ["pedropano-lab-firewall01", "pedropano-lab-firewall02"]

  tasks:

  - name: 'Check if running for specific firewalls only'
    ansible.builtin.set_fact:
      run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

  - name: 'Skip host if not in firewall_list'
    ansible.builtin.meta: end_host
    when: not (run_for_this_host | bool)

  - name: 'Set target firewall provider information'
    ansible.builtin.set_fact:
      target_device:
        name: '{{ inventory_hostname }}'
        provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
    no_log: true

  - name: 'Display backup target information'
    ansible.builtin.debug:
      msg:
        - "=== Starting Backup for Firewall ==="
        - "Firewall: {{ inventory_hostname }}"
        - "IP Address: {{ panorama_host }}"
        - "Config Backup Directory: {{ config_backup_dir }}"
        - "Command Output Directory: {{ command_output_dir }}"
        - "Commands to run: {{ operational_commands | length }}"

  # ==========================================
  # Create Backup Directories
  # ==========================================

  - name: 'Create configuration backup directory'
    ansible.builtin.file:
      path: "{{ config_backup_dir }}"
      state: directory
      mode: '0755'
    delegate_to: localhost
    run_once: true

  - name: 'Create command output directory'
    ansible.builtin.file:
      path: "{{ command_output_dir }}"
      state: directory
      mode: '0755'
    delegate_to: localhost
    run_once: true

  # ==========================================
  # Export Running Configuration
  # ==========================================

  - name: 'Export running configuration from firewall'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: '<show><config><running></running></config></show>'
      cmd_is_xml: true
    register: running_config_output

  - name: 'Save running configuration in human-readable YAML format'
    ansible.builtin.copy:
      content: |
        # Running Configuration for {{ inventory_hostname }}
        # Exported: {{ ansible_date_time.iso8601 | default('N/A') }}
        # Source: PAN-OS Firewall {{ panorama_host }}

        {{ (running_config_output.stdout | from_json).response.result.config | to_nice_yaml(indent=2, width=120) }}
      dest: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.yaml"
      mode: '0644'
    delegate_to: localhost

  - name: 'Save running configuration as XML'
    ansible.builtin.copy:
      content: "{{ running_config_output.stdout_xml }}"
      dest: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.xml"
      mode: '0644'
    delegate_to: localhost

  - name: 'Display running config backup status'
    ansible.builtin.debug:
      msg:
        - "Running configuration backed up to {{ config_backup_dir }}/running-config-{{ inventory_hostname }}.yaml"
        - "Running configuration XML saved to {{ config_backup_dir }}/running-config-{{ inventory_hostname }}.xml"

  # ==========================================
  # Export Merged Running Configuration
  # ==========================================

  - name: 'Export merged running configuration from firewall'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: '<show><config><merged></merged></config></show>'
      cmd_is_xml: true
    register: merged_config_output
    ignore_errors: true

  - name: 'Save merged configuration in human-readable YAML format'
    ansible.builtin.copy:
      content: |
        # Merged Running Configuration for {{ inventory_hostname }}
        # Exported: {{ ansible_date_time.iso8601 | default('N/A') }}
        # Source: PAN-OS Firewall {{ panorama_host }}
        # Note: This includes Panorama template and local device configuration merged together

        {{ (merged_config_output.stdout | from_json).response.result.config | to_nice_yaml(indent=2, width=120) }}
      dest: "{{ config_backup_dir }}/merged-running-config-{{ inventory_hostname }}.yaml"
      mode: '0644'
    delegate_to: localhost
    when: merged_config_output is succeeded

  - name: 'Save merged configuration as XML'
    ansible.builtin.copy:
      content: "{{ merged_config_output.stdout_xml }}"
      dest: "{{ config_backup_dir }}/merged-running-config-{{ inventory_hostname }}.xml"
      mode: '0644'
    delegate_to: localhost
    when: merged_config_output is succeeded

  - name: 'Display merged config backup status'
    ansible.builtin.debug:
      msg:
        - "Merged running configuration backed up to {{ config_backup_dir }}/merged-running-config-{{ inventory_hostname }}.yaml"
        - "Merged running configuration XML saved to {{ config_backup_dir }}/merged-running-config-{{ inventory_hostname }}.xml"
    when: merged_config_output is succeeded

  - name: 'Display warning if merged config not available'
    ansible.builtin.debug:
      msg: "WARNING: Merged running configuration not available or failed to export"
    when: merged_config_output is failed

  # ==========================================
  # Run Operational Commands
  # ==========================================

  - name: 'Run operational commands on firewall'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: '{{ item }}'
    register: command_results
    loop: "{{ operational_commands }}"
    loop_control:
      label: "{{ item }}"
    ignore_errors: true

  - name: 'Parse and format command outputs'
    ansible.builtin.set_fact:
      parsed_commands: >-
        {{
          parsed_commands | default([]) + [{
            'command': item.item,
            'output': (item.stdout | from_json).response.result if ((item.stdout | from_json).response.result is string) else ((item.stdout | from_json).response.result | to_nice_yaml(indent=2))
          }]
        }}
    loop: "{{ command_results.results }}"
    loop_control:
      label: "{{ item.item }}"
    when: item is succeeded

  - name: 'Build formatted command output file content'
    ansible.builtin.set_fact:
      formatted_output: |
        {% for cmd in parsed_commands %}

        {{ cmd.command }}

        {{ cmd.output }}
        {% endfor %}

  - name: 'Save command outputs to local file'
    ansible.builtin.copy:
      content: "{{ formatted_output }}"
      dest: "{{ command_output_dir }}/command-output-{{ inventory_hostname }}.txt"
      mode: '0644'
    delegate_to: localhost

  - name: 'Display command output file status'
    ansible.builtin.debug:
      msg: "Command outputs saved to {{ command_output_dir }}/command-output-{{ inventory_hostname }}.txt"

  # ==========================================
  # Final Summary
  # ==========================================

  - name: 'Display backup completion summary'
    ansible.builtin.debug:
      msg:
        - "=== Backup Complete for {{ inventory_hostname }} ==="
        - "Configuration Files (YAML - human readable):"
        - "  - {{ config_backup_dir }}/running-config-{{ inventory_hostname }}.yaml"
        - "  - {{ config_backup_dir }}/merged-running-config-{{ inventory_hostname }}.yaml"
        - "Configuration Files (XML - raw):"
        - "  - {{ config_backup_dir }}/running-config-{{ inventory_hostname }}.xml"
        - "  - {{ config_backup_dir }}/merged-running-config-{{ inventory_hostname }}.xml"
        - "Command Output File:"
        - "  - {{ command_output_dir }}/command-output-{{ inventory_hostname }}.txt"
        - "Commands Executed: {{ operational_commands | length }}"
