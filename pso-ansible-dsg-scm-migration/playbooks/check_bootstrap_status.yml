---
- name: Check SCM bootstrap status for on-prem devices
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/scm_credentials.yml
  vars:
    # Optional: filter output to a specific serial number
    # device_serial: "007957000834879"

    # SCM folder scope (default "All" covers every device in the tenant)
    scm_folder: "All"

    # Set wait_for_completion=true to keep polling until bootstrap=done.
    # Requires device_serial to be provided.
    wait_for_completion: false
    poll_retries: 20    # max retry attempts
    poll_delay: 30      # seconds between retries  (20 × 30 = 10 min max)

    scm_ngfw_base_url: "https://paas-16.prod.panorama.paloaltonetworks.com"

  tasks:

    - name: Authenticate with SCM
      ansible.builtin.include_role:
        name: scm_auth

    - name: Require device_serial when wait_for_completion is enabled
      ansible.builtin.assert:
        that:
          - device_serial is defined
          - device_serial | length > 0
        fail_msg: "'device_serial' must be provided via -e when wait_for_completion=true"
      when: wait_for_completion | bool

    # ==========================================
    # Bootstrap status — single check or polling
    # When wait_for_completion=false : retries=0 → runs once
    # When wait_for_completion=true  : retries up to poll_retries,
    #   until the target device reaches bootstrap=done
    # ==========================================

    - name: Fetch bootstrap status from SCM
      ansible.builtin.uri:
        url: "{{ scm_ngfw_base_url }}/ngfw/api/bootstrap/getbootstrapstatus?folder={{ scm_folder }}"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: bootstrap_response
      retries: "{{ poll_retries if (wait_for_completion | bool) else 0 }}"
      delay: "{{ poll_delay }}"
      until: >-
        (not (wait_for_completion | bool)) or
        ((bootstrap_response.content | from_json) |
         selectattr('serial', 'equalto', device_serial) |
         map(attribute='bootstrap') | first | default('unknown')) == 'done'

    # ==========================================
    # Filter and display results
    # ==========================================

    - name: Parse bootstrap API response
      ansible.builtin.set_fact:
        bootstrap_data: "{{ bootstrap_response.content | from_json }}"

    - name: Build device status list (all devices)
      ansible.builtin.set_fact:
        device_statuses: "{{ bootstrap_data }}"
      when: device_serial is not defined

    - name: Build device status list (filtered to requested serial)
      ansible.builtin.set_fact:
        device_statuses: "{{ bootstrap_data | selectattr('serial', 'equalto', device_serial) | list }}"
      when: device_serial is defined

    - name: Warn if requested serial not found in response
      ansible.builtin.debug:
        msg: >-
          WARNING: Serial '{{ device_serial }}' not found in the bootstrap response
          under folder '{{ scm_folder }}'. Verify the device has been claimed and
          is visible in SCM.
      when:
        - device_serial is defined
        - device_statuses | length == 0

    - name: Display bootstrap status per device
      ansible.builtin.debug:
        msg:
          - "Serial:    {{ item.serial }}"
          - "Bootstrap: {{ item.bootstrap | upper }}"
          - "Status:    {{ item.status }}"
      loop: "{{ device_statuses }}"
      loop_control:
        label: "{{ item.serial }}"

    # ==========================================
    # Summary
    # ==========================================

    - name: "Summary: all devices completed bootstrap"
      ansible.builtin.debug:
        msg: "All {{ device_statuses | length }} device(s) have completed bootstrap successfully."
      when:
        - device_statuses | length > 0
        - (device_statuses | rejectattr('bootstrap', 'equalto', 'done') | list | length) == 0

    - name: "Summary: devices still bootstrapping"
      ansible.builtin.debug:
        msg: >-
          {{ device_statuses | rejectattr('bootstrap', 'equalto', 'done') | list | length }}
          device(s) still in progress:
          {{ device_statuses | rejectattr('bootstrap', 'equalto', 'done') | map(attribute='serial') | list | join(', ') }}
      when:
        - device_statuses | length > 0
        - (device_statuses | rejectattr('bootstrap', 'equalto', 'done') | list | length) > 0
