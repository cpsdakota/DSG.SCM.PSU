---
# Remediation playbook: Enable and configure SLS (Strata Logging Service) and Device Telemetry
# on Palo Alto NGFW firewalls, then verify all health checks pass.
#
# This playbook performs:
#   1. Collect current state from the firewall
#   2. Display what is already configured vs what is missing
#   3. Apply ONLY the missing/disabled settings (idempotent)
#   4. Commit only if any changes were made
#   5. Wait for services to initialize (only if SLS was just enabled)
#   6. Re-collect state and verify all health checks
#
# Note: Device certificate and SLS certificate are automatically provisioned
# by SCM once the device is claimed and SLS forwarding is enabled.
#
# Usage:
#   All firewalls:
#     ansible-playbook playbooks/enable_sls_telemetry.yml --vault-password-file .vault_pass
#
#   Specific firewall:
#     ansible-playbook playbooks/enable_sls_telemetry.yml --vault-password-file .vault_pass \
#       -e 'firewall_list=["dicks-vmseries-lab-firewall02"]'
#
# Variables:
#   firewall_list    (optional) - list of specific firewalls to target
#   telemetry_region (optional) - telemetry region, default Americas

- hosts: 'firewalls'
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    # Optional: filter specific firewalls via variable
    # firewall_list: ["dicks-vmseries-lab-firewall01"]
    telemetry_region: "Americas"

  tasks:

  - name: 'Check if running for specific firewalls only'
    ansible.builtin.set_fact:
      run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

  - name: 'Skip host if not in firewall_list'
    ansible.builtin.meta: end_host
    when: not (run_for_this_host | bool)

  - name: 'Set target firewall provider information'
    ansible.builtin.set_fact:
      target_device:
        name: '{{ inventory_hostname }}'
        provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
    no_log: true

  - name: 'Display remediation target'
    ansible.builtin.debug:
      msg:
        - "=== SLS & Telemetry Remediation ==="
        - "Firewall         : {{ inventory_hostname }}"
        - "IP               : {{ panorama_host }}"
        - "Telemetry Region : {{ telemetry_region }}"

  # ==========================================
  # Step 1: Collect Current State
  # ==========================================

  - name: 'Get current Telemetry settings'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'show device-telemetry settings'
    register: telemetry_settings_raw
    ignore_errors: true

  - name: 'Get current SLS forwarding status'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'request logging-service-forwarding status'
    register: sls_status_raw
    ignore_errors: true

  - name: 'Parse current state'
    ansible.builtin.set_fact:
      current_telemetry: "{{ telemetry_settings_raw.stdout_xml | default('') }}"
      current_sls: "{{ sls_status_raw.stdout_xml | default('') }}"

  - name: 'Display current configuration state'
    ansible.builtin.debug:
      msg:
        - "=== Current State on {{ inventory_hostname }} ==="
        - "Telemetry Health Performance : {{ 'ALREADY ENABLED' if '<device-health-performance>yes</device-health-performance>' in current_telemetry else 'MISSING - will enable' }}"
        - "Telemetry Product Usage      : {{ 'ALREADY ENABLED' if '<product-usage>yes</product-usage>' in current_telemetry else 'MISSING - will enable' }}"
        - "Telemetry Threat Prevention  : {{ 'ALREADY ENABLED' if '<threat-prevention>yes</threat-prevention>' in current_telemetry else 'MISSING - will enable' }}"
        - "Telemetry Region             : {{ 'ALREADY SET to ' ~ telemetry_region if ('<region>' ~ telemetry_region ~ '</region>') in current_telemetry else 'MISSING - will set to ' ~ telemetry_region }}"
        - "SLS Forwarding               : {{ 'ALREADY ENABLED' if '<lcaas_enabled>Yes</lcaas_enabled>' in current_sls else 'MISSING - will enable' }}"

  # ==========================================
  # Step 2: Apply Only Missing Configuration
  # Telemetry settings use panos_config_element (schema supported).
  # SLS forwarding uses the XML API directly (not in schema for this PAN-OS version).
  # ==========================================

  - name: 'Enable Device Health Performance telemetry'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/device-telemetry"
      element: '<device-health-performance>yes</device-health-performance>'
    when: "'<device-health-performance>yes</device-health-performance>' not in current_telemetry"
    register: change_telemetry_health

  - name: 'Enable Product Usage telemetry'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/device-telemetry"
      element: '<product-usage>yes</product-usage>'
    when: "'<product-usage>yes</product-usage>' not in current_telemetry"
    register: change_telemetry_usage

  - name: 'Enable Threat Prevention telemetry'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/device-telemetry"
      element: '<threat-prevention>yes</threat-prevention>'
    when: "'<threat-prevention>yes</threat-prevention>' not in current_telemetry"
    register: change_telemetry_threat

  - name: 'Set Telemetry region'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/device-telemetry"
      element: '<region>{{ telemetry_region }}</region>'
    when: "('<region>' ~ telemetry_region ~ '</region>') not in current_telemetry"
    register: change_telemetry_region

  # panos_config_element fails for logging-service-forwarding (not in PAN-OS schema for this version).
  # Use the XML API directly via uri, bypassing module schema validation.
  - name: 'Get API key for SLS configuration'
    ansible.builtin.uri:
      url: "https://{{ panorama_host }}/api/?type=keygen&user={{ username | urlencode }}&password={{ password | urlencode }}"
      method: GET
      validate_certs: false
      return_content: true
    register: keygen_response
    no_log: true
    when: "'<lcaas_enabled>Yes</lcaas_enabled>' not in current_sls"

  - name: 'Parse API key'
    ansible.builtin.set_fact:
      fw_api_key: "{{ keygen_response.content | regex_search('<key>(.*?)</key>', '\\1') | first }}"
    no_log: true
    when: keygen_response is not skipped and keygen_response is succeeded

  - name: 'Enable SLS Logging Service forwarding via XML API'
    ansible.builtin.uri:
      url: >-
        https://{{ panorama_host }}/api/?type=config&action=set
        &xpath={{ "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system" | urlencode }}
        &element={{ "<logging-service-forwarding><enabled>yes</enabled></logging-service-forwarding>" | urlencode }}
        &key={{ fw_api_key | urlencode }}
      method: GET
      validate_certs: false
      return_content: true
    register: change_sls_forwarding
    ignore_errors: true
    when: "'<lcaas_enabled>Yes</lcaas_enabled>' not in current_sls and fw_api_key is defined"

  - name: 'Display SLS enable API response'
    ansible.builtin.debug:
      msg: "SLS enable result: {{ change_sls_forwarding.content | default('Skipped — already enabled') }}"
    when: change_sls_forwarding is not skipped

  # ==========================================
  # Step 3: Commit Only If Changes Were Made
  # ==========================================

  - name: 'Commit configuration changes'
    paloaltonetworks.panos.panos_commit_firewall:
      provider: '{{ target_device.provider }}'
      description: "Enable SLS and Device Telemetry"
    register: commit_result
    when: >
      (change_telemetry_health is not skipped and change_telemetry_health.changed) or
      (change_telemetry_usage is not skipped and change_telemetry_usage.changed) or
      (change_telemetry_threat is not skipped and change_telemetry_threat.changed) or
      (change_telemetry_region is not skipped and change_telemetry_region.changed) or
      (change_sls_forwarding is not skipped and change_sls_forwarding.status is defined and change_sls_forwarding.status == 200)

  - name: 'Display commit result'
    ansible.builtin.debug:
      msg: "{{ 'Configuration committed to ' ~ inventory_hostname if commit_result is not skipped else 'No changes needed — commit skipped' }}"

  # ==========================================
  # Step 4: Wait and Trigger SLS (only if SLS was just enabled)
  # ==========================================

  - name: 'Wait for SLS to initialize after enabling'
    ansible.builtin.pause:
      seconds: 30
      prompt: "Waiting 30 seconds for SLS to initialize on {{ inventory_hostname }}..."
    when: >
      change_sls_forwarding is not skipped and
      change_sls_forwarding.status is defined and
      change_sls_forwarding.status == 200 and
      'success' in (change_sls_forwarding.content | default(''))

  - name: 'Trigger SLS customer info pull'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'request logging-service-forwarding customerinfo show'
    register: sls_customerinfo_trigger
    ignore_errors: true
    when: >
      change_sls_forwarding is not skipped and
      change_sls_forwarding.status is defined and
      change_sls_forwarding.status == 200 and
      'success' in (change_sls_forwarding.content | default(''))

  # ==========================================
  # Step 5: Re-collect State for Verification
  # ==========================================

  - name: 'Get SLS forwarding status'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'request logging-service-forwarding status'
    register: sls_status_raw
    ignore_errors: true

  - name: 'Get SLS customer info'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'request logging-service-forwarding customerinfo show'
    register: sls_customerinfo_raw
    ignore_errors: true

  - name: 'Get Telemetry settings'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'show device-telemetry settings'
    register: telemetry_settings_raw
    ignore_errors: true

  - name: 'Get Telemetry stats (all categories)'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'show device-telemetry stats all'
    register: telemetry_stats_raw
    ignore_errors: true

  - name: 'Get Telemetry details'
    paloaltonetworks.panos.panos_op:
      provider: '{{ target_device.provider }}'
      cmd: 'show device-telemetry details'
    register: telemetry_details_raw
    ignore_errors: true

  - name: 'Parse verification outputs'
    ansible.builtin.set_fact:
      sls_text: "{{ sls_status_raw.stdout_xml | default('') }}"
      sls_customerinfo_text: "{{ sls_customerinfo_raw.stdout_xml | default('') }}"
      telemetry_settings_text: "{{ telemetry_settings_raw.stdout_xml | default('') }}"
      telemetry_stats_text: "{{ telemetry_stats_raw.stdout_xml | default('') }}"
      telemetry_details_text: "{{ telemetry_details_raw.stdout_xml | default('') }}"

  # ==========================================
  # Step 6: Health Checks (same as check_sls_telemetry.yml)
  # ==========================================

  - name: 'CHECK: SLS - Logging Service is licensed'
    ansible.builtin.assert:
      that:
        - "'<lcaas_licensed>Yes</lcaas_licensed>' in sls_text"
      fail_msg: "FAIL - Logging Service is NOT licensed on {{ inventory_hostname }}"
      success_msg: "PASS - Logging Service is licensed"
    ignore_errors: true
    register: check_sls_licensed

  - name: 'CHECK: SLS - Forwarding is enabled'
    ansible.builtin.assert:
      that:
        - "'<lcaas_enabled>Yes</lcaas_enabled>' in sls_text"
      fail_msg: "FAIL - Logging Service forwarding is NOT enabled on {{ inventory_hostname }}"
      success_msg: "PASS - Logging Service forwarding is enabled"
    ignore_errors: true
    register: check_sls_forwarding

  - name: 'CHECK: SLS - Certificate is present'
    ansible.builtin.assert:
      that:
        - "'No certificate found' not in sls_text"
      fail_msg: "FAIL - SLS certificate NOT found on {{ inventory_hostname }}"
      success_msg: "PASS - SLS certificate is present"
    ignore_errors: true
    register: check_sls_cert

  - name: 'CHECK: SLS - Customer info fetched (Ingest FQDN present)'
    ansible.builtin.assert:
      that:
        - "'<ingest-fqdn>' in sls_customerinfo_text"
      fail_msg: "FAIL - SLS customer info not fetched on {{ inventory_hostname }}. Service may need more time to connect."
      success_msg: "PASS - SLS customer info is present"
    ignore_errors: true
    register: check_sls_customerinfo

  - name: 'CHECK: SLS - License fetch status is Success'
    ansible.builtin.assert:
      that:
        - "'Successfully fetched license' in sls_text"
      fail_msg: "FAIL - SLS license fetch did not succeed on {{ inventory_hostname }}"
      success_msg: "PASS - SLS license fetch succeeded"
    ignore_errors: true
    register: check_sls_license_fetch

  - name: 'CHECK: Telemetry - Device certificate is valid'
    ansible.builtin.assert:
      that:
        - "'Device Certificate is valid' in telemetry_settings_text"
      fail_msg: "FAIL - Telemetry device certificate is NOT valid on {{ inventory_hostname }}"
      success_msg: "PASS - Telemetry device certificate is valid"
    ignore_errors: true
    register: check_telemetry_cert

  - name: 'CHECK: Telemetry - Device Health Performance is enabled'
    ansible.builtin.assert:
      that:
        - "'<device-health-performance>yes</device-health-performance>' in telemetry_settings_text"
      fail_msg: "FAIL - Device Health Performance telemetry is NOT enabled on {{ inventory_hostname }}"
      success_msg: "PASS - Device Health Performance telemetry is enabled"
    ignore_errors: true
    register: check_telemetry_health

  - name: 'CHECK: Telemetry - Product Usage is enabled'
    ansible.builtin.assert:
      that:
        - "'<product-usage>yes</product-usage>' in telemetry_settings_text"
      fail_msg: "FAIL - Product Usage telemetry is NOT enabled on {{ inventory_hostname }}"
      success_msg: "PASS - Product Usage telemetry is enabled"
    ignore_errors: true
    register: check_telemetry_usage

  - name: 'CHECK: Telemetry - Threat Prevention is enabled'
    ansible.builtin.assert:
      that:
        - "'<threat-prevention>yes</threat-prevention>' in telemetry_settings_text"
      fail_msg: "FAIL - Threat Prevention telemetry is NOT enabled on {{ inventory_hostname }}"
      success_msg: "PASS - Threat Prevention telemetry is enabled"
    ignore_errors: true
    register: check_telemetry_threat

  - name: 'CHECK: Telemetry - All categories reporting success'
    ansible.builtin.assert:
      that:
        - "telemetry_stats_text | regex_findall('<status>success</status>') | length >= 3"
      fail_msg: "FAIL - Not all telemetry categories are reporting success on {{ inventory_hostname }}. Stats may take a few minutes to report."
      success_msg: "PASS - All telemetry categories (health, usage, threat) are reporting success"
    ignore_errors: true
    register: check_telemetry_stats

  - name: 'CHECK: Telemetry - No failed upload attempts'
    ansible.builtin.assert:
      that:
        - "telemetry_stats_text | regex_findall('<num-of-failed-attempts>0</num-of-failed-attempts>') | length >= 3"
      fail_msg: "FAIL - One or more telemetry categories have failed upload attempts on {{ inventory_hostname }}"
      success_msg: "PASS - No failed telemetry upload attempts"
    ignore_errors: true
    register: check_telemetry_failures

  - name: 'CHECK: Telemetry - Send interval is configured'
    ansible.builtin.assert:
      that:
        - "telemetry_details_text | regex_findall('5-minute Interval') | length > 0"
      fail_msg: "FAIL - Telemetry 5-minute send interval is NOT enabled on {{ inventory_hostname }}"
      success_msg: "PASS - Telemetry 5-minute send interval is enabled"
    ignore_errors: true
    register: check_telemetry_interval

  # ==========================================
  # Step 7: Remediation & Verification Summary
  # ==========================================

  - name: 'Remediation & Verification Summary Report'
    ansible.builtin.debug:
      msg:
        - "╔══════════════════════════════════════════════════════╗"
        - "   SLS & TELEMETRY REMEDIATION REPORT"
        - "   Firewall : {{ inventory_hostname }}"
        - "   IP       : {{ panorama_host }}"
        - "╠══════════════════════════════════════════════════════╣"
        - "  STRATA LOGGING SERVICE (SLS)"
        - "  ├─ Licensed              : {{ '[PASS]' if not check_sls_licensed.failed else '[FAIL] - License not active' }}"
        - "  ├─ Forwarding Enabled    : {{ '[PASS]' if not check_sls_forwarding.failed else '[FAIL]' }}"
        - "  ├─ Certificate Present   : {{ '[PASS]' if not check_sls_cert.failed else '[FAIL]' }}"
        - "  ├─ Customer Info Fetched : {{ '[PASS]' if not check_sls_customerinfo.failed else '[FAIL] - May need more time to connect' }}"
        - "  └─ License Fetch Status  : {{ '[PASS]' if not check_sls_license_fetch.failed else '[FAIL]' }}"
        - "╠══════════════════════════════════════════════════════╣"
        - "  DEVICE TELEMETRY"
        - "  ├─ Certificate Valid       : {{ '[PASS]' if not check_telemetry_cert.failed else '[FAIL]' }}"
        - "  ├─ Health Performance      : {{ '[PASS]' if not check_telemetry_health.failed else '[FAIL]' }}"
        - "  ├─ Product Usage           : {{ '[PASS]' if not check_telemetry_usage.failed else '[FAIL]' }}"
        - "  ├─ Threat Prevention       : {{ '[PASS]' if not check_telemetry_threat.failed else '[FAIL]' }}"
        - "  ├─ All Stats Successful    : {{ '[PASS]' if not check_telemetry_stats.failed else '[PENDING] - Stats take a few minutes to report after enable' }}"
        - "  ├─ No Failed Uploads       : {{ '[PASS]' if not check_telemetry_failures.failed else '[FAIL]' }}"
        - "  └─ Send Interval (5-min)   : {{ '[PASS]' if not check_telemetry_interval.failed else '[FAIL]' }}"
        - "╠══════════════════════════════════════════════════════╣"
        - "  OVERALL : {{ '[ALL CHECKS PASSED]' if not (check_sls_licensed.failed or check_sls_forwarding.failed or check_sls_cert.failed or check_sls_customerinfo.failed or check_sls_license_fetch.failed or check_telemetry_cert.failed or check_telemetry_health.failed or check_telemetry_usage.failed or check_telemetry_threat.failed or check_telemetry_stats.failed or check_telemetry_failures.failed or check_telemetry_interval.failed) else '[SOME CHECKS PENDING] - Run check_sls_telemetry.yml in a few minutes to verify full status' }}"
        - "╚══════════════════════════════════════════════════════╝"
