---
# =============================================================================
# Disable the Advanced Routing Engine on NGFW (rollback counterpart of
# enable_advanced_routing.yml).
#
# Flow:
#   1. Read 'show system state' to detect whether advanced routing is enabled.
#   2. If already disabled — skip the host.
#   3. Set deviceconfig/setting/advance-routing to 'no'.
#   4. Commit the configuration.
#   5. Reboot the firewall (reboot required for the engine flip to take effect).
#   6. Wait for the device to come back online.
#   7. Verify advanced routing is OFF post-reboot, fail otherwise.
#
# Usage:
#   All firewalls:
#     ansible-playbook playbook_latest/disable_advanced_routing.yml \
#       --vault-password-file .vault_pass
#
#   Single firewall:
#     ansible-playbook playbook_latest/disable_advanced_routing.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01
#
#   With CLI credentials:
#     ansible-playbook playbook_latest/disable_advanced_routing.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01 \
#       -e 'username=scm-admin' -e 'password=FW_PW'
# =============================================================================

- hosts: 'firewalls'
  strategy: linear
  connection: local
  gather_facts: false

  tasks:

    - name: Check if running for specific firewalls only
      ansible.builtin.set_fact:
        run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

    - name: Skip host if not in firewall_list
      ansible.builtin.meta: end_host
      when: not (run_for_this_host | bool)

    - name: Set target firewall provider
      ansible.builtin.set_fact:
        target_device:
          provider:
            ip_address: "{{ panorama_host }}"
            username: "{{ username | default(omit) }}"
            password: "{{ password | default(omit) }}"
            api_key: "{{ api_key | default(omit) }}"
      no_log: true

    # ==========================================
    # Step 1 — Check current advanced routing state
    # ==========================================

    # Retry this first API call — if the previous stage just rebooted the
    # firewall, the mgmt plane may still be warming up. Without retries,
    # a transient connection failure here aborts the entire stage.
    - name: Check current advanced routing state
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: "show system state"
        cmd_is_xml: false
      register: system_state_result
      retries: 10
      delay: 30
      until: system_state_result is not failed

    - name: Parse current advanced routing status
      ansible.builtin.set_fact:
        advance_routing_enabled: "{{ 'cfg.general.advance-routing-enabled: True' in system_state_result.stdout }}"

    - name: Display current advanced routing status
      ansible.builtin.debug:
        msg:
          - "Firewall:         {{ inventory_hostname }}"
          - "Advanced routing: {{ 'ENABLED' if advance_routing_enabled else 'NOT ENABLED' }}"

    - name: Skip — advanced routing already disabled on this host
      when: not advance_routing_enabled
      block:
        - name: Report already disabled
          ansible.builtin.debug:
            msg: "Advanced routing is already disabled on {{ inventory_hostname }}. No action needed."
        - name: End host processing
          ansible.builtin.meta: end_host

    # ==========================================
    # Step 2 — Disable advanced routing
    # CLI equivalent: configure
    #                 set deviceconfig setting advance-routing no
    # ==========================================

    - name: Disable advanced routing in device configuration
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ target_device.provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting"
        element: "<advance-routing>no</advance-routing>"

    # ==========================================
    # Step 3 — Commit (ASYNC)
    #
    # Use sync=false + explicit job-wait. With sync=true (default), the
    # module keeps the HTTPS connection open polling for commit completion,
    # and the commit/engine-flip frequently disrupts the very session that
    # is doing the polling — module then returns a fatal with EMPTY msg,
    # masking whether the commit actually succeeded. sync=false queues the
    # commit and returns immediately; we then poll show jobs all from a
    # fresh connection (which can retry through connection blips).
    # ==========================================

    - name: 'Queue commit (async, sync=false)'
      paloaltonetworks.panos.panos_commit_firewall:
        provider: "{{ target_device.provider }}"
        description: "Disable advanced routing engine (rollback)"
        sync: false
      register: commit_result
      ignore_errors: true

    - name: 'Display commit queue result'
      ansible.builtin.debug:
        msg:
          - "Commit queued : {{ 'SUCCESS' if commit_result is succeeded else 'FAILED to queue (commit may still be running on firewall — wait loop below verifies)' }}"
          - "Job ID        : {{ commit_result.jobid | default(commit_result.commit_jobid | default('?')) }}"

    - name: 'Brief pause to let the commit job appear in the queue'
      ansible.builtin.pause:
        seconds: 5

    - name: 'Wait for commit job to FINISH on firewall (poll show jobs all, max 15 min)'
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: 'show jobs all'
        cmd_is_xml: false
      register: commit_jobs_check
      vars:
        _jobs_raw: "{{ (commit_jobs_check.stdout | default('{}') | from_json).response.result.job | default([]) }}"
        _jobs_list: "{{ [_jobs_raw] if (_jobs_raw is mapping) else _jobs_raw }}"
        active_commit_jobs: >-
          {{ _jobs_list
             | selectattr('type', 'in', ['Commit', 'AutoCom'])
             | selectattr('status', 'in', ['ACT', 'PEND'])
             | list }}
      until:
        - commit_jobs_check is succeeded
        - active_commit_jobs | length == 0
      retries: 30      # 30 × 30s = 15 minutes max
      delay: 30
      changed_when: false
      ignore_errors: true

    - name: Display commit result
      ansible.builtin.debug:
        msg:
          - "Commit status : {{ 'COMPLETED on firewall' if commit_jobs_check is succeeded else 'TIMEOUT — commit may still be in progress, proceeding anyway' }}"
          - "Configuration committed on {{ inventory_hostname }} — reboot required for advanced routing to deactivate."

    # ==========================================
    # Step 4 — Reboot
    # ==========================================

    - name: Reboot the firewall
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: "<request><restart><system/></restart></request>"
        cmd_is_xml: true
      ignore_errors: true   # connection drops immediately on reboot

    # ==========================================
    # Step 5 — Wait for reboot (max ~12 minutes)
    # ==========================================

    - name: Wait for firewall to begin shutdown (port 443 closes)
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 15
        timeout: 120
        state: stopped

    - name: Wait for firewall to come back online (port 443 reopens)
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 30
        timeout: 600
        sleep: 60
        state: started

    - name: Pause for management plane to fully initialize after port is up
      ansible.builtin.pause:
        seconds: 30

    # ==========================================
    # Step 6 — Verify advanced routing is now inactive
    # ==========================================

    - name: Verify advanced routing state after reboot
      paloaltonetworks.panos.panos_op:
        provider: "{{ target_device.provider }}"
        cmd: "show system state"
        cmd_is_xml: false
      register: system_state_after
      retries: 5
      delay: 30
      until: system_state_after is not failed

    - name: Parse post-reboot advanced routing status
      ansible.builtin.set_fact:
        advance_routing_after_reboot: "{{ 'cfg.general.advance-routing-enabled: True' in system_state_after.stdout }}"

    - name: Display post-reboot advanced routing status
      ansible.builtin.debug:
        msg:
          - "Firewall:                  {{ inventory_hostname }}"
          - "Advanced routing (before): ENABLED"
          - "Advanced routing (after):  {{ 'STILL ENABLED — investigate' if advance_routing_after_reboot else 'DISABLED' }}"

    - name: Fail if advanced routing is still active after reboot
      ansible.builtin.fail:
        msg: "Advanced routing is still ENABLED after reboot on {{ inventory_hostname }}. Manual investigation required."
      when: advance_routing_after_reboot
