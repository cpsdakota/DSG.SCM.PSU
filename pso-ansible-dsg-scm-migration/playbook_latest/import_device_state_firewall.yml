---
# =============================================================================
# Import Device State (.tgz) from local directory directly to the FIREWALL.
#
# This is the firewall-target counterpart of import_device_state_to_panorama.yml
# (which doesn't work — Panorama's API doesn't accept device-state imports;
# the import goes directly to the device). This playbook IS the supported
# PAN-OS workflow: load a previously-saved device state back onto the
# firewall it came from (e.g. as part of a rollback from SCM to Panorama).
#
# Flow per firewall:
#   1. Verify the local device-state .tgz exists at
#      device_state/device-state-<inventory_hostname>.tgz (produced by
#      save_device_state.yml).
#   2. Upload the .tgz to the firewall (panos_import → category: device-state).
#      NOTE: this ONLY uploads the bundle — it does NOT apply it.
#   3. Apply it with the configure-mode command 'load device-state' (run via
#      panos_op). This is the step the WebUI "Import device state" performs
#      after the upload, and the step the old version of this playbook was
#      missing (upload alone left config untouched).
#   4. Commit (async + job-wait) to activate the loaded candidate config.
#   5. Reboot explicitly — a device-state restore can flip the Advanced
#      Routing engine, which only activates at boot (the WebUI shows a reboot
#      prompt for this). panos_import+commit do NOT reboot on their own.
#   6. Wait for the device back online, then wait for boot-time auto-commit.
#
# Expected input file (per firewall):
#     device_state/device-state-<inventory_hostname>.tgz
#
# Usage:
#   All firewalls:
#     ansible-playbook playbook_latest/import_device_state_firewall.yml \
#       --vault-password-file .vault_pass
#
#   Single firewall:
#     ansible-playbook playbook_latest/import_device_state_firewall.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01
#
#   With CLI credentials:
#     ansible-playbook playbook_latest/import_device_state_firewall.yml \
#       --limit dicks-vmseries-lab22-firewall01 \
#       -e 'username=scm-admin' -e 'password=FW_PW'
#
# Variables:
#   device_state_dir — local directory holding the .tgz (default: device_state)
#   firewall_list    — optional list to target specific hosts
# =============================================================================

- hosts: firewalls
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    device_state_dir: "device_state"

  tasks:

    - name: 'Check if running for specific firewalls only'
      ansible.builtin.set_fact:
        run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

    - name: 'Skip host if not in firewall_list'
      ansible.builtin.meta: end_host
      when: not (run_for_this_host | bool)

    - name: 'Set firewall provider information'
      ansible.builtin.set_fact:
        fw_provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
      no_log: true

    # ==========================================
    # Verify the local .tgz exists before
    # attempting the upload.
    # ==========================================

    - name: 'Build local device-state file path'
      ansible.builtin.set_fact:
        device_state_file: "{{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"

    - name: 'Verify local device-state .tgz exists'
      ansible.builtin.stat:
        path: "{{ device_state_file }}"
      register: state_file_stat
      delegate_to: localhost

    - name: 'Fail if local device-state .tgz is missing'
      ansible.builtin.fail:
        msg: "Device-state file not found at {{ device_state_file }} — run save_device_state.yml first."
      when: not state_file_stat.stat.exists

    - name: 'Display import target'
      ansible.builtin.debug:
        msg:
          - "=== Importing Device State to Firewall ==="
          - "Firewall      : {{ inventory_hostname }}"
          - "Firewall IP   : {{ panorama_host }}"
          - "Source .tgz   : {{ device_state_file }} ({{ state_file_stat.stat.size }} bytes)"

    # ==========================================
    # Import device-state .tgz directly to the firewall
    # ==========================================

    - name: 'Upload device-state .tgz to firewall'
      paloaltonetworks.panos.panos_import:
        provider: '{{ fw_provider }}'
        category: 'device-state'
        filename: "{{ device_state_file }}"
      register: result_import
      delegate_to: localhost

    - name: 'Display import result'
      ansible.builtin.debug:
        msg:
          - "Import status : {{ 'SUCCESS' if result_import is succeeded else 'FAILED' }}"
          - "Changed       : {{ result_import.changed | default('N/A') }}"

    # ==========================================
    # Step 2 — APPLY the uploaded device-state into the candidate config.
    #
    # THIS IS THE STEP THAT WAS MISSING. panos_import (category=device-state)
    # only UPLOADS the .tgz — it does NOT apply it. Proven on the lab: no
    # reboot, the commit was a no-op, and a security rule created just before
    # the run survived. The WebUI "Import device state" performs a SECOND
    # action, which on the CLI is the configure-mode command:
    #     load device-state
    # (no arguments — it loads the single uploaded device-state bundle).
    # panos_op runs it exactly like import_config_firewall.yml runs
    # 'load config from <file>'.
    # ==========================================

    - name: 'Load the uploaded device-state into the candidate config'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: 'load device-state'
        cmd_is_xml: false
      register: result_load_state
      ignore_errors: true

    - name: 'Display load device-state result'
      ansible.builtin.debug:
        msg:
          - "Load device-state : {{ 'SUCCESS' if result_load_state is succeeded else 'FAILED' }}"
          - "Output            : {{ result_load_state.stdout_xml | default(result_load_state.msg | default('N/A')) }}"

    - name: 'Fail if load device-state did not succeed (nothing to commit/reboot otherwise)'
      ansible.builtin.fail:
        msg: >-
          'load device-state' failed — the device-state was uploaded but not
          applied, so a commit/reboot would be pointless. Check that the .tgz
          is a valid device-state bundle for this platform.
          Output: {{ result_load_state.stdout_xml | default(result_load_state.msg | default('N/A')) }}
      when: result_load_state is failed

    # ==========================================
    # Step 3 — Commit the loaded state (ASYNC + explicit job-wait).
    # Mirrors import_config_firewall.yml: sync=false so a mgmt-plane change
    # doesn't drop the sync polling connection and mask the result; then poll
    # 'show jobs all' until no Commit/AutoCom job is ACT/PEND.
    # ==========================================

    - name: 'Queue commit of restored device-state (async, sync=false)'
      paloaltonetworks.panos.panos_commit_firewall:
        provider: '{{ fw_provider }}'
        description: "Restore device state from {{ device_state_file }}"
        sync: false
      register: result_commit
      ignore_errors: true

    - name: 'Brief pause to let the commit job appear in the queue'
      ansible.builtin.pause:
        seconds: 5

    - name: 'Wait for commit job to FINISH on firewall (poll show jobs all, max 15 min)'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: 'show jobs all'
        cmd_is_xml: false
      register: commit_jobs_check
      vars:
        _jobs_raw: "{{ (commit_jobs_check.stdout | default('{}') | from_json).response.result.job | default([]) }}"
        _jobs_list: "{{ [_jobs_raw] if (_jobs_raw is mapping) else _jobs_raw }}"
        active_commit_jobs: >-
          {{ _jobs_list
             | selectattr('type', 'in', ['Commit', 'AutoCom'])
             | selectattr('status', 'in', ['ACT', 'PEND'])
             | list }}
      until:
        - commit_jobs_check is succeeded
        - active_commit_jobs | length == 0
      retries: 30      # 30 × 30s = 15 minutes max
      delay: 30
      changed_when: false
      ignore_errors: true

    - name: 'Display commit result'
      ansible.builtin.debug:
        msg: "Commit : {{ 'COMPLETED on firewall' if commit_jobs_check is succeeded else 'TIMEOUT — proceeding anyway' }}"

    # ==========================================
    # Step 4 — Reboot to activate engine-level settings.
    # A device-state restore can flip the Advanced Routing engine (the WebUI
    # pops up a reboot prompt for exactly this). The flip only takes effect at
    # boot. The old playbook relied on the commit to trigger a reboot — it
    # doesn't, which is why the port-443 'closes' wait always timed out. We
    # reboot explicitly here.
    # ==========================================

    - name: 'Reboot the firewall to activate the restored device-state'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: "<request><restart><system/></restart></request>"
        cmd_is_xml: true
      ignore_errors: true   # connection drops immediately on reboot

    # ==========================================
    # Wait for the firewall to come back online.
    # A device-state restore triggers a REBOOT — the commit returns success
    # but the device cycles immediately. Subsequent rollback stages need to
    # connect to the firewall, so we must wait for it before returning.
    #
    # Sequence: wait for port 443 to CLOSE (reboot has started), then wait
    # for port 443 to REOPEN (mgmt plane is back), then a pause for the
    # mgmt plane to fully initialize. Same pattern as enable_advanced_routing.yml
    # and STEP 4B of scm_migration_final_v2.yml.
    # ==========================================

    - name: 'Wait for firewall to begin reboot (port 443 closes)'
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 15        # 15s before first check — device-state restore takes a moment
        timeout: 180     # 3 minutes max for device to go down
        state: stopped
      delegate_to: localhost
      ignore_errors: true   # OK if it doesn't go down — maybe restore was a no-op

    - name: 'Wait for firewall to come back online (port 443 reopens)'
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 30        # 30s after port closed before first up-check
        timeout: 900     # 15 minutes max to come back (state restore can be slow)
        sleep: 30        # check every 30s
        state: started
      delegate_to: localhost

    - name: 'Pause for management plane to fully initialize'
      ansible.builtin.pause:
        seconds: 60

    - name: 'Verify firewall is responsive (read system info)'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: 'show system info'
        cmd_is_xml: false
      register: result_post_restore_check
      retries: 5
      delay: 30
      until: result_post_restore_check is not failed
      ignore_errors: true

    # ==========================================
    # Step 5 — Wait for boot-time auto-commit to finish before handing off.
    # 'show system info' returns success while the firewall is still running
    # its boot-time auto-commit. A subsequent rollback stage that commits
    # would be rejected ("auto-commit not yet finished successfully"). Poll
    # until no Commit/AutoCom job is ACT/PEND. Same pattern as
    # import_config_firewall.yml.
    # ==========================================

    - name: 'Wait for boot-time auto-commit to finish (poll show jobs all, max 15 min)'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: 'show jobs all'
        cmd_is_xml: false
      register: post_boot_jobs_check
      vars:
        _jobs_raw: "{{ (post_boot_jobs_check.stdout | default('{}') | from_json).response.result.job | default([]) }}"
        _jobs_list: "{{ [_jobs_raw] if (_jobs_raw is mapping) else _jobs_raw }}"
        active_commit_jobs: >-
          {{ _jobs_list
             | selectattr('type', 'in', ['Commit', 'AutoCom'])
             | selectattr('status', 'in', ['ACT', 'PEND'])
             | list }}
      until: active_commit_jobs | length == 0
      retries: 30      # 30 × 30s = 15 minutes max
      delay: 30
      changed_when: false
      ignore_errors: true

    # ==========================================
    # Final summary
    # ==========================================

    - name: 'Display completion summary'
      ansible.builtin.debug:
        msg:
          - "=== Device State Import Complete for {{ inventory_hostname }} ==="
          - "Source .tgz    : {{ device_state_file }}"
          - "Upload         : {{ 'SUCCESS' if result_import is succeeded else 'FAILED' }}"
          - "Load state     : {{ 'SUCCESS' if result_load_state is succeeded else 'FAILED' }}"
          - "Commit         : {{ 'COMPLETED' if commit_jobs_check is succeeded else 'TIMEOUT / dropped (check manually)' }}"
          - "Post-reboot    : {{ 'REACHABLE' if result_post_restore_check is succeeded else 'NOT YET REACHABLE — check manually' }}"
          - "Auto-commit    : {{ 'CLEAR — safe for next stage' if post_boot_jobs_check is succeeded else 'TIMEOUT — still running' }}"
          - "The firewall is now running the configuration captured in the .tgz."
