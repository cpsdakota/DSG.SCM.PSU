---
# =============================================================================
# Push config from SCM to device(s) — v2
#
# Same logic as push_config.yml but uses scm_sase_base_url instead of a
# hardcoded paas-N URL. scm_sase_base_url is auto-detected by Step 0 of
# scm_migration_snippet.yml (RBAC vs DIRECT mode). When running standalone,
# pass it explicitly via -e.
#
# Usage:
#   Standalone — RBAC mode (public API gateway):
#     ansible-playbook playbook_latest/push_config_v2.yml \
#       --vault-password-file .vault_pass \
#       -e 'scm_sase_base_url=https://api.sase.paloaltonetworks.com' \
#       -e 'vm_series_devices=["007957000847916","007957000847915"]'
#
#   Standalone — DIRECT mode (internal paas server):
#     ansible-playbook playbook_latest/push_config_v2.yml \
#       --vault-password-file .vault_pass \
#       -e 'scm_sase_base_url=https://paas-16.prod.panorama.paloaltonetworks.com' \
#       -e 'vm_series_devices=["007957000847916","007957000847915"]'
#
#   Fire-and-forget (skip polling):
#     ansible-playbook playbook_latest/push_config_v2.yml \
#       --vault-password-file .vault_pass \
#       -e 'scm_sase_base_url=https://paas-16.prod.panorama.paloaltonetworks.com' \
#       -e 'vm_series_devices=["007957000847916"]' \
#       -e 'wait_for_job=false'
#
# Variables:
#   scm_sase_base_url  (required) — SCM internal API base URL (detected by Step 0
#                                   or passed explicitly when running standalone)
#   vm_series_devices  (required) — list of device serial numbers to push to;
#                                   defined in inventory.yml or passed via -e
#   push_description   (optional) — label for the push job (default provided)
#   wait_for_job       (optional) — true (default) polls until done; false = fire-and-forget
#   poll_retries       (optional) — max poll attempts (default 40)
#   poll_delay         (optional) — seconds between polls (default 15; 40×15 = 10 min max)
# =============================================================================

- name: "Push config from SCM to device(s) (v2)"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/scm_credentials.yml

  vars:
    push_description: "Ansible automated config push"
    wait_for_job: true
    poll_retries: 40
    poll_delay: 15

  tasks:

    - name: "PREFLIGHT — Validate scm_sase_base_url is defined"
      ansible.builtin.fail:
        msg: >-
          scm_sase_base_url is required. Pass it via -e or run Step 0 of
          scm_migration_snippet.yml first to auto-detect it.
      when: scm_sase_base_url is not defined or scm_sase_base_url | length == 0

    - name: "PREFLIGHT — Validate vm_series_devices is defined"
      ansible.builtin.assert:
        that:
          - vm_series_devices is defined
          - vm_series_devices | length > 0
        fail_msg: "'vm_series_devices' must be defined in inventory.yml or passed via -e"

    - name: "PREFLIGHT — Normalize vm_series_devices into a list"
      ansible.builtin.set_fact:
        device_list: "{{ [vm_series_devices] if (vm_series_devices is string and not vm_series_devices.startswith('[')) else (vm_series_devices | from_json if vm_series_devices is string else vm_series_devices) }}"

    - name: "PREFLIGHT — Display push operation summary"
      ansible.builtin.debug:
        msg:
          - "=== SCM Config Push (v2) ==="
          - "Base URL    : {{ scm_sase_base_url }}"
          - "Devices     : {{ device_list }}"
          - "Description : {{ push_description }}"
          - "Wait for job: {{ wait_for_job }}"

    - name: "AUTH — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    # ==========================================
    # Step 1 — Config conflict check (informational)
    # ==========================================

    - name: "CONFLICTS — Check config conflicts for device(s)"
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/api/sase/config/v1/config-conflicts"
        method: POST
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          devices: "{{ device_list }}"
        status_code: 200
        return_content: yes
      register: conflicts_response

    - name: "CONFLICTS — Display conflict check result"
      ansible.builtin.debug:
        msg: "{{ conflicts_response.content }}"

    # ==========================================
    # Step 2 — Trigger config push
    # ==========================================

    - name: "PUSH — Trigger config push to device(s)"
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/api/sase/config/v1.0/push"
        method: POST
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          containers: "{{ device_list }}"
          description: "{{ push_description }}"
          override-block: "yes"
        status_code: 200
        return_content: yes
      register: push_response

    - name: "PUSH — Parse push response"
      ansible.builtin.set_fact:
        push_data: "{{ push_response.content | from_json }}"

    - name: "PUSH — Display push trigger result"
      ansible.builtin.debug:
        msg:
          - "Message : {{ push_data.message }}"
          - "Job ID  : {{ push_data.job_id }}"
          - "Success : {{ push_data.success }}"

    - name: "PUSH — Fail if push was not accepted by SCM"
      ansible.builtin.fail:
        msg: "Push was not accepted by SCM: {{ push_data }}"
      when: not (push_data.success | bool)

    # ==========================================
    # Step 3 — Poll job-groups until completion
    # ==========================================

    - name: "POLL — Wait for push job to complete"
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/api/sase/config/v1/device-config/job-groups?parentJobId={{ push_data.job_id }}"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: job_status_response
      retries: "{{ poll_retries }}"
      delay: "{{ poll_delay }}"
      until: >-
        (job_status_response.content | from_json).data.job_groups[0].jobs_status not in ['PENDING', 'ACT']
      when: wait_for_job | bool

    - name: "POLL — Parse completed job group data"
      ansible.builtin.set_fact:
        job_group: "{{ (job_status_response.content | from_json).data.job_groups[0] }}"
      when: wait_for_job | bool

    - name: "POLL — Display job group summary"
      ansible.builtin.debug:
        msg:
          - "Job ID      : {{ job_group.parent_job_id }}"
          - "Type        : {{ job_group.type_str }}"
          - "Status      : {{ job_group.jobs_status }}"
          - "Started     : {{ job_group.start_ts }}"
          - "Ended       : {{ job_group.end_ts }}"
          - "Description : {{ job_group.parent_description }}"
      when: wait_for_job | bool

    # ==========================================
    # Step 4 — Fetch detailed result per sub-job
    # ==========================================

    - name: "DETAILS — Fetch detailed result for each sub-job"
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/api/jobs/v1/{{ item.id }}"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Accept: "application/json"
        status_code: 200
        return_content: yes
      loop: "{{ job_group.jobs }}"
      loop_control:
        label: "job {{ item.id }}"
      register: job_details_responses
      when: wait_for_job | bool

    - name: "DETAILS — Display detailed result per sub-job"
      ansible.builtin.debug:
        msg: >-
          {%- set job  = (item.content | from_json).data[0] -%}
          {%- set det  = job.details | default('{}', true) | from_json -%}
          {%- set summ = job.summary | default('{}', true) | from_json -%}
          Job {{ job.id }} ({{ job.type_str }}) on {{ job.dev_serial | default('N/A') }}:
          Result={{ job.result_str }} | Status={{ job.status_str }} |
          Start={{ job.start_ts }} | End={{ job.end_ts }} |
          Info={{ det.info | default([]) | join('; ') }} |
          Summary={{ summ.info | default([]) | join('; ') }} |
          Warnings ({{ det.warnings | default([]) | length }}): {{ det.warnings | default([]) | join(' | ') }}
      loop: "{{ job_details_responses.results }}"
      loop_control:
        label: "job {{ item.item.id }}"
      when: wait_for_job | bool

    # ==========================================
    # Step 5 — Final pass/fail
    # PUSHFAIL = device not reachable/ready → warn and exit cleanly
    # Other failures → hard fail
    # ==========================================

    - name: "RESULT — Collect any PUSHFAIL sub-jobs (device not reachable)"
      ansible.builtin.set_fact:
        pushfail_jobs: >-
          {{ job_details_responses.results
             | map(attribute='content')
             | map('from_json')
             | map(attribute='data')
             | flatten
             | selectattr('status_str', 'equalto', 'PUSHFAIL')
             | list }}
      when: wait_for_job | bool

    - name: "RESULT — Warn and stop if device was not reachable (PUSHFAIL)"
      when:
        - wait_for_job | bool
        - pushfail_jobs | length > 0
      block:
        - name: "RESULT — Report device not reachable"
          ansible.builtin.debug:
            msg:
              - "Push did not reach the device — status PUSHFAIL."
              - "Affected serial(s): {{ pushfail_jobs | map(attribute='dev_serial') | list | join(', ') }}"
              - "The device is likely not connected to SCM yet."
              - "Verify bootstrap is complete (check_bootstrap_status.yml) then retry."
        - name: "RESULT — End play — device not reachable"
          ansible.builtin.meta: end_play

    - name: "RESULT — Fail if push job completed with an unexpected error"
      ansible.builtin.fail:
        msg: "Config push job {{ push_data.job_id }} completed with status '{{ job_group.jobs_status }}'. Check SCM UI for details."
      when:
        - wait_for_job | bool
        - job_group.jobs_status not in ['OK', 'FIN']
