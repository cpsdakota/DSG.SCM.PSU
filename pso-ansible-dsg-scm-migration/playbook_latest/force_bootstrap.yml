---
- name: Force bootstrap a device in SCM (with pre-check)
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/scm_credentials.yml
  vars:
    # Required: serial number of the device to bootstrap
    # device_serial: "007957000834879"
    scm_folder: "All"
    scm_ngfw_base_url: "https://paas-16.prod.panorama.paloaltonetworks.com"

  tasks:

    - name: Authenticate with SCM
      ansible.builtin.include_role:
        name: scm_auth

    - name: Validate required input variable
      ansible.builtin.assert:
        that:
          - device_serial is defined
          - device_serial | length > 0
        fail_msg: "'device_serial' must be provided via -e"

    # ==========================================
    # Step 1 — Check current bootstrap status
    # ==========================================

    - name: Fetch current bootstrap status from SCM
      ansible.builtin.uri:
        url: "{{ scm_ngfw_base_url }}/ngfw/api/bootstrap/getbootstrapstatus?folder={{ scm_folder }}"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: status_response

    - name: Parse bootstrap status response
      ansible.builtin.set_fact:
        bootstrap_status_data: "{{ status_response.content | from_json }}"

    - name: Find device entry in status response
      ansible.builtin.set_fact:
        device_status_entry: "{{ bootstrap_status_data | selectattr('serial', 'equalto', device_serial) | list | first | default({}) }}"

    # ==========================================
    # Step 2 — Guard: device not found in SCM
    # ==========================================

    - name: Warn and stop if device is not found in SCM
      when: device_status_entry | length == 0
      block:
        - name: Report device not found in SCM
          ansible.builtin.debug:
            msg:
              - "Device '{{ device_serial }}' was not found in SCM bootstrap status under folder '{{ scm_folder }}'."
              - "The device may not be claimed yet or may not have checked in with SCM."
              - "No action taken."
        - name: End play — device not found
          ansible.builtin.meta: end_play

    # ==========================================
    # Step 3 — Guard: bootstrap already ongoing
    # ==========================================

    - name: Inform and stop if bootstrap is already in progress
      when: device_status_entry.bootstrap | default('') == 'ongoing'
      block:
        - name: Report bootstrap already running
          ansible.builtin.debug:
            msg:
              - "Bootstrap is already in progress for device '{{ device_serial }}'."
              - "Current status: {{ device_status_entry.status }}"
              - "No action taken. Use check_bootstrap_status.yml to monitor progress."
        - name: End play — already bootstrapping
          ansible.builtin.meta: end_play

    # ==========================================
    # Step 4 — Pre-check passed: trigger bootstrap
    # ==========================================

    - name: Show current state before triggering
      ansible.builtin.debug:
        msg:
          - "Pre-check passed for device '{{ device_serial }}'."
          - "Bootstrap state: {{ device_status_entry.bootstrap | default('unknown') }}"
          - "Status message: {{ device_status_entry.status | default('N/A') }}"
          - "Triggering force bootstrap now..."

    - name: Trigger force bootstrap
      ansible.builtin.uri:
        url: "{{ scm_ngfw_base_url }}/ngfw/api/bootstrap/startbootstrap?serial={{ device_serial }}&force=yes"
        method: POST
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
        body_format: json
        body: {}
        status_code: 200
        return_content: yes
      register: bootstrap_trigger

    - name: Display bootstrap trigger result
      ansible.builtin.debug:
        msg: "{{ bootstrap_trigger.content }}"

    - name: Fail if SCM reported an error in the response body
      ansible.builtin.fail:
        msg: "SCM reported an error: {{ bootstrap_trigger.content }}"
      when: "'Failed' in bootstrap_trigger.content or 'error' in bootstrap_trigger.content | lower"
