---
- hosts: 'firewalls'
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    # Optional: filter specific firewalls via variable
    # firewall_list: ["dicks-vmseries-lab-firewall01", "dicks-vmseries-lab-firewall02"]

  tasks:

  - name: 'Check if running for specific firewalls only'
    ansible.builtin.set_fact:
      run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

  - name: 'Skip host if not in firewall_list'
    ansible.builtin.meta: end_host
    when: not (run_for_this_host | bool)

  - name: 'Set target firewall provider information'
    ansible.builtin.set_fact:
      target_device:
        name: '{{ inventory_hostname }}'
        provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
    no_log: true

  - name: 'Display removal target information'
    ansible.builtin.debug:
      msg:
        - "=== Removing Panorama Management from Firewall ==="
        - "Firewall: {{ inventory_hostname }}"
        - "IP Address: {{ panorama_host }}"
        - "Actions: Remove Panorama servers, log collector config, and template hierarchy"

  # ==========================================
  # Remove Panorama Server References
  # ==========================================

  - name: 'Remove primary Panorama server IP'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama-server"
      state: absent
    ignore_errors: true
    register: remove_panorama_server

  - name: 'Remove secondary Panorama server IP'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama-server-2"
      state: absent
    ignore_errors: true
    register: remove_panorama_server2

  - name: 'Remove Panorama server block (alternate xpath for newer PAN-OS)'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/panorama-server"
      state: absent
    ignore_errors: true

  - name: 'Remove secondary Panorama server block (alternate xpath for newer PAN-OS)'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/panorama-server-2"
      state: absent
    ignore_errors: true

  # ==========================================
  # Remove Panorama Log Collector / Logging Config
  # ==========================================

  - name: 'Remove Panorama log collector enabled flag'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/log-collector-enabled"
      state: absent
    ignore_errors: true

  - name: 'Remove Panorama logging service configuration'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/log-forwarding-profile"
      state: absent
    ignore_errors: true

  - name: 'Remove Panorama local log collector reference'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/log-export-schedule"
      state: absent
    ignore_errors: true

  # ==========================================
  # Remove Panorama Template Configuration Hierarchy
  # NOTE: Config pushed via Panorama templates is merged into the firewall's
  # running config. After removing Panorama references, that config becomes
  # local — which is the expected and desired behavior for SCM migration.
  # The tasks below remove the Panorama agent template tracking metadata only.
  # ==========================================

  - name: 'Remove Panorama device-group metadata'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama/local-panorama"
      state: absent
    ignore_errors: true

  #- name: 'Remove Panorama managed configuration block'
  #  paloaltonetworks.panos.panos_config_element:
  #    provider: '{{ target_device.provider }}'
  #    xpath: "/config/panorama"
  #    state: absent
  #  ignore_errors: true

# ==========================================
  # Targeted Cleanup of the "initcfg" Block
  # CLI equivalent: configure
  #   delete deviceconfig setting management initcfg panorama-server
  #   delete deviceconfig setting management initcfg tplname
  #   delete deviceconfig setting management initcfg dgname
  # ==========================================

  - name: 'Delete initcfg panorama-server entry'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting/management/initcfg/panorama-server"
      state: absent
    ignore_errors: true

  - name: 'Delete initcfg tplname entry'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting/management/initcfg/tplname"
      state: absent
    ignore_errors: true

  - name: 'Delete initcfg dgname entry'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting/management/initcfg/dgname"
      state: absent
    ignore_errors: true

  - name: 'Forcefully remove initcfg Panorama pointers'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting/management/initcfg"
      state: absent
    ignore_errors: true

  - name: 'Clean up any residual Panorama system state'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama"
      state: absent
    ignore_errors: true    

  # ==========================================
  # Commit Configuration Changes
  # ==========================================

  - name: 'Commit configuration changes to firewall'
    paloaltonetworks.panos.panos_commit_firewall:
      provider: '{{ target_device.provider }}'
      description: "Remove Panorama management - migrating to SCM"
    register: commit_result

  - name: 'Display commit status'
    ansible.builtin.debug:
      msg: "Configuration committed successfully to {{ inventory_hostname }}"
    when: commit_result is succeeded

  # ==========================================
  # Final Summary
  # ==========================================

  - name: 'Display removal completion summary'
    ansible.builtin.debug:
      msg:
        - "=== Panorama Removal Complete for {{ inventory_hostname }} ==="
        - "Removed: Primary Panorama server reference"
        - "Removed: Secondary Panorama server reference"
        - "Removed: Log collector and log forwarding configuration"
        - "Removed: Panorama template tracking metadata"
        - "Note: Previously Panorama-pushed config is now local on the firewall"
        - "Next step: Verify firewall connectivity to SCM"
