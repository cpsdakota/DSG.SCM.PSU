---
# =============================================================================
# Configure Management Interface, DNS and NTP on NGFW
#
# Flow:
#   1. Read current management IP/netmask/gateway from running config and
#      commit them locally — protects connectivity if management was only
#      defined via a Panorama template (same pattern used in Step 4 of
#      scm_migration_snippet.yml before template detach).
#   2. Configure DNS via xpath panos_config_element.
#   3. Configure NTP via xpath panos_config_element.
#   4. If mgmt_ip + mgmt_netmask + mgmt_gateway are provided, apply new
#      management interface settings via CLI (panos_op) — runs last because
#      changing the management IP drops Ansible connectivity after commit.
#   5. Commit all changes (ignore_errors: true — expected connection drop
#      when management IP changes).
#
# Usage:
#   All firewalls (DNS + NTP only):
#     ansible-playbook playbook_latest/configure_mgmt_dns_ntp.yml \
#       --vault-password-file .vault_pass
#
#   Single firewall with management IP change:
#     ansible-playbook playbook_latest/configure_mgmt_dns_ntp.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01 \
#       -e 'mgmt_ip=10.0.1.5 mgmt_netmask=255.255.255.0 mgmt_gateway=10.0.1.1'
#
#   Specific list via variable:
#     ansible-playbook playbook_latest/configure_mgmt_dns_ntp.yml \
#       --vault-password-file .vault_pass \
#       -e 'firewall_list=["dicks-vmseries-lab22-firewall01"]'
#
# Variables (all optional — skip sections by leaving defaults or undefined):
#   mgmt_ip          — new management IP address  (skip mgmt change if not set)
#   mgmt_netmask     — management subnet mask      (skip mgmt change if not set)
#   mgmt_gateway     — management default gateway  (skip mgmt change if not set)
#   dns_primary      — primary DNS server          (default from inventory)
#   dns_secondary    — secondary DNS server        (default from inventory)
#   ntp_primary      — primary NTP server          (default from inventory)
#   ntp_secondary    — secondary NTP server        (default from inventory)
#   firewall_list    — optional list to target specific hosts
# =============================================================================

- hosts: firewalls
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    dns_primary:   "10.220.150.50"
    dns_secondary: "10.211.36.50"
    ntp_primary:   "10.220.60.71"
    ntp_secondary: "10.211.12.71"

  tasks:

    - name: 'Check if running for specific firewalls only'
      ansible.builtin.set_fact:
        run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

    - name: 'Skip host if not in firewall_list'
      ansible.builtin.meta: end_host
      when: not (run_for_this_host | bool)

    - name: 'Set target firewall provider information'
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
      no_log: true

    - name: 'Display operation target'
      ansible.builtin.debug:
        msg:
          - "=== Configuring Management Interface, DNS and NTP ==="
          - "Firewall      : {{ inventory_hostname }}"
          - "IP Address    : {{ panorama_host }}"
          - "--- Management Interface ---"
          - "New IP        : {{ mgmt_ip        | default('(no change)') }}"
          - "Netmask       : {{ mgmt_netmask   | default('(no change)') }}"
          - "Gateway       : {{ mgmt_gateway   | default('(no change)') }}"
          - "--- DNS ---"
          - "Primary       : {{ dns_primary }}"
          - "Secondary     : {{ dns_secondary }}"
          - "--- NTP ---"
          - "Primary       : {{ ntp_primary }}"
          - "Secondary     : {{ ntp_secondary }}"

    # ==========================================
    # Lock current management IP locally
    # Reads management IP/netmask/gateway from
    # the running config and commits them as
    # local config before any changes are made.
    # Prevents connectivity loss if management
    # settings were only defined in a Panorama
    # template (e.g. during SCM migration).
    # ==========================================

    - name: 'MGMT-LOCK — Read management interface config from running config'
      paloaltonetworks.panos.panos_op:
        provider: '{{ provider }}'
        cmd: '<show><config><running></running></config></show>'
        cmd_is_xml: true
      register: running_config_mgmt

    - name: 'MGMT-LOCK — Extract current management IP, netmask and gateway'
      ansible.builtin.set_fact:
        current_mgmt_ip:      "{{ (running_config_mgmt.stdout | from_json).response.result.config.devices.entry.deviceconfig.system['ip-address'] | default('') }}"
        current_mgmt_netmask: "{{ (running_config_mgmt.stdout | from_json).response.result.config.devices.entry.deviceconfig.system.netmask | default('') }}"
        current_mgmt_gateway: "{{ (running_config_mgmt.stdout | from_json).response.result.config.devices.entry.deviceconfig.system['default-gateway'] | default('') }}"

    - name: 'MGMT-LOCK — Display current management IP info'
      ansible.builtin.debug:
        msg:
          - "Current management IP      : {{ current_mgmt_ip }}"
          - "Current management netmask : {{ current_mgmt_netmask }}"
          - "Current default gateway    : {{ current_mgmt_gateway }}"

    - name: 'MGMT-LOCK — Set current management IP locally'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<ip-address>{{ current_mgmt_ip }}</ip-address>"
      when: current_mgmt_ip | length > 0

    - name: 'MGMT-LOCK — Set current management netmask locally'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<netmask>{{ current_mgmt_netmask }}</netmask>"
      when: current_mgmt_netmask | length > 0

    - name: 'MGMT-LOCK — Set current default gateway locally'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<default-gateway>{{ current_mgmt_gateway }}</default-gateway>"
      when: current_mgmt_gateway | length > 0

    - name: 'MGMT-LOCK — Commit management IP locally before making changes'
      paloaltonetworks.panos.panos_commit_firewall:
        provider: '{{ provider }}'
        description: "Lock management IP locally before configure_mgmt_dns_ntp changes"
      when: current_mgmt_ip | length > 0

    # ==========================================
    # Configure DNS (xpath — from configure_dns_ntp.yml)
    # ==========================================

    - name: 'Configure primary DNS server'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/dns-setting/servers"
        element: "<primary>{{ dns_primary }}</primary>"
      register: result_dns_primary

    - name: 'Configure secondary DNS server'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/dns-setting/servers"
        element: "<secondary>{{ dns_secondary }}</secondary>"
      register: result_dns_secondary

    - name: 'Display DNS configuration result'
      ansible.builtin.debug:
        msg:
          - "DNS primary   : {{ dns_primary }}  — {{ 'SUCCESS' if result_dns_primary is succeeded else 'FAILED' }}"
          - "DNS secondary : {{ dns_secondary }} — {{ 'SUCCESS' if result_dns_secondary is succeeded else 'FAILED' }}"

    # ==========================================
    # Configure NTP (xpath — from configure_dns_ntp.yml)
    # ==========================================

    - name: 'Configure primary NTP server'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/ntp-servers/primary-ntp-server"
        element: "<ntp-server-address>{{ ntp_primary }}</ntp-server-address>"
      register: result_ntp_primary

    - name: 'Configure secondary NTP server'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/ntp-servers/secondary-ntp-server"
        element: "<ntp-server-address>{{ ntp_secondary }}</ntp-server-address>"
      register: result_ntp_secondary

    - name: 'Display NTP configuration result'
      ansible.builtin.debug:
        msg:
          - "NTP primary   : {{ ntp_primary }}  — {{ 'SUCCESS' if result_ntp_primary is succeeded else 'FAILED' }}"
          - "NTP secondary : {{ ntp_secondary }} — {{ 'SUCCESS' if result_ntp_secondary is succeeded else 'FAILED' }}"

    # ==========================================
    # Configure new Management Interface IP
    # Only runs when mgmt_ip + mgmt_netmask +
    # mgmt_gateway are all provided via -e.
    # Runs LAST — changing the management IP
    # drops connectivity to the current IP after
    # commit, which is expected behaviour.
    # ==========================================

    - name: 'Configure new management interface IP address'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<ip-address>{{ mgmt_ip }}</ip-address>"
      register: result_mgmt_ip
      ignore_errors: true
      when:
        - mgmt_ip is defined
        - mgmt_netmask is defined
        - mgmt_gateway is defined

    - name: 'Configure new management interface netmask'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<netmask>{{ mgmt_netmask }}</netmask>"
      register: result_mgmt_netmask
      ignore_errors: true
      when:
        - mgmt_ip is defined
        - mgmt_netmask is defined
        - mgmt_gateway is defined

    - name: 'Configure new management default gateway'
      paloaltonetworks.panos.panos_config_element:
        provider: '{{ provider }}'
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<default-gateway>{{ mgmt_gateway }}</default-gateway>"
      register: result_mgmt_gateway
      ignore_errors: true
      when:
        - mgmt_ip is defined
        - mgmt_netmask is defined
        - mgmt_gateway is defined

    - name: 'Display new management interface results'
      ansible.builtin.debug:
        msg:
          - "New mgmt IP      : {{ mgmt_ip }}      — {{ 'SUCCESS' if result_mgmt_ip is succeeded else 'FAILED' }}"
          - "New mgmt netmask : {{ mgmt_netmask }} — {{ 'SUCCESS' if result_mgmt_netmask is succeeded else 'FAILED' }}"
          - "New mgmt gateway : {{ mgmt_gateway }} — {{ 'SUCCESS' if result_mgmt_gateway is succeeded else 'FAILED' }}"
          - "NOTE: Connectivity to {{ panorama_host }} will be lost after commit."
      when:
        - mgmt_ip is defined
        - mgmt_netmask is defined
        - mgmt_gateway is defined

    # ==========================================
    # Commit all changes
    # ignore_errors: true because changing the
    # management IP drops the connection during
    # or after commit — this is expected.
    # ==========================================

    - name: 'Commit all configuration changes'
      paloaltonetworks.panos.panos_commit_firewall:
        provider: '{{ provider }}'
        description: "Configure management interface, DNS and NTP via Ansible"
      register: result_commit
      ignore_errors: true

    # ==========================================
    # Final Summary
    # ==========================================

    - name: 'Display completion summary'
      ansible.builtin.debug:
        msg:
          - "=== Configuration Complete for {{ inventory_hostname }} ==="
          - "DNS primary    : {{ 'SUCCESS' if result_dns_primary is succeeded else 'FAILED' }}"
          - "DNS secondary  : {{ 'SUCCESS' if result_dns_secondary is succeeded else 'FAILED' }}"
          - "NTP primary    : {{ 'SUCCESS' if result_ntp_primary is succeeded else 'FAILED' }}"
          - "NTP secondary  : {{ 'SUCCESS' if result_ntp_secondary is succeeded else 'FAILED' }}"
          - "New mgmt IP    : {{ 'SUCCESS' if (result_mgmt_ip is succeeded) else ('SKIPPED' if result_mgmt_ip is skipped else 'FAILED') }}"
          - "New mgmt mask  : {{ 'SUCCESS' if (result_mgmt_netmask is succeeded) else ('SKIPPED' if result_mgmt_netmask is skipped else 'FAILED') }}"
          - "New mgmt gw    : {{ 'SUCCESS' if (result_mgmt_gateway is succeeded) else ('SKIPPED' if result_mgmt_gateway is skipped else 'FAILED') }}"
          - "Commit         : {{ 'SUCCESS' if result_commit is succeeded else 'FAILED or connection dropped (expected if mgmt IP changed)' }}"
