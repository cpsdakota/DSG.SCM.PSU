---
# =============================================================================
# SCM Migration Master Playbook — v7
# Runs the full Panorama-to-SCM migration workflow in a single execution.
#
# WHAT'S NEW IN v7 (vs scm_migration_final_v6.yml)
#   Fix #1 — Cloud-service commit no longer fails intermittently after the
#     STEP 4B ARE-enable reboot. Two changes:
#       (a) STEP 4B-POST adds a 60s settle pause (only when a reboot happened)
#           so the boot auto-commit has time to enqueue before we poll — the
#           poll no longer returns "CLEAR" before the auto-commit even starts.
#       (b) STEP 5's commit now retries (10 × 30s) past
#           "auto-commit not yet finished successfully" until it is accepted.
#   Fix #2 — Rule scoping: STEP 8 now runs in the order
#       8C move-to-folder → 8D rename → 8B push
#     (was push → move → rename), with a 60s settle pause before the push, so
#     the single push is scoped to the target folder and includes its rules.
#     Previously the push ran first and only Global-folder rules landed,
#     requiring a manual second push.
#   (The ARE-already-enabled "localize the flag" fix lives separately in
#    scm_migration_ARE_enabled.yml and is NOT included here.)
#
# NOTE: the step numbers below are logical; the STEP 8 plays now execute in the
#       order 8 → 8C → 8D → 8B → 9.
#
# Steps:
#   0.   Auto-detect SCM internal API base URL (RBAC vs DIRECT gateway mode)
#   1.   List SCM devices BEFORE migration
#   2.   Backup firewall configurations + collect serial numbers
#   3.   Pre-migration snapshot
#   3B.  Check for any existing commit-locks on the firewall (CHECK ONLY).
#        Fails the playbook fast with the lock holder's name if a lock is
#        present, since subsequent commits would otherwise be blocked.
#        Manual cleanup via SCM GUI or device CLI is required.
#   4.   Remove Panorama management (v2 — CLI: template + shared-policy disable)
#   4B.  Enable advanced routing (check, enable, commit, reboot, verify)
#   4B-POST. Wait for in-progress commits to finish (poll 'show jobs all' every
#            30s, up to 10 min) before STEP 5 starts
#   5.   Set Panorama cloud-service
#   5-POST.  Wait for in-progress commits to finish (same as 4B-POST) before
#            STEP 6B starts
#   6.   [DISABLED] Change hostname (prefix SCMMANAGED- to original hostname)
#   6B.  Save device state and download .tgz to local device_state directory
#   7.   Claim devices to SCM
#   7b.  Enable Configuration Scope at device level in SCM
#   7c.  Associate snp-{serial} snippets to claimed devices
#   8.   Wait 5 minutes for SCM bootstrap
#   8B.  Push config from SCM to claimed devices
#   8C.  Move devices to target_folder (defined in inventory as `target_folder`)
#   8D.  Rename devices in SCM from platform name (PA-440) to inventory_hostname
#   9.   Post-migration snapshot + comparison report (retry after 3 min if needed)
#   10.  Post-migration snapshot retry (if needed)
#   11.  List SCM devices AFTER migration + generate CSV and HTML reports
#
# Required variables (vault-encrypted):
#   group_vars/all/scm_credentials.yml : scm_client_id, scm_client_secret, scm_tsg_id
#   group_vars/firewalls/credentials.yml: username, password
#
# Required per-host inventory vars:
#   panorama_host — IP address of the firewall
#
# -----------------------------------------------------------------------------
# v6 — WHAT'S NEW vs v5
# -----------------------------------------------------------------------------
#   1. START FROM A SPECIFIC STEP.
#      Pass `-e start_at=<step>` to begin at that step and run everything after
#      it. Steps before it are skipped. Default start_at="0" runs the full
#      migration from scratch. Valid values (see playbook_latest/vars/step_control.yml):
#        0 1 2 3 3b 3c 4 4b 4b-post 5 5-post 7 7b 7c 8 8b 8c 8d 9 10 11
#      STEP 0 (base-URL detect) and STEP BOOTSTRAP (serial collection) are
#      tagged "always" and ALWAYS run — they are prerequisites for the SCM steps
#      no matter where you start, so device serials are available even when you
#      begin mid-run (e.g. at 7 or 8b).
#
#   2. RUN A SINGLE STEP WITH TAGS.
#      Every play carries a tag `step<key>` (e.g. step4, step8b). Use --tags to
#      run just that step, or --skip-tags to exclude one.
#
#   3. EXECUTION SUMMARY (automatic).
#      The execution_summary callback plugin writes
#        execution_summary/execution_summary_<timestamp>.txt
#      after EVERY run — including hard failures — listing which steps completed
#      OK, and, on failure, exactly where it stopped/started to fail. No log
#      reading required. (Enabled in ansible.cfg; EXECUTION_SUMMARY_DISABLE=1 to skip.)
#
# Usage:
#   Full migration (all firewalls, from scratch):
#     ansible-playbook playbook_latest/scm_migration_final_v6.yml \
#       --vault-password-file .vault_pass
#
#   Resume from STEP 8B onward:
#     ansible-playbook playbook_latest/scm_migration_final_v6.yml \
#       --vault-password-file .vault_pass -e start_at=8b
#
#   Run only STEP 5:
#     ansible-playbook playbook_latest/scm_migration_final_v6.yml \
#       --vault-password-file .vault_pass --tags step5
#
#   Single firewall, resume from STEP 4:
#     ansible-playbook playbook_latest/scm_migration_final_v6.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01 -e start_at=4
# =============================================================================


# =============================================================================
# STEP 0 — Detect SCM internal API base URL
# Probes the public SCM API gateway to determine gateway mode:
#   RBAC   → base URL: https://api.sase.paloaltonetworks.com
#   DIRECT → base URL: https://paas-{N}.prod.panorama.paloaltonetworks.com
# Sets scm_sase_base_url on localhost for use by all subsequent plays.
# =============================================================================
- name: "STEP 0 — Detect SCM internal API base URL"
  hosts: localhost
  gather_facts: false
  tags: ["always", "step0", "detect"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    scm_public_base_url: "https://api.sase.paloaltonetworks.com"
    scm_probe_endpoint: "/config/ui/api/config/v9.2/Objects/Regions"

  tasks:

    - name: "GATE — Validate start_at value"
      ansible.builtin.fail:
        msg: >-
          Invalid start_at '{{ start_at }}'. Valid values are:
          {{ step_order.keys() | list | sort }}
      when: (start_at | string | lower) not in step_order

    - name: "GATE — Announce start point"
      ansible.builtin.debug:
        msg:
          - "start_at = {{ start_at }} (steps with order >= {{ step_order[start_at | string | lower] }} will run)"
          - "STEP 0 and STEP BOOTSTRAP always run as prerequisites."

    - name: "DETECT — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - name: "DETECT — Decode JWT payload"
      ansible.builtin.set_fact:
        jwt_payload: "{{ (scm_access_token.split('.')[1] + '==') | b64decode | from_json }}"

    - name: "DETECT — Extract TSG ID from token"
      ansible.builtin.set_fact:
        scm_tsg_id_detected: "{{ jwt_payload.tsg_id | default('') }}"

    - name: "DETECT — Display token info"
      ansible.builtin.debug:
        msg:
          - "TSG ID    : {{ scm_tsg_id_detected }}"
          - "Token exp : {{ jwt_payload.exp | default('N/A') }}"

    - name: "DETECT — Probe RBAC gateway endpoint"
      ansible.builtin.uri:
        url: "{{ scm_public_base_url }}{{ scm_probe_endpoint }}"
        method: GET
        headers:
          Authorization: "Bearer {{ scm_access_token }}"
          Accept: "application/json"
        body_format: json
        status_code: "{{ range(100, 600) | list }}"
        return_content: yes
      register: probe_response
      ignore_errors: yes

    - name: "DETECT — Determine gateway mode"
      ansible.builtin.set_fact:
        scm_gateway_mode: "{{ 'RBAC' if (probe_response.status | default(0)) == 200 else 'DIRECT' }}"

    - name: "DETECT — Display probe result"
      ansible.builtin.debug:
        msg:
          - "Probe status : {{ probe_response.status | default('N/A') }}"
          - "Gateway mode : {{ scm_gateway_mode }}"

    - name: "DETECT — RBAC mode: set base URL to public API"
      ansible.builtin.set_fact:
        scm_sase_base_url: "{{ scm_public_base_url }}"
      when: scm_gateway_mode == 'RBAC'

    - name: "DETECT — DIRECT mode: probe candidate paas servers"
      ansible.builtin.uri:
        url: "https://paas-{{ item }}.prod.panorama.paloaltonetworks.com/sase/config/v1/snippets"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Accept: "application/json"
        status_code: "{{ range(100, 600) | list }}"
        return_content: yes
        timeout: 10
      register: paas_probe_results
      ignore_errors: yes
      loop: "{{ range(1, 31) | list }}"
      when: scm_gateway_mode == 'DIRECT'

    - name: "DETECT — DIRECT mode: find paas server that holds tenant data (HTTP 200 AND total > 0)"
      ansible.builtin.set_fact:
        scm_sase_base_url: "https://paas-{{ item.item }}.prod.panorama.paloaltonetworks.com"
      loop: "{{ paas_probe_results.results | default([]) }}"
      when:
        - scm_gateway_mode == 'DIRECT'
        - item.status | default(0) == 200
        - (item.json.total | default(0) | int) > 0
        - scm_sase_base_url is not defined or scm_sase_base_url | length == 0

    - name: "DETECT — Fail if base URL could not be resolved"
      ansible.builtin.fail:
        msg: "Could not detect SCM base URL. Check credentials and network connectivity."
      when: scm_sase_base_url is not defined or scm_sase_base_url | length == 0

    - name: "DETECT — Display detected base URL"
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "  Gateway mode     : {{ scm_gateway_mode }}"
          - "  TSG ID           : {{ scm_tsg_id_detected }}"
          - "  Detected base URL: {{ scm_sase_base_url }}"
          - "================================================"


# =============================================================================
# STEP BOOTSTRAP — Migration context (ALWAYS runs; not gated by start_at)
# Read-only prerequisite lifted out of the old STEP 2 INIT/serial tasks so that,
# regardless of where the run starts (-e start_at=...), every firewall host has:
#   - all result_* report facts initialized to "NOT RUN"
#   - its provider set
#   - device_serial + device_hostname_original collected via 'show system info'
# This is what lets the SCM steps (7/7b/7c/8b/8c/8d) work when you resume
# mid-migration — they read device_serial from hostvars.
# =============================================================================
- name: "STEP BOOTSTRAP — Collect migration context"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["always", "bootstrap"]
  vars_files:
    - vars/step_control.yml

  tasks:

    - name: "INIT — Initialize result facts for all steps"
      ansible.builtin.set_fact:
        result_backup: "NOT RUN"
        result_pre_snapshot: "NOT RUN"
        result_remove_panorama: "NOT RUN"
        result_advanced_routing: "NOT RUN"
        result_cloud_service: "NOT RUN"
        result_hostname_change: "NOT RUN"
        result_device_state: "NOT RUN"
        result_claim: "NOT RUN"
        result_push_config: "NOT RUN"
        result_move_folder: "NOT RUN"
        result_rename_device: "NOT RUN"
        result_post_snapshot: "NOT RUN"
        needs_post_retry: false
        device_serial: "UNKNOWN"
        device_hostname_original: "UNKNOWN"
        device_hostname_new: "UNKNOWN"

    - name: "INIT — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - name: "BOOTSTRAP — Get system info (serial + hostname)"
      paloaltonetworks.panos.panos_op:
        provider: "{{ provider }}"
        cmd: "show system info"
      register: system_info_raw
      ignore_errors: true

    - name: "BOOTSTRAP — Extract serial number and hostname"
      ansible.builtin.set_fact:
        device_serial: "{{ (system_info_raw.stdout | from_json).response.result.system.serial }}"
        device_hostname_original: "{{ (system_info_raw.stdout | from_json).response.result.system.hostname }}"
      when: system_info_raw is succeeded

    - name: "BOOTSTRAP — Display collected context"
      ansible.builtin.debug:
        msg:
          - "Firewall : {{ inventory_hostname }}"
          - "Serial   : {{ device_serial }}"
          - "Hostname : {{ device_hostname_original }}"


# =============================================================================
# STEP 1 — List SCM devices BEFORE migration
# =============================================================================
- name: "STEP 1 — List SCM devices before migration"
  hosts: localhost
  gather_facts: false
  tags: ["step1", "list_before"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "1"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "SCM AUTH — Obtain SCM token"
      ansible.builtin.include_role:
        name: scm_auth

    - name: "SCM LIST — Query registered devices"
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/ngfw/api/v1/devices"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
        status_code: [200, 201]
        return_content: true
      register: scm_before_response
      ignore_errors: true

    - name: "SCM LIST — Save pre-migration device list"
      ansible.builtin.set_fact:
        scm_devices_before: "{{ scm_before_response.json | default([]) }}"

    - name: "SCM LIST — Display devices before migration"
      ansible.builtin.debug:
        msg: "Serial: {{ item.id }} | Hostname: {{ item.hostname | default('N/A') }} | Connected: {{ item.is_connected | default('N/A') }} | SW: {{ item.software_version | default('N/A') }}"
      loop: "{{ scm_devices_before }}"
      when: scm_devices_before | length > 0

    - name: "SCM LIST — No devices registered yet"
      ansible.builtin.debug:
        msg: "No devices currently registered in SCM."
      when: scm_devices_before | length == 0


# =============================================================================
# STEP 2 — Backup firewall configurations + collect serial numbers
# =============================================================================
- name: "STEP 2 — Backup firewall configurations"
  hosts: firewalls
  connection: local
  gather_facts: true
  tags: ["step2", "backup"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "2"
    config_backup_dir: "./firewalls_backups"
    command_output_dir: "./command_outputs"
    operational_commands:
      - "show system info"
      - "show system disk-space"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    # NOTE: result_* facts and device_serial/hostname are initialized in the
    # always-run STEP BOOTSTRAP play, so they are available even if STEP 2 is
    # skipped via start_at. This step only performs the config backup export.

    - name: "INIT — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - name: "BACKUP — Create backup directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ config_backup_dir }}"
        - "{{ command_output_dir }}"
      delegate_to: localhost
      run_once: true

    - block:

        - name: "BACKUP — Export running configuration"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: '<show><config><running></running></config></show>'
            cmd_is_xml: true
          register: running_config_output

        - name: "BACKUP — Save running config as YAML"
          ansible.builtin.copy:
            content: |
              # Running Configuration for {{ inventory_hostname }}
              # Exported: {{ ansible_date_time.iso8601 | default('N/A') }}
              # Source: {{ panorama_host }}

              {{ (running_config_output.stdout | from_json).response.result.config | to_nice_yaml(indent=2, width=120) }}
            dest: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.yaml"
            mode: '0644'
          delegate_to: localhost

        - name: "BACKUP — Save running config as XML"
          ansible.builtin.copy:
            content: "{{ running_config_output.stdout_xml }}"
            dest: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.xml"
            mode: '0644'
          delegate_to: localhost

        - name: "BACKUP — Run operational commands"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "{{ item }}"
          register: command_results
          loop: "{{ operational_commands }}"

        - name: "BACKUP — Save command outputs"
          ansible.builtin.copy:
            content: "{{ command_results.results | map(attribute='stdout_xml') | join('\n\n---\n\n') }}"
            dest: "{{ command_output_dir }}/command-output-{{ inventory_hostname }}.txt"
            mode: '0644'
          delegate_to: localhost

        - name: "BACKUP — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_backup: "SUCCESS"

      rescue:

        - name: "BACKUP — Mark step FAILED"
          ansible.builtin.set_fact:
            result_backup: "FAILED"


# =============================================================================
# STEP 3 — Pre-migration snapshot
# =============================================================================
- name: "STEP 3 — Pre-migration snapshot"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step3", "pre_snapshot"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "3"
    snapshot_directory: "./snapshots"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "PRE-SNAP — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "PRE-SNAP — Take pre-migration snapshot"
          ansible.builtin.include_role:
            name: take_snapshot
          vars:
            snapshot_filename: "pre_snapshot_{{ connection_id }}"

        - name: "PRE-SNAP — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_pre_snapshot: "SUCCESS"

      rescue:

        - name: "PRE-SNAP — Mark step FAILED"
          ansible.builtin.set_fact:
            result_pre_snapshot: "FAILED"


# =============================================================================
# STEP 3B — Check for any existing commit-locks on the firewall.
# Runs BEFORE any config-modifying step (STEP 4 onwards) so the firewall is
# guaranteed to accept commits during the migration. A commit-lock held by
# another admin (set via GUI or CLI) would otherwise cause every subsequent
# commit in this playbook to fail with "Other administrators are holding
# device wide commit locks."
#
# Behavior: CHECK ONLY. If any lock is present, the playbook fails fast
# with a clear message identifying the lock holder(s). Manual cleanup is
# required before re-running. (Automated removal via PAN-OS XML API is
# rejected for cross-admin removal — only the lock holder can release via
# API. Clear the lock through the SCM GUI or device CLI.)
# =============================================================================
- name: "STEP 3B — Check for commit locks (fail fast if any present)"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step3b", "commit_lock"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "3b"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "COMMIT-LOCK — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
          api_key: "{{ api_key | default(omit) }}"
      no_log: true

    # =============================================================
    # Step 1 — Query current commit-locks
    # =============================================================

    - name: "COMMIT-LOCK — Check for existing commit locks"
      paloaltonetworks.panos.panos_op:
        provider: "{{ provider }}"
        cmd: "show commit-locks vsys all"
        cmd_is_xml: false
      register: locks_check

    # =============================================================
    # Step 2 — Extract admin names holding any lock
    # XML-to-JSON quirk: 'entry' is a dict if there's only one lock
    # and a list otherwise. Normalize to a list before extracting.
    # The admin name lives in the @name XML attribute on <entry>.
    # =============================================================

    - name: "COMMIT-LOCK — Extract admin usernames holding the locks"
      ansible.builtin.set_fact:
        locked_admins: >-
          {%- set rslt = (locks_check.stdout | default('{}') | from_json).response.result | default({}) -%}
          {%- set lock_node = rslt['commit-locks'] | default({}) -%}
          {%- set entry = lock_node.entry | default([]) if lock_node is mapping else [] -%}
          {%- set entry_list = [entry] if entry is mapping else (entry | default([])) -%}
          {{ entry_list | rejectattr('@name', 'undefined') | map(attribute='@name') | list }}

    - name: "COMMIT-LOCK — Display current lock state"
      ansible.builtin.debug:
        msg:
          - "Firewall          : {{ inventory_hostname }}"
          - "Commit-locks held : {{ locked_admins | length }}"
          - "Admins holding    : {{ locked_admins if (locked_admins | length > 0) else 'none' }}"

    # =============================================================
    # Step 3 — Hard fail the playbook if any locks are present.
    # Migration cannot proceed safely with active commit-locks; subsequent
    # commits would fail mid-migration leaving the firewall in a partial
    # state. The operator must clear locks via SCM GUI or device CLI
    # before re-running the playbook.
    # =============================================================

    - name: "COMMIT-LOCK — Mark step SUCCESS (no locks)"
      ansible.builtin.set_fact:
        result_commit_lock: "SUCCESS (no locks)"
      when: locked_admins | length == 0

    - name: "COMMIT-LOCK — FAIL playbook if any commit lock is present"
      ansible.builtin.fail:
        msg: |
          Migration aborted — {{ locked_admins | length }} commit-lock(s) currently
          held on {{ inventory_hostname }} by admin(s): {{ locked_admins | join(', ') }}.

          Subsequent commits in this playbook would fail with
          "Other administrators are holding device wide commit locks."

          Clear the lock(s) manually before re-running:
            - SCM GUI:    Commit → Commit Lock → Remove
            - Device CLI: (logged in as the lock holder)
                          > request commit-lock remove
                          OR (as a different superuser)
                          > request commit-lock remove admin <lock_holder>

          Then re-run this playbook.
      when: locked_admins | length > 0


# =============================================================================
# STEP 3C — Save PRE-migration device state (rollback baseline)
# (Formerly STEP 6B — MOVED here to run BEFORE the config-changing steps
# 4 / 4B / 5.)  Runs 'save device-state' on the firewall, then exports the
# .tgz to device_state/device-state-<inventory_hostname>.tgz on the control node.
#
# IMPORTANT: this MUST run before STEP 4 (remove Panorama mgmt), STEP 4B
# (enable advanced routing) and STEP 5 (set cloud-service). Only then is the
# captured state a clean PRE-migration baseline — Panorama-managed, with
# <panorama-server>/<local-panorama>, NO <cloud-service/>, advanced routing
# off — i.e. actually usable by the rollback (import_device_state_firewall.yml).
# Its old position (after STEP 5) produced .tgz files with SCM mgmt config and
# no Panorama server, which are useless for rollback.
# =============================================================================
- name: "STEP 3C — Save PRE-migration device state (rollback baseline)"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step3c", "device_state"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "3c"
    device_state_dir: "device_state"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "DEV-STATE — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
          api_key: "{{ api_key | default(omit) }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "DEV-STATE — Ensure local device_state directory exists"
          ansible.builtin.file:
            path: "{{ device_state_dir }}"
            state: directory
            mode: '0755'
          delegate_to: localhost
          run_once: true

        - name: "DEV-STATE — Run 'save device-state' on firewall"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "save device-state"
            cmd_is_xml: false
          register: result_save_state

        - name: "DEV-STATE — Display save device-state result"
          ansible.builtin.debug:
            msg:
              - "Firewall          : {{ inventory_hostname }}"
              - "Save device state : {{ 'SUCCESS' if result_save_state is succeeded else 'FAILED' }}"

        - name: "DEV-STATE — Export device state .tgz from firewall to local directory"
          paloaltonetworks.panos.panos_export:
            provider: "{{ provider }}"
            category: "device-state"
            filename: "{{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"
            create_directory: true
          register: result_export_state
          delegate_to: localhost

        - name: "DEV-STATE — Display export result"
          ansible.builtin.debug:
            msg:
              - "Firewall          : {{ inventory_hostname }}"
              - "Export status     : {{ 'SUCCESS' if result_export_state is succeeded else 'FAILED' }}"
              - "Saved to          : {{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"

        - name: "DEV-STATE — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_device_state: "SUCCESS"

      rescue:

        - name: "DEV-STATE — Mark step FAILED"
          ansible.builtin.set_fact:
            result_device_state: "FAILED"


# =============================================================================
# STEP 4 — Remove Panorama management from firewalls (v2 — CLI-based)
# Uses operational CLI commands instead of xpath config element edits:
#   set system setting template disable      → stops template push from Panorama
#   set system setting shared-policy disable → stops policy/objects push from Panorama
# Both commands take effect immediately; no commit required.
# =============================================================================
- name: "STEP 4 — Remove Panorama management"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step4", "rm_panorama"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "4"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "RM-PANO — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
          api_key: "{{ api_key | default(omit) }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "RM-PANO — Disable Device and Network Template push"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "set system setting template disable"
            cmd_is_xml: false
          register: result_template_disable
          ignore_errors: true

        - name: "RM-PANO — Display template disable result"
          ansible.builtin.debug:
            msg:
              - "Template disable: {{ 'SUCCESS' if result_template_disable is succeeded else 'FAILED' }}"
              - "Output          : {{ result_template_disable.stdout_xml | default(result_template_disable.msg | default('N/A')) }}"

        - name: "RM-PANO — Disable Panorama shared-policy push"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "set system setting shared-policy disable"
            cmd_is_xml: false
          register: result_shared_policy_disable
          ignore_errors: true

        - name: "RM-PANO — Display shared-policy disable result"
          ansible.builtin.debug:
            msg:
              - "Shared-policy disable: {{ 'SUCCESS' if result_shared_policy_disable is succeeded else 'FAILED' }}"
              - "Output               : {{ result_shared_policy_disable.stdout_xml | default(result_shared_policy_disable.msg | default('N/A')) }}"

        - name: 'Enable Device and Network Template (set system setting template enable)'
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "set system setting template enable"
            cmd_is_xml: false
          register: result_template_enable
          ignore_errors: true

        - name: "RM-PANO — Display template enable result"
          ansible.builtin.debug:
            msg:
              - "Template enable: {{ 'SUCCESS' if result_template_enable is succeeded else 'FAILED' }}"
              - "Output         : {{ result_template_enable.stdout_xml | default(result_template_enable.msg | default('N/A')) }}"

        - name: 'Enable Panorama Policy and Objects (set system setting shared-policy enable)'
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "set system setting shared-policy enable"
            cmd_is_xml: false
          register: result_shared_policy_enable
          ignore_errors: true

        - name: "RM-PANO — Display shared-policy enable result"
          ansible.builtin.debug:
            msg:
              - "Shared-policy enable: {{ 'SUCCESS' if result_shared_policy_enable is succeeded else 'FAILED' }}"
              - "Output              : {{ result_shared_policy_enable.stdout_xml | default(result_shared_policy_enable.msg | default('N/A')) }}"

        - name: "RM-PANO — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_remove_panorama: "SUCCESS"

        - name: "RM-PANO — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_remove_panorama: "SUCCESS"

      rescue:

        - name: "RM-PANO — Mark step FAILED"
          ansible.builtin.set_fact:
            result_remove_panorama: "FAILED"


# =============================================================================
# STEP 4B — Enable advanced routing
# Checks if advanced routing is already enabled. If not:
#   1. Sets deviceconfig/setting/advance-routing to yes
#   2. Commits the configuration
#   3. Reboots the firewall (reboot required for the engine to activate)
#   4. Waits for the device to come back online
#   5. Verifies advanced routing is active post-reboot
# If already enabled, marks step SKIPPED and continues.
# =============================================================================
- name: "STEP 4B — Enable advanced routing"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step4b", "advanced_routing"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "4b"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "ADV-ROUTING — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
          api_key: "{{ api_key | default(omit) }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "ADV-ROUTING — Check current advanced routing state"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "show system state"
            cmd_is_xml: false
          register: system_state_result

        - name: "ADV-ROUTING — Parse current advanced routing status"
          ansible.builtin.set_fact:
            advance_routing_enabled: "{{ 'cfg.general.advance-routing-enabled: True' in system_state_result.stdout }}"

        - name: "ADV-ROUTING — Display current advanced routing status"
          ansible.builtin.debug:
            msg:
              - "Firewall:         {{ inventory_hostname }}"
              - "Advanced routing: {{ 'ENABLED' if advance_routing_enabled else 'NOT ENABLED' }}"

        - name: "ADV-ROUTING — Already enabled — mark SKIPPED and continue"
          ansible.builtin.set_fact:
            result_advanced_routing: "SKIPPED"
          when: advance_routing_enabled

        - name: "ADV-ROUTING — Enable advanced routing in device configuration"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting"
            element: "<advance-routing>yes</advance-routing>"
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Commit configuration"
          paloaltonetworks.panos.panos_commit_firewall:
            provider: "{{ provider }}"
            description: "Enable advanced routing engine"
          register: commit_result
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Reboot the firewall"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "<request><restart><system/></restart></request>"
            cmd_is_xml: true
          ignore_errors: true
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Wait for firewall to begin shutdown (port 443 closes)"
          ansible.builtin.wait_for:
            host: "{{ panorama_host }}"
            port: 443
            delay: 15
            timeout: 120
            state: stopped
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Wait for firewall to come back online (port 443 reopens)"
          ansible.builtin.wait_for:
            host: "{{ panorama_host }}"
            port: 443
            delay: 30
            timeout: 600
            sleep: 60
            state: started
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Pause for management plane to fully initialize"
          ansible.builtin.pause:
            seconds: 30
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Verify advanced routing state after reboot"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "show system state"
            cmd_is_xml: false
          register: system_state_after
          retries: 5
          delay: 30
          until: system_state_after is not failed
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Parse post-reboot advanced routing status"
          ansible.builtin.set_fact:
            advance_routing_after_reboot: "{{ 'cfg.general.advance-routing-enabled: True' in system_state_after.stdout }}"
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Display post-reboot advanced routing status"
          ansible.builtin.debug:
            msg:
              - "Firewall:                  {{ inventory_hostname }}"
              - "Advanced routing (before): NOT ENABLED"
              - "Advanced routing (after):  {{ 'ENABLED' if advance_routing_after_reboot else 'NOT ENABLED — investigate' }}"
          when: not advance_routing_enabled

        - name: "ADV-ROUTING — Fail if advanced routing not active after reboot"
          ansible.builtin.fail:
            msg: "Advanced routing is still NOT enabled after reboot on {{ inventory_hostname }}. Manual investigation required."
          when:
            - not advance_routing_enabled
            - not advance_routing_after_reboot

        - name: "ADV-ROUTING — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_advanced_routing: "SUCCESS"
          when: not advance_routing_enabled

      rescue:

        - name: "ADV-ROUTING — Mark step FAILED"
          ansible.builtin.set_fact:
            result_advanced_routing: "FAILED"


# =============================================================================
# STEP 4B-POST — Wait for in-progress commits to finish before STEP 5.
# After STEP 4B's reboot the firewall may have a queued/auto-commit running.
# Starting STEP 5 (which commits a new cloud-service element) while another
# commit is still active would either block or fail. Poll 'show jobs all'
# every 30s for up to 10 minutes — proceed as soon as no Commit/AutoCom job
# is in ACT or PEND state.
# =============================================================================
- name: "STEP 4B-POST — Wait for any in-progress commits to finish"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step4b-post", "wait_commits"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "4b-post"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "WAIT-COMMITS — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
          api_key: "{{ api_key | default(omit) }}"
      no_log: true

    # v7 Fix #1a — settle pause so the post-reboot boot auto-commit has time to
    # ENQUEUE before we poll. Without it, the poll below can see "no ACT/PEND"
    # on its first pass (the auto-commit hasn't started yet), return CLEAR
    # prematurely, and STEP 5's commit then fails with
    # "auto-commit not yet finished successfully". Only needed when STEP 4B
    # actually rebooted (i.e. AR was freshly enabled — advance_routing_enabled
    # was False before). Skipped when ARE was already on (no reboot).
    - name: "WAIT-COMMITS — Settle pause for post-reboot auto-commit to enqueue"
      ansible.builtin.pause:
        seconds: 60
      when: not (advance_routing_enabled | default(false) | bool)

    - name: "WAIT-COMMITS — Poll 'show jobs all' until no Commit/AutoCom is ACT or PEND (max 10 min)"
      paloaltonetworks.panos.panos_op:
        provider: "{{ provider }}"
        cmd: "show jobs all"
        cmd_is_xml: false
      register: jobs_check
      vars:
        # PAN-OS XML-to-JSON returns 'job' as a dict if there's exactly one
        # job and a list otherwise — normalize to a list before filtering.
        _jobs_raw: "{{ (jobs_check.stdout | default('{}') | from_json).response.result.job | default([]) }}"
        _jobs_list: "{{ [_jobs_raw] if (_jobs_raw is mapping) else _jobs_raw }}"
        active_commit_jobs: >-
          {{ _jobs_list
             | selectattr('type', 'in', ['Commit', 'AutoCom'])
             | selectattr('status', 'in', ['ACT', 'PEND'])
             | list }}
      until: active_commit_jobs | length == 0
      retries: 20      # 20 × 30s = 10 minutes max
      delay: 30
      changed_when: false
      ignore_errors: true

    - name: "WAIT-COMMITS — Display final commit-job state"
      ansible.builtin.debug:
        msg:
          - "Firewall          : {{ inventory_hostname }}"
          - "Wait status       : {{ 'CLEAR — no active commits' if jobs_check is succeeded else 'TIMEOUT — commit still in progress after 10 min' }}"


# =============================================================================
# STEP 5 — Set Panorama cloud-service
# =============================================================================
- name: "STEP 5 — Set Panorama cloud-service"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step5", "cloud_service"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "5"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "CLOUD-SVC — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "CLOUD-SVC — Set Panorama cloud-service element"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/panorama"
            element: '<cloud-service/>'

        # v7 Fix #1b — retry the commit past the post-reboot window. After
        # STEP 4B enables ARE and reboots, PAN-OS rejects manual commits with
        # "Commit job was not queued since auto-commit not yet finished
        # successfully" until the boot auto-commit completes. Retrying until the
        # commit is accepted rides out that window (this was the intermittent
        # "cloud-service didn't commit" failure on fresh-convert firewalls).
        - name: "CLOUD-SVC — Commit configuration (retry past post-reboot auto-commit)"
          paloaltonetworks.panos.panos_commit_firewall:
            provider: "{{ provider }}"
            description: "Set Panorama cloud-service via Ansible"
          register: cloud_commit
          until: cloud_commit is succeeded
          retries: 10      # 10 × 30s = up to 5 min for the boot auto-commit to finish
          delay: 30

        - name: "CLOUD-SVC — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_cloud_service: "SUCCESS"

      rescue:

        - name: "CLOUD-SVC — Mark step FAILED"
          ansible.builtin.set_fact:
            result_cloud_service: "FAILED"


# =============================================================================
# STEP 5-POST — Wait for in-progress commits to finish before STEP 6B.
# Same logic as STEP 4B-POST: STEP 5's cloud-service commit may still be
# running when this play starts. Block STEP 6B (save device state) until
# all Commit/AutoCom jobs are done.
# =============================================================================
- name: "STEP 5-POST — Wait for any in-progress commits to finish"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step5-post", "wait_commits"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "5-post"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "WAIT-COMMITS — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
          api_key: "{{ api_key | default(omit) }}"
      no_log: true

    # v7 Fix #1 (parity with STEP 4B-POST) — settle pause so STEP 5's just-issued
    # cloud-service commit (or any content-update-triggered auto-commit) is
    # registered in the job list before we poll, so the poll below can't return
    # "CLEAR" before the commit appears. STEP 5 does not reboot, so this is a
    # short unconditional pause (no boot auto-commit to wait on here).
    - name: "WAIT-COMMITS — Settle pause so a just-issued commit appears in the job list"
      ansible.builtin.pause:
        seconds: 30

    - name: "WAIT-COMMITS — Poll 'show jobs all' until no Commit/AutoCom is ACT or PEND (max 10 min)"
      paloaltonetworks.panos.panos_op:
        provider: "{{ provider }}"
        cmd: "show jobs all"
        cmd_is_xml: false
      register: jobs_check
      vars:
        _jobs_raw: "{{ (jobs_check.stdout | default('{}') | from_json).response.result.job | default([]) }}"
        _jobs_list: "{{ [_jobs_raw] if (_jobs_raw is mapping) else _jobs_raw }}"
        active_commit_jobs: >-
          {{ _jobs_list
             | selectattr('type', 'in', ['Commit', 'AutoCom'])
             | selectattr('status', 'in', ['ACT', 'PEND'])
             | list }}
      until: active_commit_jobs | length == 0
      retries: 20
      delay: 30
      changed_when: false
      ignore_errors: true

    - name: "WAIT-COMMITS — Display final commit-job state"
      ansible.builtin.debug:
        msg:
          - "Firewall          : {{ inventory_hostname }}"
          - "Wait status       : {{ 'CLEAR — no active commits' if jobs_check is succeeded else 'TIMEOUT — commit still in progress after 10 min' }}"


