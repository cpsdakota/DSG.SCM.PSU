# =============================================================================
# (STEP 6B — Save device state) MOVED UP to "STEP 3C" (before STEP 4) so the
# captured device-state is a clean PRE-migration baseline usable for rollback.
# See STEP 3C above. Nothing runs here anymore.
# =============================================================================


# =============================================================================
# STEP 7 — Claim devices to SCM
# Collects serial numbers from all firewall hostvars gathered in Step 2.
# =============================================================================
- name: "STEP 7 — Claim devices to SCM"
  hosts: localhost
  gather_facts: false
  tags: ["step7", "claim"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "7"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "CLAIM — Collect serial numbers from migration hosts"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ groups['firewalls']
             | map('extract', hostvars)
             | selectattr('device_serial', 'defined')
             | map(attribute='device_serial')
             | reject('equalto', 'UNKNOWN')
             | list }}

    - name: "CLAIM — Display devices to be claimed"
      ansible.builtin.debug:
        msg:
          - "=== Claiming devices to SCM ==="
          - "Serial numbers: {{ migration_serials }}"

    - name: "CLAIM — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - block:

        # -------------------------------------------------------------------
        # v8 Fix #1 — PER-DEVICE claim (was a single bulk POST of every serial).
        #   The bulk claim is all-or-nothing: on 2026-08-23 SCM returned HTTP 500
        #   (errorCode ADMIN_API_I00007) for the store batch and the ONE failed
        #   POST left all 8 serials un-claimed, so they sat in "Available Devices"
        #   and never became Cloud Managed. Claiming one serial at a time isolates
        #   a transient SCM fault to the single device that hit it.
        #
        # v8 Fix #2 — RETRY/UNTIL on the claim. 5xx/429 responses are accepted by
        #   status_code (so they do NOT raise and skip the retry loop); the until:
        #   clause is what decides success and drives the retries. ignore_errors
        #   keeps one device that never succeeds from aborting the whole play.
        # -------------------------------------------------------------------
        - name: "CLAIM — Claim each device to SCM (per-device, with retry)"
          ansible.builtin.uri:
            url: "https://admin.prod.panorama.paloaltonetworks.com/api/v2/device-registrations/claim"
            method: POST
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              devices: ["{{ item }}"]
              labels: []
            status_code: [200, 201, 429, 500, 502, 503, 504]
            return_content: true
          register: claim_per_device
          loop: "{{ migration_serials }}"
          loop_control:
            label: "{{ item }}"
          when: migration_serials | length > 0
          retries: 5
          delay: 20
          until: claim_per_device.status is defined and claim_per_device.status in [200, 201]
          ignore_errors: true

        - name: "CLAIM — Display per-device claim results"
          ansible.builtin.debug:
            msg: >-
              Device {{ item.item }}:
              {{ 'SUCCESS (HTTP ' ~ (item.status | default('?') | string) ~ ')'
                 if (item.status | default(0)) in [200, 201]
                 else 'FAILED (HTTP ' ~ (item.status | default('?') | string) ~ ' after retries)' }}
          loop: "{{ claim_per_device.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: claim_per_device is not skipped

        # -------------------------------------------------------------------
        # v8 Fix #3 — Record exactly which serials claimed OK. STEP 7b/7c/8c/8d
        #   read this list (hostvars['localhost'].claimed_serials) and only act
        #   on devices that actually made it into SCM, so a device that failed to
        #   claim no longer triggers misleading 400 / "not found in tree" noise
        #   downstream. If STEP 7 is skipped on a resume, the list is undefined
        #   and downstream steps fall back to the full serial set (old behavior).
        # -------------------------------------------------------------------
        - name: "CLAIM — Build list of successfully-claimed serials"
          ansible.builtin.set_fact:
            claimed_serials: >-
              {{ claim_per_device.results | default([])
                 | selectattr('status', 'defined')
                 | selectattr('status', 'in', [200, 201])
                 | map(attribute='item') | list }}

        - name: "CLAIM — Report claimed vs failed serials"
          ansible.builtin.debug:
            msg:
              - "Claimed OK : {{ claimed_serials }}"
              - "Failed     : {{ migration_serials | difference(claimed_serials) }}"

        - name: "CLAIM — Mark claim SUCCESS (at least one device claimed)"
          ansible.builtin.set_fact:
            claim_result_localhost: "{{ 'SUCCESS' if (claimed_serials | length > 0) else 'FAILED' }}"

      rescue:

        - name: "CLAIM — Mark claim FAILED"
          ansible.builtin.set_fact:
            claim_result_localhost: "FAILED"
            claimed_serials: []

# --- Internal: propagate claim result to firewall hosts for final report ---
- name: "STEP 7 (internal) — Propagate claim result to firewall hosts"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step7", "claim"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "7"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "CLAIM — Set claim result on each firewall host"
      ansible.builtin.set_fact:
        result_claim: "{{ hostvars['localhost'].claim_result_localhost | default('SKIPPED') }}"


# =============================================================================
# STEP 7b — Enable Configuration Scope at device level in SCM
# For each claimed device, checks the SASE folder tree to determine whether
# Configuration Scope is already enabled (device_only == false/absent).
# If disabled (device_only == true), POSTs to device-config/device-containers
# to switch the device from monitoring-only to configuration-managed mode.
# Idempotent — safe to re-run. No commit required.
# =============================================================================
- name: "STEP 7b — Enable Configuration Scope at device level"
  hosts: localhost
  gather_facts: false
  tags: ["step7b", "config_scope"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "7b"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "CONFIG-SCOPE — Collect serial numbers from migration hosts"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ groups['firewalls']
             | map('extract', hostvars)
             | selectattr('device_serial', 'defined')
             | map(attribute='device_serial')
             | reject('equalto', 'UNKNOWN')
             | list }}

    # v8 Fix #3 — only touch devices that actually claimed in STEP 7. If STEP 7
    # was skipped (resume), claimed_serials is undefined → fall back to the full
    # set so behavior matches the pre-v8 playbook.
    - name: "CONFIG-SCOPE — Restrict to successfully-claimed devices (#3)"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ migration_serials | intersect(hostvars['localhost'].claimed_serials)
             if (hostvars['localhost'].claimed_serials is defined)
             else migration_serials }}

    - name: "CONFIG-SCOPE — Display devices to process"
      ansible.builtin.debug:
        msg:
          - "=== Enabling Configuration Scope for claimed devices ==="
          - "Base URL       : {{ scm_sase_base_url }}"
          - "Serial numbers : {{ migration_serials }}"

    - name: "CONFIG-SCOPE — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    # -----------------------------------------------------------------------
    # v8 Fix #4 — the folder-tree GET below was UNPROTECTED. On 2026-08-26 a
    # non-200 from this GET failed the only host (localhost), which aborted the
    # ENTIRE playbook: move-to-folder, rename and snippets never ran. Wrapping
    # the fetch + downstream work in block/rescue (with retry/until on the GET
    # and tolerant status_code) turns a transient SCM error into a skipped
    # STEP 7b instead of a whole-run abort.
    # -----------------------------------------------------------------------
    - block:

        - name: "CONFIG-SCOPE — Fetch SASE folder tree (retry on transient SCM error)"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/folders"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: [200, 201, 429, 500, 502, 503, 504]
            return_content: true
          register: folders_response
          retries: 5
          delay: 20
          until: folders_response.status is defined and folders_response.status in [200, 201]

        - name: "CONFIG-SCOPE — Diagnostic: show folder tree depth and device lookup"
          vars:
            l0: "{{ folders_response.json.data | default([]) }}"
            l1: "{{ l0 | map(attribute='children', default=[]) | flatten | list }}"
            l2: "{{ l1 | map(attribute='children', default=[]) | flatten | list }}"
            l3: "{{ l2 | map(attribute='children', default=[]) | flatten | list }}"
            l4: "{{ l3 | map(attribute='children', default=[]) | flatten | list }}"
            all_nodes: "{{ (l0 + l1 + l2 + l3 + l4) }}"
            all_serials: "{{ all_nodes | selectattr('serial_number', 'defined') | map(attribute='serial_number') | list }}"
          ansible.builtin.debug:
            msg:
              - "API pagination meta        : total={{ folders_response.json.total | default('?') }} limit={{ folders_response.json.limit | default('?') }} offset={{ folders_response.json.offset | default('?') }}"
              - "Folder tree top-level keys : {{ folders_response.json.keys() | list if folders_response.json is mapping else 'response is not a dict' }}"
              - "Nodes at each level (L0..L4): {{ [l0|length, l1|length, l2|length, l3|length, l4|length] }}"
              - "Total nodes with serial_number: {{ all_serials | length }}"
              - "All serials found in tree (first 20): {{ (all_serials | sort)[:20] }}"
              - "Looking for these serials  : {{ migration_serials }}"
              - "Serials matched in tree    : {{ all_serials | intersect(migration_serials) }}"

        - name: "CONFIG-SCOPE — Enable Configuration Scope per device"
          vars:
            folder_device_entry: >-
              {%- set l0 = folders_response.json.data -%}
              {%- set l1 = l0 | map(attribute='children', default=[]) | flatten -%}
              {%- set l2 = l1 | map(attribute='children', default=[]) | flatten -%}
              {%- set l3 = l2 | map(attribute='children', default=[]) | flatten -%}
              {%- set l4 = l3 | map(attribute='children', default=[]) | flatten -%}
              {%- set l5 = l4 | map(attribute='children', default=[]) | flatten -%}
              {%- set l6 = l5 | map(attribute='children', default=[]) | flatten -%}
              {{ (l0 + l1 + l2 + l3 + l4 + l5 + l6) | selectattr('serial_number', 'defined') | selectattr('serial_number', 'equalto', item) | list | first | default({}) }}
            config_scope_disabled: "{{ folder_device_entry.device_only | default(false) | bool }}"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/api/sase/config/v1/device-config/device-containers"
            method: POST
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              name: "{{ item }}"
            status_code: [200, 201, 400]
            return_content: true
          register: config_scope_results
          when: config_scope_disabled
          loop: "{{ migration_serials }}"
          ignore_errors: true

        - name: "CONFIG-SCOPE — Display results per device"
          ansible.builtin.debug:
            msg: >-
              Device {{ item.item }}:
              {{ 'SKIPPED (Config Scope already enabled)' if item is skipped
                 else ('ENABLED (HTTP ' + (item.status | string) + ')')
                 if item.status | default(0) in [200, 201]
                 else ('ALREADY EXISTS — already enabled' if (item.json._errors | default([]) | selectattr('code', 'equalto', 'API_I00013') | list | length > 0)
                 else 'FAILED (HTTP ' + (item.status | default('?') | string) + ')') }}
          loop: "{{ config_scope_results.results | default([]) }}"

        - name: "CONFIG-SCOPE — Mark step SUCCESS"
          ansible.builtin.set_fact:
            config_scope_result_localhost: "SUCCESS"

      rescue:

        - name: "CONFIG-SCOPE — Mark step FAILED (transient SCM error — run continues)"
          ansible.builtin.set_fact:
            config_scope_result_localhost: "FAILED"

        - name: "CONFIG-SCOPE — Explain non-fatal skip"
          ansible.builtin.debug:
            msg: >-
              STEP 7b could not complete (SCM folder tree unavailable after retries).
              Continuing the run so move-to-folder / rename / snippets still execute.
              Re-run just this step later with:  -e start_at=7b  once SCM is healthy.


# =============================================================================
# STEP 7c — Associate snp-{serial} snippets to claimed devices
# Derives snippet name as "snp-{serial}" for each migrated device,
# resolves the snippet UUID from the SCM snippets list, then calls
# PUT /sase/config/v1/snippets/{uuid}?device={serial} to associate.
# =============================================================================
- name: "STEP 7c — Associate snippets to claimed devices"
  hosts: localhost
  gather_facts: false
  tags: ["step7c", "snippets"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "7c"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "SNIPPET — Collect serial numbers from migration hosts"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ groups['firewalls']
             | map('extract', hostvars)
             | selectattr('device_serial', 'defined')
             | map(attribute='device_serial')
             | reject('equalto', 'UNKNOWN')
             | list }}

    # v8 Fix #3 — only associate snippets for devices that actually claimed in
    # STEP 7 (fall back to the full set if STEP 7 was skipped on a resume).
    - name: "SNIPPET — Restrict to successfully-claimed devices (#3)"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ migration_serials | intersect(hostvars['localhost'].claimed_serials)
             if (hostvars['localhost'].claimed_serials is defined)
             else migration_serials }}

    - name: "SNIPPET — Display devices to associate"
      ansible.builtin.debug:
        msg:
          - "=== Associating snp-{serial} snippets to devices ==="
          - "Base URL       : {{ scm_sase_base_url }}"
          - "Serial numbers : {{ migration_serials }}"

    - name: "SNIPPET — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    # ==========================================
    # Paginated snippet fetch.
    # SCM caps the snippets endpoint at limit=200 per response regardless of
    # what you ask for (we tested ?limit=10000 → returns total=0). To get the
    # full list we fetch page 1 to learn the total, then loop offset by 200.
    # ==========================================

    # -----------------------------------------------------------------------
    # v8 Fix #4 — both snippet-page GETs below were UNPROTECTED (status_code 200,
    # no rescue). A single non-200 failed localhost and aborted the whole run,
    # so move/rename/snippets were all lost. Wrap the fetch + association in
    # block/rescue and give each GET retry/until + tolerant status_code so a
    # transient SCM error skips STEP 7c instead of killing the migration.
    # -----------------------------------------------------------------------
    - block:

        - name: "SNIPPET — Fetch page 1 of snippets list from SCM (retry on transient error)"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/snippets?limit=200&offset=0"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: [200, 429, 500, 502, 503, 504]
            return_content: yes
          register: snippets_page_1
          retries: 5
          delay: 20
          until: snippets_page_1.status is defined and snippets_page_1.status == 200

        - name: "SNIPPET — Initialize accumulator with page 1 results"
          ansible.builtin.set_fact:
            all_snippets: "{{ snippets_page_1.json.data | default([]) }}"
            snippets_total: "{{ snippets_page_1.json.total | default(0) | int }}"
            snippets_page_size: "{{ snippets_page_1.json.limit | default(200) | int }}"

        - name: "SNIPPET — Compute remaining page offsets needed"
          ansible.builtin.set_fact:
            additional_offsets: "{{ range(snippets_page_size | int, snippets_total | int, snippets_page_size | int) | list }}"

        - name: "SNIPPET — Fetch remaining snippet pages (offset loop, retry on transient error)"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/snippets?limit={{ snippets_page_size }}&offset={{ item }}"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: [200, 429, 500, 502, 503, 504]
            return_content: yes
          register: additional_pages
          loop: "{{ additional_offsets }}"
          loop_control:
            label: "offset={{ item }}"
          when: additional_offsets | length > 0
          retries: 5
          delay: 20
          until: additional_pages.status is defined and additional_pages.status == 200

        - name: "SNIPPET — Append remaining pages to accumulator"
          ansible.builtin.set_fact:
            all_snippets: "{{ all_snippets + (item.json.data | default([])) }}"
          loop: "{{ additional_pages.results | default([]) }}"
          loop_control:
            label: "offset={{ item.item }} (+{{ item.json.data | default([]) | length }} snippets)"
          when:
            - additional_pages is defined
            - additional_pages.results is defined

        - name: "SNIPPET — Build unified snippets_response (preserves downstream code)"
          ansible.builtin.set_fact:
            snippets_response:
              json:
                data: "{{ all_snippets }}"
                total: "{{ snippets_total | int }}"
                offset: 0
                limit: "{{ all_snippets | length }}"

        - name: "SNIPPET — Diagnostic: show snippet count and sample names"
          vars:
            snippet_names: "{{ snippets_response.json.data | default([]) | selectattr('name', 'defined') | map(attribute='name') | list }}"
            expected_names: "{{ migration_serials | map('regex_replace', '^', 'snp-') | list }}"
            jwt_payload: "{{ (scm_access_token.split('.')[1] + '==') | b64decode | from_json }}"
          ansible.builtin.debug:
            msg:
              - "Token TSG ID        : {{ jwt_payload.tsg_id | default('?') }}"
              - "Token scope         : {{ jwt_payload.scope | default('?') }}"
              - "SCM base URL        : {{ scm_sase_base_url }}"
              - "API pagination meta : total={{ snippets_response.json.total | default('?') }} limit={{ snippets_response.json.limit | default('?') }} offset={{ snippets_response.json.offset | default('?') }}"
              - "Snippets returned   : {{ snippet_names | length }}"
              - "Top-level keys      : {{ snippets_response.json.keys() | list if snippets_response.json is mapping else 'response is not a dict' }}"
              - "Sample names (first 10): {{ (snippet_names | sort)[:10] }}"
              - "Sample names containing 'snp-': {{ (snippet_names | select('match', '^snp-') | list)[:10] }}"
              - "Looking for         : {{ expected_names }}"
              - "Matched any expected: {{ snippet_names | intersect(expected_names) }}"

        - name: "SNIPPET — Warn if snippet not found for device"
          vars:
            current_uuid: "{{ snippets_response.json.data
              | selectattr('name', 'defined')
              | selectattr('name', 'equalto', 'snp-' + item)
              | map(attribute='id')
              | first
              | default('') }}"
          ansible.builtin.debug:
            msg: "WARNING: Snippet 'snp-{{ item }}' not found in SCM — skipping association."
          when: current_uuid | length == 0
          loop: "{{ migration_serials }}"

        - name: "SNIPPET — Associate snp-{serial} snippet to each device"
          vars:
            current_uuid: "{{ snippets_response.json.data
              | selectattr('name', 'defined')
              | selectattr('name', 'equalto', 'snp-' + item)
              | map(attribute='id')
              | first
              | default('') }}"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/snippets/{{ current_uuid }}?device={{ item }}"
            method: PUT
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
            body: ""
            status_code: 200
            return_content: yes
          when: current_uuid | length > 0
          loop: "{{ migration_serials }}"
          register: snippet_assoc_results
          ignore_errors: yes

        - name: "SNIPPET — Display association results"
          ansible.builtin.debug:
            msg: >-
              Device {{ item.item }}:
              {{ 'SKIPPED (snippet not found)' if item is skipped
                 else ('SUCCESS' if item.status | default(0) == 200
                 else 'FAILED (HTTP ' + (item.status | default('?') | string) + ')') }}
          loop: "{{ snippet_assoc_results.results | default([]) }}"

        - name: "SNIPPET — Mark step SUCCESS"
          ansible.builtin.set_fact:
            snippet_result_localhost: "SUCCESS"

      rescue:

        - name: "SNIPPET — Mark step FAILED (transient SCM error — run continues)"
          ansible.builtin.set_fact:
            snippet_result_localhost: "FAILED"

        - name: "SNIPPET — Explain non-fatal skip"
          ansible.builtin.debug:
            msg: >-
              STEP 7c could not complete (SCM snippets endpoint unavailable after retries).
              Continuing the run so move-to-folder / rename still execute.
              Re-run just this step later with:  -e start_at=7c  once SCM is healthy.


# =============================================================================
# STEP 8 — Wait 10 minutes for SCM bootstrap
# =============================================================================
- name: "STEP 8 — Wait for SCM bootstrap"
  hosts: localhost
  gather_facts: false
  tags: ["step8", "scm_bootstrap_wait"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "8"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "BOOTSTRAP — Wait 10 minutes for SCM bootstrap to complete"
      ansible.builtin.pause:
        minutes: 10
        prompt: "Waiting 10 minutes for SCM bootstrap to complete..."


# =============================================================================
# STEP 8C — MOVE DEVICE FOLDER
# Moves each migrated device's folder entry in SCM to the target_folder
# defined in inventory (group_vars/all). Required because newly-claimed
# devices land in a default scope; they must be relocated to the tenant's
# target folder before subsequent config pushes scope correctly.
# Logic mirrors move_device_folder.yml, batched across all migrated serials.
# =============================================================================
- name: "STEP 8C — MOVE DEVICE FOLDER"
  hosts: localhost
  gather_facts: false
  tags: ["step8c", "move_folder"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "8c"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "MOVE-FOLDER — Collect serial numbers from migration hosts"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ groups['firewalls']
             | map('extract', hostvars)
             | selectattr('device_serial', 'defined')
             | map(attribute='device_serial')
             | reject('equalto', 'UNKNOWN')
             | list }}

    # v8 Fix #3 — only move devices that actually claimed in STEP 7 (fall back to
    # the full set if STEP 7 was skipped on a resume).
    - name: "MOVE-FOLDER — Restrict to successfully-claimed devices (#3)"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ migration_serials | intersect(hostvars['localhost'].claimed_serials)
             if (hostvars['localhost'].claimed_serials is defined)
             else migration_serials }}

    - name: "MOVE-FOLDER — Resolve target_folder from inventory"
      ansible.builtin.set_fact:
        effective_target_folder: "{{ hostvars[groups['firewalls'][0]].target_folder | default(target_folder | default('')) }}"

    - name: "MOVE-FOLDER — Display move operation summary"
      ansible.builtin.debug:
        msg:
          - "=== Moving devices to SCM target folder ==="
          - "Base URL      : {{ scm_sase_base_url }}"
          - "Devices       : {{ migration_serials }}"
          - "Target folder : {{ effective_target_folder }}"

    - name: "MOVE-FOLDER — Skip if no devices or target_folder is missing"
      ansible.builtin.meta: end_play
      when:
        - (migration_serials | length == 0) or (effective_target_folder | length == 0)

    - name: "MOVE-FOLDER — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - block:

        - name: "MOVE-FOLDER — Fetch SCM folder tree"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/folders"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: 200
            return_content: yes
          register: folders_response

        - name: "MOVE-FOLDER — Build device-serial → folder-id lookup"
          ansible.builtin.set_fact:
            device_folder_ids: >-
              {%- set result = {} -%}
              {%- set l0 = folders_response.json.data | default([]) -%}
              {%- set l1 = l0 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l2 = l1 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l3 = l2 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l4 = l3 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l5 = l4 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l6 = l5 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set all_nodes = l0 + l1 + l2 + l3 + l4 + l5 + l6 -%}
              {%- for node in all_nodes if node.serial_number is defined -%}
                {%- set _ = result.update({node.serial_number: node.id}) -%}
              {%- endfor -%}
              {{ result }}

        - name: "MOVE-FOLDER — Display device → folder-id lookup"
          ansible.builtin.debug:
            msg:
              - "Devices found in folder tree:"
              - "{{ device_folder_ids }}"

        - name: "MOVE-FOLDER — Warn for devices not found in tree"
          ansible.builtin.debug:
            msg: "WARNING: Device {{ item }} not found in SCM folder tree — skipping move."
          when: item not in device_folder_ids
          loop: "{{ migration_serials }}"

        - name: "MOVE-FOLDER — Move each device to target folder"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/folders/{{ device_folder_ids[item] }}/move"
            method: PUT
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              target_parent: "{{ effective_target_folder }}"
            status_code: 200
            return_content: yes
          when: item in device_folder_ids
          loop: "{{ migration_serials }}"
          register: move_results
          ignore_errors: yes

        - name: "MOVE-FOLDER — Display move results per device"
          ansible.builtin.debug:
            msg: >-
              Device {{ item.item }}:
              {{ 'SKIPPED (not in folder tree)' if item is skipped
                 else ('SUCCESS — moved to ' + effective_target_folder)
                 if item.status | default(0) == 200
                 else ('FAILED (HTTP ' + (item.status | default('?') | string) + ')') }}
          loop: "{{ move_results.results | default([]) }}"

        - name: "MOVE-FOLDER — Mark step SUCCESS"
          ansible.builtin.set_fact:
            move_result_localhost: "SUCCESS"

      rescue:

        - name: "MOVE-FOLDER — Mark step FAILED"
          ansible.builtin.set_fact:
            move_result_localhost: "FAILED"

# --- Internal: propagate move result to firewall hosts for final report ---
- name: "STEP 8C (internal) — Propagate move result to firewall hosts"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step8c", "move_folder"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "8c"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "MOVE-FOLDER — Set move result on each firewall host"
      ansible.builtin.set_fact:
        result_move_folder: "{{ hostvars['localhost'].move_result_localhost | default('SKIPPED') }}"


# =============================================================================
# STEP 8D — RENAME DEVICE IN SCM (set display_name to inventory_hostname)
# Updates each migrated device's SCM display_name from its default value
# (the serial number, e.g. "007957000847916") to its inventory_hostname
# (e.g. "dicks-vmseries-lab22-firewall01"). The `name` field in SCM is the
# immutable identifier (serial) — only `display_name` is changed.
#
# API (confirmed via SCM GUI DevTools capture):
#   PUT /sase/config/v1/folders/{id}
#   body: {"name": "<serial>", "display_name": "<new_display_name>"}
#   200 OK on success
#
# Both `name` and `display_name` must be present in the PUT body; SCM uses
# `name` as the identifier and `display_name` as the human-readable label
# shown in the GUI device list.
#
# The step is non-fatal (ignore_errors on the actual PUT) so a per-device
# failure won't abort the migration — STEP 11 reports show FAILED if needed.
# =============================================================================
- name: "STEP 8D — RENAME DEVICE IN SCM"
  hosts: localhost
  gather_facts: false
  tags: ["step8d", "rename_device"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "8d"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "RENAME — Build serial → desired-hostname mapping from firewall inventory"
      ansible.builtin.set_fact:
        rename_mapping: >-
          {%- set result = {} -%}
          {%- for h in groups['firewalls'] -%}
            {%- set serial = hostvars[h].device_serial | default('') -%}
            {%- if serial and serial != 'UNKNOWN' -%}
              {%- set _ = result.update({serial: h}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    # v8 Fix #3 — only rename devices that actually claimed in STEP 7 (fall back
    # to the full mapping if STEP 7 was skipped on a resume).
    - name: "RENAME — Restrict mapping to successfully-claimed devices (#3)"
      ansible.builtin.set_fact:
        rename_mapping: >-
          {{ rename_mapping | dict2items
             | selectattr('key', 'in', hostvars['localhost'].claimed_serials)
             | items2dict }}
      when: hostvars['localhost'].claimed_serials is defined

    - name: "RENAME — Display planned rename mapping"
      ansible.builtin.debug:
        msg:
          - "=== Renaming devices in SCM ==="
          - "Base URL : {{ scm_sase_base_url }}"
          - "Mapping  (serial → inventory_hostname):"
          - "{{ rename_mapping }}"

    - name: "RENAME — Skip if no devices to rename"
      ansible.builtin.meta: end_play
      when: rename_mapping | length == 0

    - name: "RENAME — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - block:

        - name: "RENAME — Fetch SCM folder tree"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/folders"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: 200
            return_content: yes
          register: folders_response

        - name: "RENAME — Build serial → folder-entry lookup (id + current display_name)"
          ansible.builtin.set_fact:
            device_entries: >-
              {%- set result = {} -%}
              {%- set l0 = folders_response.json.data | default([]) -%}
              {%- set l1 = l0 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l2 = l1 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l3 = l2 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l4 = l3 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l5 = l4 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set l6 = l5 | map(attribute='children', default=[]) | flatten | list -%}
              {%- set all_nodes = l0 + l1 + l2 + l3 + l4 + l5 + l6 -%}
              {%- for node in all_nodes if node.serial_number is defined -%}
                {%- set _ = result.update({node.serial_number: {'id': node.id, 'name': node.name | default(''), 'display_name': node.display_name | default('')}}) -%}
              {%- endfor -%}
              {{ result }}

        - name: "RENAME — Display current device entries in SCM"
          ansible.builtin.debug:
            msg: "{{ device_entries }}"

        - name: "RENAME — Warn for devices not found in tree"
          ansible.builtin.debug:
            msg: "WARNING: Device {{ item.key }} (target display_name '{{ item.value }}') not found in SCM folder tree — skipping."
          when: item.key not in device_entries
          loop: "{{ rename_mapping | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "RENAME — Skip devices whose display_name already matches inventory_hostname"
          ansible.builtin.debug:
            msg: "Device {{ item.key }} already has display_name '{{ item.value }}' in SCM — nothing to do."
          when:
            - item.key in device_entries
            - device_entries[item.key].display_name == item.value
          loop: "{{ rename_mapping | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        # =============================================================
        # The actual rename call — confirmed via SCM GUI DevTools capture:
        #   PUT /sase/config/v1/folders/{id}
        #   body: {"name": "<serial>", "display_name": "<new_display_name>"}
        #
        # The `name` field is the immutable identifier (serial number) and
        # MUST be preserved in the PUT body. The rename happens in the
        # `display_name` field, which is what the SCM GUI shows.
        # =============================================================

        - name: "RENAME — Update display_name on device (PUT /sase/config/v1/folders/{id})"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/sase/config/v1/folders/{{ device_entries[item.key].id }}"
            method: PUT
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              name: "{{ item.key }}"
              display_name: "{{ item.value }}"
            status_code: [200, 201, 400, 404, 405, 409]
            return_content: yes
          when:
            - item.key in device_entries
            - device_entries[item.key].display_name != item.value
          loop: "{{ rename_mapping | dict2items }}"
          loop_control:
            label: "{{ item.key }} → {{ item.value }}"
          register: rename_results
          ignore_errors: yes

        - name: "RENAME — Display rename results per device (with full response on failure)"
          ansible.builtin.debug:
            msg: >-
              Device {{ item.item.key }} ({{ item.item.value }}):
              {% if item is skipped %}SKIPPED (no rename needed or device not found)
              {% elif item.status | default(0) in [200, 201] %}SUCCESS — display_name set to '{{ item.item.value }}'
              {% else %}FAILED — HTTP {{ item.status | default('?') }} —
              URL: {{ item.url | default('?') }} |
              Body sent: {{ {'name': item.item.key, 'display_name': item.item.value} }} |
              Response: {{ item.content | default(item.msg | default('no response body')) }}
              {% endif %}
          loop: "{{ rename_results.results | default([]) }}"
          loop_control:
            label: "{{ item.item.key }} → {{ item.item.value }}"

        - name: "RENAME — Determine overall step status"
          ansible.builtin.set_fact:
            rename_had_failures: >-
              {{ (rename_results.results | default([])
                  | rejectattr('skipped', 'defined')
                  | selectattr('status', 'defined')
                  | rejectattr('status', 'in', [200, 201])
                  | list | length) > 0 }}

        - name: "RENAME — Mark step SUCCESS or FAILED based on per-device results"
          ansible.builtin.set_fact:
            rename_result_localhost: "{{ 'FAILED' if rename_had_failures else 'SUCCESS' }}"

      rescue:

        - name: "RENAME — Mark step FAILED (rescue)"
          ansible.builtin.set_fact:
            rename_result_localhost: "FAILED"

# --- Internal: propagate rename result to firewall hosts for final report ---
- name: "STEP 8D (internal) — Propagate rename result to firewall hosts"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step8d", "rename_device"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "8d"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "RENAME — Set rename result on each firewall host"
      ansible.builtin.set_fact:
        result_rename_device: "{{ hostvars['localhost'].rename_result_localhost | default('SKIPPED') }}"


# =============================================================================
# STEP 8E — CHANGE FIREWALL HOSTNAME TO inventory_hostname
# Reuses the (previously disabled) STEP 6 hostname-change logic, but instead of
# prefixing "SCMMANAGED-" it sets the firewall's configured hostname to the
# Ansible inventory_hostname. Runs right after STEP 8D (SCM rename) so the
# on-box hostname matches the SCM display_name. On-box config change + commit
# only — no SCM API calls here. Idempotent: skips the change/commit when the
# hostname already matches.
# =============================================================================
- name: "STEP 8E — Change firewall hostname to inventory_hostname"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step8e", "hostname"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "8e"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "HOSTNAME — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "HOSTNAME — Get current hostname from device"
          paloaltonetworks.panos.panos_op:
            provider: "{{ provider }}"
            cmd: "show system info"
          register: hostname_info

        - name: "HOSTNAME — Compute current vs desired hostname"
          ansible.builtin.set_fact:
            device_hostname_current: "{{ (hostname_info.stdout | from_json).response.result.system.hostname }}"
            device_hostname_new: "{{ inventory_hostname }}"

        - name: "HOSTNAME — Display hostname change"
          ansible.builtin.debug:
            msg: >-
              {{ 'Hostname already set to ' ~ device_hostname_new ~ ' — nothing to do.'
                 if device_hostname_current == device_hostname_new
                 else 'Changing hostname: ' ~ device_hostname_current ~ ' -> ' ~ device_hostname_new }}

        - name: "HOSTNAME — Set new hostname via config element"
          paloaltonetworks.panos.panos_config_element:
            provider: "{{ provider }}"
            xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
            element: "<hostname>{{ device_hostname_new }}</hostname>"
          when: device_hostname_current != device_hostname_new

        - name: "HOSTNAME — Commit configuration (retry past any in-progress commit)"
          paloaltonetworks.panos.panos_commit_firewall:
            provider: "{{ provider }}"
            description: "Set hostname to {{ device_hostname_new }} via Ansible (SCM migration STEP 8E)"
          register: hostname_commit
          until: hostname_commit is succeeded
          retries: 10      # 10 × 30s — ride out any post-push / auto-commit window
          delay: 30
          when: device_hostname_current != device_hostname_new

        - name: "HOSTNAME — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_hostname_change: "SUCCESS"

      rescue:

        - name: "HOSTNAME — Mark step FAILED"
          ansible.builtin.set_fact:
            result_hostname_change: "FAILED"


# =============================================================================
# STEP 8B — PUSH CONFIG
# Pushes SCM-managed config to each migrated device. Polls until completion,
# fetches per-sub-job detail, handles PUSHFAIL (device not reachable yet) as
# a warning rather than a hard failure. Logic mirrors push_config_v2.yml.
# =============================================================================
- name: "STEP 8B — PUSH CONFIG"
  hosts: localhost
  gather_facts: false
  tags: ["step8b", "push_config"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "8b"
    push_description: "Ansible automated config push (SCM migration)"
    wait_for_job: true
    poll_retries: 40
    poll_delay: 15

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "PUSH-CFG — Collect serial numbers from migration hosts"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ groups['firewalls']
             | map('extract', hostvars)
             | selectattr('device_serial', 'defined')
             | map(attribute='device_serial')
             | reject('equalto', 'UNKNOWN')
             | list }}

    # v8 Fix #3 — only push config to devices that actually claimed in STEP 7
    # (fall back to the full set if STEP 7 was skipped on a resume). Prevents a
    # single un-claimed/not-ready device from failing the whole push job with a
    # 'FAIL' status, which is what happened in the v7 Aug-23 run.
    - name: "PUSH-CFG — Restrict to successfully-claimed devices (#3)"
      ansible.builtin.set_fact:
        migration_serials: >-
          {{ migration_serials | intersect(hostvars['localhost'].claimed_serials)
             if (hostvars['localhost'].claimed_serials is defined)
             else migration_serials }}

    - name: "PUSH-CFG — Display push operation summary"
      ansible.builtin.debug:
        msg:
          - "=== SCM Config Push to migrated devices ==="
          - "Base URL    : {{ scm_sase_base_url }}"
          - "Devices     : {{ migration_serials }}"
          - "Description : {{ push_description }}"
          - "Wait for job: {{ wait_for_job }}"

    - name: "PUSH-CFG — Skip if no devices to push to"
      ansible.builtin.meta: end_play
      when: migration_serials | length == 0

    # v7 Fix #2 — this push now runs AFTER STEP 8C (move to target folder) and
    # STEP 8D (rename). Pause briefly so SCM finishes applying the new folder
    # placement before we push, so the push is scoped to the target folder and
    # includes its rules (previously the push ran before the move, so only the
    # parent/Global folder rules landed and a second manual push was needed).
    - name: "PUSH-CFG — Settle pause for SCM folder placement to propagate"
      ansible.builtin.pause:
        seconds: 60

    - name: "PUSH-CFG — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - block:

        - name: "PUSH-CFG — Check config conflicts"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/api/sase/config/v1/config-conflicts"
            method: POST
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              devices: "{{ migration_serials }}"
            status_code: 200
            return_content: yes
          register: conflicts_response

        - name: "PUSH-CFG — Display conflict check result"
          ansible.builtin.debug:
            msg: "{{ conflicts_response.content }}"

        - name: "PUSH-CFG — Trigger config push"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/api/sase/config/v1.0/push"
            method: POST
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              containers: "{{ migration_serials }}"
              description: "{{ push_description }}"
              override-block: "yes"
            status_code: 200
            return_content: yes
          register: push_response

        - name: "PUSH-CFG — Parse push response"
          ansible.builtin.set_fact:
            push_data: "{{ push_response.content | from_json }}"

        - name: "PUSH-CFG — Display push trigger result"
          ansible.builtin.debug:
            msg:
              - "Message : {{ push_data.message }}"
              - "Job ID  : {{ push_data.job_id }}"
              - "Success : {{ push_data.success }}"

        - name: "PUSH-CFG — Fail if push was not accepted by SCM"
          ansible.builtin.fail:
            msg: "Push was not accepted by SCM: {{ push_data }}"
          when: not (push_data.success | bool)

        - name: "PUSH-CFG — Wait for push job to complete"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/api/sase/config/v1/device-config/job-groups?parentJobId={{ push_data.job_id }}"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: 200
            return_content: yes
          register: job_status_response
          retries: "{{ poll_retries }}"
          delay: "{{ poll_delay }}"
          until: >-
            (job_status_response.content | from_json).data.job_groups[0].jobs_status not in ['PENDING', 'ACT']
          when: wait_for_job | bool

        - name: "PUSH-CFG — Parse completed job group data"
          ansible.builtin.set_fact:
            job_group: "{{ (job_status_response.content | from_json).data.job_groups[0] }}"
          when: wait_for_job | bool

        - name: "PUSH-CFG — Display job group summary"
          ansible.builtin.debug:
            msg:
              - "Job ID      : {{ job_group.parent_job_id }}"
              - "Type        : {{ job_group.type_str }}"
              - "Status      : {{ job_group.jobs_status }}"
              - "Started     : {{ job_group.start_ts }}"
              - "Ended       : {{ job_group.end_ts }}"
              - "Description : {{ job_group.parent_description }}"
          when: wait_for_job | bool

        - name: "PUSH-CFG — Fetch detailed result for each sub-job"
          ansible.builtin.uri:
            url: "{{ scm_sase_base_url }}/api/jobs/v1/{{ item.id }}"
            method: GET
            headers:
              x-auth-jwt: "{{ scm_access_token }}"
              Accept: "application/json"
            status_code: 200
            return_content: yes
          loop: "{{ job_group.jobs }}"
          loop_control:
            label: "job {{ item.id }}"
          register: job_details_responses
          when: wait_for_job | bool

        - name: "PUSH-CFG — Display detailed result per sub-job"
          ansible.builtin.debug:
            msg: >-
              {%- set job  = (item.content | from_json).data[0] -%}
              {%- set det  = job.details | default('{}', true) | from_json -%}
              {%- set summ = job.summary | default('{}', true) | from_json -%}
              Job {{ job.id }} ({{ job.type_str }}) on {{ job.dev_serial | default('N/A') }}:
              Result={{ job.result_str }} | Status={{ job.status_str }} |
              Start={{ job.start_ts }} | End={{ job.end_ts }} |
              Info={{ det.info | default([]) | join('; ') }} |
              Summary={{ summ.info | default([]) | join('; ') }} |
              Warnings ({{ det.warnings | default([]) | length }}): {{ det.warnings | default([]) | join(' | ') }}
          loop: "{{ job_details_responses.results }}"
          loop_control:
            label: "job {{ item.item.id }}"
          when: wait_for_job | bool

        - name: "PUSH-CFG — Collect any PUSHFAIL sub-jobs"
          ansible.builtin.set_fact:
            pushfail_jobs: >-
              {{ job_details_responses.results
                 | map(attribute='content')
                 | map('from_json')
                 | map(attribute='data')
                 | flatten
                 | selectattr('status_str', 'equalto', 'PUSHFAIL')
                 | list }}
          when: wait_for_job | bool

        - name: "PUSH-CFG — Warn if device was not reachable (PUSHFAIL)"
          ansible.builtin.debug:
            msg:
              - "Push did not reach the following device(s) — status PUSHFAIL:"
              - "  {{ pushfail_jobs | map(attribute='dev_serial') | list | join(', ') }}"
              - "  Device(s) likely not connected to SCM yet."
          when:
            - wait_for_job | bool
            - pushfail_jobs | default([]) | length > 0

        - name: "PUSH-CFG — Fail if push job completed with an unexpected error"
          ansible.builtin.fail:
            msg: "Config push job {{ push_data.job_id }} completed with status '{{ job_group.jobs_status }}'. Check SCM UI."
          when:
            - wait_for_job | bool
            - job_group.jobs_status not in ['OK', 'FIN']

        - name: "PUSH-CFG — Mark push SUCCESS"
          ansible.builtin.set_fact:
            push_result_localhost: "SUCCESS"

      rescue:

        - name: "PUSH-CFG — Mark push FAILED"
          ansible.builtin.set_fact:
            push_result_localhost: "FAILED"

# --- Internal: propagate push result to firewall hosts for final report ---
- name: "STEP 8B (internal) — Propagate push result to firewall hosts"
  hosts: firewalls
  connection: local
  gather_facts: false
  tags: ["step8b", "push_config"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "8b"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "PUSH-CFG — Set push result on each firewall host"
      ansible.builtin.set_fact:
        result_push_config: "{{ hostvars['localhost'].push_result_localhost | default('SKIPPED') }}"


# =============================================================================
# STEP 9 — Post-migration snapshot + report (first attempt)
# =============================================================================
- name: "STEP 9 — Post-migration snapshot (attempt 1)"
  hosts: firewalls
  connection: local
  gather_facts: false
  ignore_unreachable: true
  tags: ["step9", "post_snapshot"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "9"
    snapshot_directory: "./snapshots"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "POST-SNAP — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "POST-SNAP — Take post-migration snapshot"
          ansible.builtin.include_role:
            name: take_snapshot
          vars:
            snapshot_filename: "post_snapshot_{{ connection_id }}"

        - name: "POST-SNAP — Compare pre and post snapshots"
          ansible.builtin.include_role:
            name: snapshot_report_from_files
          vars:
            left_snapshot: "pre_snapshot_{{ connection_id }}"
            right_snapshot: "post_snapshot_{{ connection_id }}"
            report_output_file: "{{ connection_id }}_comparison_report.json"

        - name: "POST-SNAP — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_post_snapshot: "SUCCESS"
            needs_post_retry: false

      rescue:

        - name: "POST-SNAP — Mark as needing retry"
          ansible.builtin.set_fact:
            result_post_snapshot: "PENDING_RETRY"
            needs_post_retry: true


# =============================================================================
# STEP 10 — Post-migration snapshot retry (3 min wait for unreachable hosts)
# =============================================================================
- name: "STEP 10 — Post-migration snapshot retry (if needed)"
  hosts: firewalls
  connection: local
  gather_facts: false
  ignore_unreachable: true
  tags: ["step10", "post_snapshot_retry"]
  vars_files:
    - vars/step_control.yml

  vars:
    this_step: "10"
    snapshot_directory: "./snapshots"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "RETRY — Skip host if no retry needed"
      ansible.builtin.meta: end_host
      when: not (hostvars[inventory_hostname].needs_post_retry | default(false))

    - name: "RETRY — Wait 3 minutes before retrying"
      ansible.builtin.pause:
        minutes: 3
        prompt: "Host {{ inventory_hostname }} needs retry. Waiting 3 minutes..."

    - name: "RETRY — Set device provider"
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

    - block:

        - name: "RETRY — Take post-migration snapshot"
          ansible.builtin.include_role:
            name: take_snapshot
          vars:
            snapshot_filename: "post_snapshot_{{ connection_id }}"

        - name: "RETRY — Compare pre and post snapshots"
          ansible.builtin.include_role:
            name: snapshot_report_from_files
          vars:
            left_snapshot: "pre_snapshot_{{ connection_id }}"
            right_snapshot: "post_snapshot_{{ connection_id }}"
            report_output_file: "{{ connection_id }}_comparison_report.json"

        - name: "RETRY — Mark step SUCCESS"
          ansible.builtin.set_fact:
            result_post_snapshot: "SUCCESS"
            needs_post_retry: false

      rescue:

        - name: "RETRY — Mark step FAILED (retry also failed)"
          ansible.builtin.set_fact:
            result_post_snapshot: "FAILED"
            needs_post_retry: false


# =============================================================================
# STEP 11 — List SCM devices AFTER migration + generate CSV and HTML reports
# =============================================================================
- name: "STEP 11 — List SCM devices after migration and generate reports"
  hosts: localhost
  gather_facts: false
  tags: ["step11", "reports"]
  vars_files:
    - vars/step_control.yml
    - ../group_vars/all/scm_credentials.yml

  vars:
    this_step: "11"
    report_dir: "./overall_reports"

  tasks:

    - name: "GATE — Skip step if before start_at"
      ansible.builtin.meta: end_play
      when: (step_order[this_step] | int) < (step_order[start_at | string | lower] | int)

    - name: "AFTER — Set report timestamp"
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: "AFTER — Authenticate with SCM"
      ansible.builtin.include_role:
        name: scm_auth

    - name: "AFTER — Query registered devices"
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/ngfw/api/v1/devices"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Content-Type: "application/json"
        status_code: [200, 201]
        return_content: true
      register: scm_after_response
      ignore_errors: true

    - name: "AFTER — Save post-migration device list"
      ansible.builtin.set_fact:
        scm_devices_after: "{{ scm_after_response.json | default([]) }}"

    - name: "AFTER — Display SCM devices after migration"
      ansible.builtin.debug:
        msg: "Serial: {{ item.id }} | Hostname: {{ item.hostname | default('N/A') }} | Connected: {{ item.is_connected | default('N/A') }} | SW: {{ item.software_version | default('N/A') }}"
      loop: "{{ scm_devices_after }}"
      when: scm_devices_after | length > 0

    # -------------------------------------------------------------------------
    # Build migration results list from hostvars
    # -------------------------------------------------------------------------
    - name: "REPORT — Collect migration results from all firewall hosts"
      ansible.builtin.set_fact:
        migration_results: >-
          {{ migration_results | default([]) + [{
            'host':               item,
            'ip':                 hostvars[item].panorama_host       | default('N/A'),
            'serial':             hostvars[item].device_serial        | default('UNKNOWN'),
            'hostname_original':  hostvars[item].device_hostname_original | default('UNKNOWN'),
            'hostname_new':       hostvars[item].device_hostname_new  | default('UNKNOWN'),
            'backup':             hostvars[item].result_backup         | default('NOT RUN'),
            'pre_snapshot':       hostvars[item].result_pre_snapshot   | default('NOT RUN'),
            'remove_panorama':    hostvars[item].result_remove_panorama    | default('NOT RUN'),
            'advanced_routing':   hostvars[item].result_advanced_routing | default('NOT RUN'),
            'cloud_service':      hostvars[item].result_cloud_service    | default('NOT RUN'),
            'hostname_change':    hostvars[item].result_hostname_change | default('NOT RUN'),
            'device_state':       hostvars[item].result_device_state    | default('NOT RUN'),
            'claim':              hostvars[item].result_claim          | default('NOT RUN'),
            'push_config':        hostvars[item].result_push_config    | default('NOT RUN'),
            'move_folder':        hostvars[item].result_move_folder    | default('NOT RUN'),
            'rename_device':      hostvars[item].result_rename_device  | default('NOT RUN'),
            'post_snapshot':      hostvars[item].result_post_snapshot  | default('NOT RUN')
          }] }}
      loop: "{{ groups['firewalls'] }}"

    # -------------------------------------------------------------------------
    # Create output directory
    # -------------------------------------------------------------------------
    - name: "REPORT — Create overall_reports directory"
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # CSV report
    # -------------------------------------------------------------------------
    - name: "REPORT — Generate CSV report"
      ansible.builtin.copy:
        dest: "{{ report_dir }}/migration_report_{{ report_timestamp }}.csv"
        mode: '0644'
        content: |
          Device,IP Address,Serial,Original Hostname,New Hostname,Backup,Pre-Snapshot,Remove Panorama,Advanced Routing,Cloud Service,Hostname Change,Device State,Claim to SCM,Push Config,Move Folder,Rename Device,Post-Snapshot
          {% for r in migration_results %}
          {{ r.host }},{{ r.ip }},{{ r.serial }},{{ r.hostname_original }},{{ r.hostname_new }},{{ r.backup }},{{ r.pre_snapshot }},{{ r.remove_panorama }},{{ r.advanced_routing }},{{ r.cloud_service }},{{ r.hostname_change }},{{ r.device_state }},{{ r.claim }},{{ r.push_config }},{{ r.move_folder }},{{ r.rename_device }},{{ r.post_snapshot }}
          {% endfor %}

    # -------------------------------------------------------------------------
    # HTML report
    # -------------------------------------------------------------------------
    - name: "REPORT — Generate HTML report"
      ansible.builtin.copy:
        dest: "{{ report_dir }}/migration_report_{{ report_timestamp }}.html"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SCM Migration Report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; color: #333; }
              h1 { color: #2c3e50; border-bottom: 3px solid #2c3e50; padding-bottom: 8px; }
              h2 { color: #34495e; margin-top: 40px; }
              p.meta { color: #666; font-size: 13px; }
              table { border-collapse: collapse; width: 100%; background: #fff;
                      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
              th { background: #2c3e50; color: #fff; padding: 10px 14px;
                   text-align: left; font-size: 13px; white-space: nowrap; }
              td { padding: 9px 14px; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
              tr:last-child td { border-bottom: none; }
              tr:hover td { background: #f0f4f8; }
              .badge { display: inline-block; border-radius: 4px; padding: 3px 9px;
                       font-size: 12px; font-weight: bold; white-space: nowrap; }
              .SUCCESS       { background: #d4edda; color: #155724; }
              .FAILED        { background: #f8d7da; color: #721c24; }
              .PENDING_RETRY { background: #fff3cd; color: #856404; }
              .PENDING       { background: #fff3cd; color: #856404; }
              .NOT_RUN       { background: #e2e3e5; color: #383d41; }
              .SKIPPED       { background: #e2e3e5; color: #383d41; }
              .UNKNOWN       { background: #e2e3e5; color: #383d41; }
            </style>
          </head>
          <body>

            <h1>SCM Migration Report</h1>
            <p class="meta">Generated: {{ report_timestamp }} &nbsp;|&nbsp; Devices processed: {{ migration_results | length }}</p>

            <h2>Migration Steps Summary</h2>
            <table>
              <thead>
                <tr>
                  <th>Device</th>
                  <th>IP Address</th>
                  <th>Serial</th>
                  <th>Original Hostname</th>
                  <th>New Hostname</th>
                  <th>Backup</th>
                  <th>Pre-Snapshot</th>
                  <th>Remove Panorama</th>
                  <th>Advanced Routing</th>
                  <th>Cloud Service</th>
                  <th>Hostname Change</th>
                  <th>Device State</th>
                  <th>Claim to SCM</th>
                  <th>Push Config</th>
                  <th>Move Folder</th>
                  <th>Rename Device</th>
                  <th>Post-Snapshot</th>
                </tr>
              </thead>
              <tbody>
                {% for r in migration_results %}
                <tr>
                  <td><strong>{{ r.host }}</strong></td>
                  <td>{{ r.ip }}</td>
                  <td>{{ r.serial }}</td>
                  <td>{{ r.hostname_original }}</td>
                  <td>{{ r.hostname_new }}</td>
                  <td><span class="badge {{ r.backup | replace(' ', '_') | replace('-', '_') }}">{{ r.backup }}</span></td>
                  <td><span class="badge {{ r.pre_snapshot | replace(' ', '_') | replace('-', '_') }}">{{ r.pre_snapshot }}</span></td>
                  <td><span class="badge {{ r.remove_panorama | replace(' ', '_') | replace('-', '_') }}">{{ r.remove_panorama }}</span></td>
                  <td><span class="badge {{ r.advanced_routing | replace(' ', '_') | replace('-', '_') }}">{{ r.advanced_routing }}</span></td>
                  <td><span class="badge {{ r.cloud_service | replace(' ', '_') | replace('-', '_') }}">{{ r.cloud_service }}</span></td>
                  <td><span class="badge {{ r.hostname_change | replace(' ', '_') | replace('-', '_') }}">{{ r.hostname_change }}</span></td>
                  <td><span class="badge {{ r.device_state | replace(' ', '_') | replace('-', '_') }}">{{ r.device_state }}</span></td>
                  <td><span class="badge {{ r.claim | replace(' ', '_') | replace('-', '_') }}">{{ r.claim }}</span></td>
                  <td><span class="badge {{ r.push_config | replace(' ', '_') | replace('-', '_') }}">{{ r.push_config }}</span></td>
                  <td><span class="badge {{ r.move_folder | replace(' ', '_') | replace('-', '_') }}">{{ r.move_folder }}</span></td>
                  <td><span class="badge {{ r.rename_device | replace(' ', '_') | replace('-', '_') }}">{{ r.rename_device }}</span></td>
                  <td><span class="badge {{ r.post_snapshot | replace(' ', '_') | replace('-', '_') }}">{{ r.post_snapshot }}</span></td>
                </tr>
                {% endfor %}
              </tbody>
            </table>

            <h2>SCM Devices — Before Migration</h2>
            {% if scm_devices_before | default([]) | length > 0 %}
            <table>
              <thead>
                <tr><th>Serial</th><th>Hostname</th><th>Model</th><th>Connected</th><th>Software Version</th></tr>
              </thead>
              <tbody>
                {% for d in scm_devices_before | default([]) %}
                <tr>
                  <td>{{ d.id | default('N/A') }}</td>
                  <td>{{ d.hostname | default('N/A') }}</td>
                  <td>{{ d.model | default('N/A') }}</td>
                  <td>{{ d.is_connected | default('N/A') }}</td>
                  <td>{{ d.software_version | default('N/A') }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
            {% else %}
            <p><em>No devices were registered in SCM before migration.</em></p>
            {% endif %}

            <h2>SCM Devices — After Migration</h2>
            {% if scm_devices_after | default([]) | length > 0 %}
            <table>
              <thead>
                <tr><th>Serial</th><th>Hostname</th><th>Model</th><th>Connected</th><th>Software Version</th></tr>
              </thead>
              <tbody>
                {% for d in scm_devices_after | default([]) %}
                <tr>
                  <td>{{ d.id | default('N/A') }}</td>
                  <td>{{ d.hostname | default('N/A') }}</td>
                  <td>{{ d.model | default('N/A') }}</td>
                  <td>{{ d.is_connected | default('N/A') }}</td>
                  <td>{{ d.software_version | default('N/A') }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
            {% else %}
            <p><em>No devices found in SCM after migration.</em></p>
            {% endif %}

          </body>
          </html>

    # -------------------------------------------------------------------------
    # Final summary
    # -------------------------------------------------------------------------
    - name: "REPORT — Display report file locations"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "  SCM Migration Complete"
          - "=========================================="
          - "  CSV  : {{ report_dir }}/migration_report_{{ report_timestamp }}.csv"
          - "  HTML : {{ report_dir }}/migration_report_{{ report_timestamp }}.html"
          - "=========================================="
