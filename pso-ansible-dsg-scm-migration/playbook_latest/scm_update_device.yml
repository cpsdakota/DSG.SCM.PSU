---
# Associate a configuration snippet to a specific NGFW device in SCM.
#
# Uses the SCM internal API (same base URL as move_device_folder.yml).
# The snippet UUID is resolved from the snippet name automatically.
#
# Endpoint: PUT /sase/config/v1/snippets/{snippet_uuid}?device={serial}
# Auth: x-auth-jwt
#
# The snippet name is derived automatically from the device serial as "cp-{serial}".
#
# Usage:
#   ansible-playbook playbooks/scm_update_device.yml \
#     --vault-password-file .vault_pass \
#     -e 'device_serial="007957000847916"'
#
# Variables:
#   device_serial  (required) - device serial number (e.g. "007957000847916")

- name: Associate snippet to NGFW device via SCM internal API
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/scm_credentials.yml

  vars:
    scm_sase_base_url: "https://paas-12.prod.panorama.paloaltonetworks.com"
    device_serial: ""

  tasks:

    # ==========================================
    # Pre-flight Validation
    # ==========================================

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - device_serial | length > 0
        fail_msg: "'device_serial' is required. Example: -e 'device_serial=\"007957000847916\"'"

    - name: Derive snippet name from device serial
      ansible.builtin.set_fact:
        snippet_name: "snp-{{ device_serial }}"

    - name: Display operation summary
      ansible.builtin.debug:
        msg:
          - "=== SCM Snippet → Device Association ==="
          - "Device Serial : {{ device_serial }}"
          - "Snippet Name  : {{ snippet_name }}"

    # ==========================================
    # Authenticate with SCM
    # ==========================================

    - name: Authenticate with SCM
      ansible.builtin.include_role:
        name: scm_auth

    # ==========================================
    # Resolve snippet name to UUID
    # ==========================================

    - name: Fetch snippets list from SCM
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/sase/config/v1/snippets"
        method: GET
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
          Accept: "application/json"
        status_code: 200
        return_content: yes
      register: snippets_response

    - name: Find snippet UUID by name
      ansible.builtin.set_fact:
        snippet_uuid: "{{ snippets_response.json.data
          | selectattr('name', 'defined')
          | selectattr('name', 'equalto', snippet_name)
          | map(attribute='id')
          | first
          | default('') }}"

    - name: Fail if snippet not found
      ansible.builtin.fail:
        msg: "Snippet '{{ snippet_name }}' was not found. Verify the name and that it exists in SCM."
      when: snippet_uuid | length == 0

    - name: Display resolved snippet UUID
      ansible.builtin.debug:
        msg:
          - "Snippet '{{ snippet_name }}' resolved to UUID: {{ snippet_uuid }}"

    # ==========================================
    # Associate snippet to device
    # ==========================================

    - name: Associate snippet to device
      ansible.builtin.uri:
        url: "{{ scm_sase_base_url }}/sase/config/v1/snippets/{{ snippet_uuid }}?device={{ device_serial }}"
        method: PUT
        headers:
          x-auth-jwt: "{{ scm_access_token }}"
        body: ""
        status_code: 200
        return_content: yes
      register: associate_response

    # ==========================================
    # Display Results
    # ==========================================

    - name: Display result
      ansible.builtin.debug:
        msg:
          - "=== Snippet Associated Successfully ==="
          - "Snippet  : {{ snippet_name }} ({{ snippet_uuid }})"
          - "Device   : {{ device_serial }}"
