---
- hosts: 'firewalls'
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    # Optional: filter specific firewalls via variable
    # firewall_list: ["dicks-vmseries-lab2-firewall03"]

    # DNS Settings — override at runtime with -e
    dns_primary: "10.220.150.50"
    dns_secondary: "10.211.36.50"

    # NTP Settings — override at runtime with -e
    ntp_primary: "10.220.60.71"
    ntp_secondary: "10.211.12.71"

  tasks:

  - name: 'Check if running for specific firewalls only'
    ansible.builtin.set_fact:
      run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

  - name: 'Skip host if not in firewall_list'
    ansible.builtin.meta: end_host
    when: not (run_for_this_host | bool)

  - name: 'Set target firewall provider information'
    ansible.builtin.set_fact:
      target_device:
        name: '{{ inventory_hostname }}'
        provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
    no_log: true

  - name: 'Display configuration target information'
    ansible.builtin.debug:
      msg:
        - "=== Configuring DNS and NTP Local Settings ==="
        - "Firewall: {{ inventory_hostname }}"
        - "IP Address: {{ panorama_host }}"
        - "DNS Primary:   {{ dns_primary }}"
        - "DNS Secondary: {{ dns_secondary }}"
        - "NTP Primary:   {{ ntp_primary }}"
        - "NTP Secondary: {{ ntp_secondary }}"

  # ==========================================
  # Configure DNS
  # ==========================================

  - name: 'Configure primary DNS server'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/dns-setting/servers"
      element: "<primary>{{ dns_primary }}</primary>"
    register: dns_primary_result

  - name: 'Configure secondary DNS server'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/dns-setting/servers"
      element: "<secondary>{{ dns_secondary }}</secondary>"
    register: dns_secondary_result

  - name: 'Display DNS configuration result'
    ansible.builtin.debug:
      msg:
        - "DNS configured on {{ inventory_hostname }}"
        - "Primary:   {{ dns_primary }}"
        - "Secondary: {{ dns_secondary }}"

  # ==========================================
  # Configure NTP
  # ==========================================

  - name: 'Configure primary NTP server'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/ntp-servers/primary-ntp-server"
      element: "<ntp-server-address>{{ ntp_primary }}</ntp-server-address>"
    register: ntp_primary_result

  - name: 'Configure secondary NTP server'
    paloaltonetworks.panos.panos_config_element:
      provider: '{{ target_device.provider }}'
      xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/ntp-servers/secondary-ntp-server"
      element: "<ntp-server-address>{{ ntp_secondary }}</ntp-server-address>"
    register: ntp_secondary_result

  - name: 'Display NTP configuration result'
    ansible.builtin.debug:
      msg:
        - "NTP configured on {{ inventory_hostname }}"
        - "Primary:   {{ ntp_primary }}"
        - "Secondary: {{ ntp_secondary }}"

  # ==========================================
  # Commit Configuration Changes
  # ==========================================

  - name: 'Commit configuration changes to firewall'
    paloaltonetworks.panos.panos_commit_firewall:
      provider: '{{ target_device.provider }}'
      description: "Configure DNS and NTP local settings via Ansible"
    register: commit_result

  - name: 'Display commit status'
    ansible.builtin.debug:
      msg: "Configuration committed successfully to {{ inventory_hostname }}"
    when: commit_result is succeeded

  # ==========================================
  # Final Summary
  # ==========================================

  - name: 'Display completion summary'
    ansible.builtin.debug:
      msg:
        - "=== Configuration Complete for {{ inventory_hostname }} ==="
        - "DNS Primary:   {{ dns_primary }}"
        - "DNS Secondary: {{ dns_secondary }}"
        - "NTP Primary:   {{ ntp_primary }}"
        - "NTP Secondary: {{ ntp_secondary }}"
        - "Status: Successfully configured and committed"
