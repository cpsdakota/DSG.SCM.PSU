---
# =============================================================================
# Save Device State on NGFW and Download .tgz Locally
#
# Flow:
#   1. Execute 'save device state' on the firewall — this generates
#      /opt/pancfg/mgmt/device-state/device_state_cfg.tgz on the device.
#   2. Export (download) that .tgz from the firewall into the local
#      'device_state/' directory using panos_export (category: device-state).
#
# The local 'device_state/' directory is expected to already exist; the
# playbook still ensures it (idempotent — state: directory).
#
# Usage:
#   All firewalls:
#     ansible-playbook playbook_latest/save_device_state.yml \
#       --vault-password-file .vault_pass
#
#   Single firewall:
#     ansible-playbook playbook_latest/save_device_state.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01
#
#   Specific list via variable:
#     ansible-playbook playbook_latest/save_device_state.yml \
#       --vault-password-file .vault_pass \
#       -e 'firewall_list=["dicks-vmseries-lab22-firewall01"]'
#
# Variables (all optional):
#   device_state_dir — local directory for the .tgz (default: device_state)
#   firewall_list    — optional list to target specific hosts
# =============================================================================

- hosts: firewalls
  strategy: linear
  connection: local
  gather_facts: true

  vars:
    device_state_dir: "/apps/scm-migration/palo/pso-ansible-dsg-scm-migration/device_state"

  tasks:

    - name: 'Check if running for specific firewalls only'
      ansible.builtin.set_fact:
        run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

    - name: 'Skip host if not in firewall_list'
      ansible.builtin.meta: end_host
      when: not (run_for_this_host | bool)

    - name: 'Set target firewall provider information'
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
      no_log: true

    - name: 'Display operation target'
      ansible.builtin.debug:
        msg:
          - "=== Save Device State and Download .tgz ==="
          - "Firewall          : {{ inventory_hostname }}"
          - "IP Address        : {{ panorama_host }}"
          - "Local destination : {{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"

    # ==========================================
    # Ensure local destination directory exists
    # (idempotent — directory should already
    # exist per project convention).
    # ==========================================

    - name: 'Ensure local device_state directory exists'
      ansible.builtin.file:
        path: "{{ device_state_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    # ==========================================
    # Generate device state on the firewall
    # ==========================================

    - name: 'Run "save device state" on firewall'
      paloaltonetworks.panos.panos_op:
        provider: '{{ provider }}'
        cmd: 'save device-state'
        cmd_is_xml: false
      register: result_save_state

    - name: 'Display save device state result'
      ansible.builtin.debug:
        msg:
          - "Save device state : {{ 'SUCCESS' if result_save_state is succeeded else 'FAILED' }}"
          - "Output            : {{ result_save_state.stdout_xml | default(result_save_state.msg | default('N/A')) }}"

    # ==========================================
    # Download device state .tgz from firewall
    # to the local 'device_state/' directory.
    # ==========================================

    - name: 'Export device state .tgz from firewall to local device_state directory'
      paloaltonetworks.panos.panos_export:
        provider: '{{ provider }}'
        category: 'device-state'
        filename: "{{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"
        create_directory: true
      register: result_export_state
      delegate_to: localhost

    - name: 'Display export result'
      ansible.builtin.debug:
        msg:
          - "Export device state : {{ 'SUCCESS' if result_export_state is succeeded else 'FAILED' }}"
          - "Saved to            : {{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"

    # ==========================================
    # Final Summary
    # ==========================================

    - name: 'Display completion summary'
      ansible.builtin.debug:
        msg:
          - "=== Device State Save Complete for {{ inventory_hostname }} ==="
          - "save device state : {{ 'SUCCESS' if result_save_state is succeeded else 'FAILED' }}"
          - "Download          : {{ 'SUCCESS' if result_export_state is succeeded else 'FAILED' }}"
          - "Local file        : {{ device_state_dir }}/device-state-{{ inventory_hostname }}.tgz"
