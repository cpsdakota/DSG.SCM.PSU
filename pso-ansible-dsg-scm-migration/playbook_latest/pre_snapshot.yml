---
# Take a PRE-change snapshot of PAN-OS device state.
# Run this playbook BEFORE making any changes to the device.
#
# Usage:
#   ansible-playbook playbooks/pre_snapshot.yml \
#     --vault-password-file .vault_pass
#
# Snapshots are saved to ./snapshots/pre_snapshot_<inventory_hostname>.json

- hosts: firewalls
  connection: local
  gather_facts: false
  name: PRE - Take pre-change snapshot

  vars:
    snapshot_directory: "./snapshots"

  pre_tasks:

    ################################
    # Setup provider for roles     #
    ################################

    - name: Set device provider
      ansible.builtin.set_fact:
        provider:
          ip_address: "{{ panorama_host }}"
          username: "{{ username }}"
          password: "{{ password }}"
        connection_id: "{{ inventory_hostname }}"
      no_log: true

  roles:

    ##################
    # TAKE SNAPSHOT  #
    ##################

    - role: take_snapshot
      name: SNAPSHOTS - Take the pre-change snapshot
      vars:
        snapshot_filename: "pre_snapshot_{{ connection_id }}"
