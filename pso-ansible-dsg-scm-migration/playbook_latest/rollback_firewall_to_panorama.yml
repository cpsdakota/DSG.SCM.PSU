---
# =============================================================================
# Rollback Firewall from SCM back to Panorama Management — master orchestrator.
#
# Runs the four rollback playbooks in dependency order. Reverses the SCM
# migration performed by scm_migration_final_v2.yml.
#
# Stages (NEW ORDER as of v2):
#
#   1. Import pre-migration XML config to firewall  (import_config_firewall.yml)
#        - Restores the full pre-migration configuration from
#          firewalls_backups/running-config-<host>.xml (produced by STEP 2
#          of scm_migration_final_v2.yml) directly to the firewall.
#        - Workflow: panos_import (upload XML) → panos_op (load config
#          from <file>) → panos_commit_firewall → reboot → wait for online.
#        - This single step undoes virtually all migration config changes:
#            * Advanced Routing reverts to disabled (legacy Virtual Routers
#              come back, along with their interface assignments)
#            * <cloud-service/> element is removed
#            * <panorama-server> is restored to the on-prem Panorama IP
#            * All interfaces, zones, policies as they were before migration
#
#        NOTE on the device-state .tgz alternative: there is also a sibling
#        playbook import_device_state_firewall.yml that takes the .tgz
#        produced by STEP 6B / save_device_state.yml. It does NOT work for
#        same-device rollback — panos_import for category=device-state just
#        uploads the file; the .tgz is only consumed by Panorama's RMA
#        replacement workflow, not by a standalone restore. Use this
#        XML-based playbook instead.
#
#   2. Disable Advanced Routing Engine          (disable_advanced_routing.yml)
#        - After the state restore, Advanced Routing is typically already
#          disabled — this stage detects that and ends_host early ("already
#          disabled, no action needed"). It only triggers a fresh
#          disable+reboot if the restore didn't include the routing flip.
#
#   3. Re-enable on-prem Panorama management    (reenable_panorama_management.yml)
#        - State restore already removed <cloud-service/> and set
#          <panorama-server>. This stage re-applies them idempotently and,
#          critically, runs the CLI-only operational commands that the
#          device-state file does NOT capture:
#              set system setting template enable
#              set system setting shared-policy enable
#          These re-enable template + policy/objects push from Panorama.
#
#   4. Unclaim device(s) from SCM               (unclaim_devices_from_scm.yml)
#        - Disables Configuration Scope (Cloud-Managed → Monitoring-only),
#          then releases the device registration (Monitoring → Available)
#          via the SCM /device-registrations/release endpoint. Marked
#          OPTIONAL — Stage 4 is not required for the firewall to function
#          under Panorama again; it just cleans up the SCM-side record.
#
# Why this order:
#   The previous order (disable_routing → reenable_panorama → unclaim →
#   import_state) failed at Stage 1 with "DHCP Interface ae1.XXXX has no
#   virtual-router configured" because the SCM-shaped current config has
#   Logical Routers (Advanced Routing) instead of legacy Virtual Routers.
#   Disabling Advanced Routing leaves orphaned interfaces → commit invalid.
#   Restoring the pre-migration state FIRST brings back the legacy VR
#   definitions, so the subsequent stages either no-op (state already
#   correct) or only apply the runtime-only settings the .tgz can't carry.
#
# Prerequisites:
#   - A PRE-MIGRATION config XML backup at
#     firewalls_backups/running-config-<host>.xml (produced by STEP 2 of
#     scm_migration_final_v2.yml). If this was overwritten by re-running
#     STEP 2 after the migration, rollback cannot proceed for that firewall.
#   - SCM credentials in group_vars/all/scm_credentials.yml
#   - Firewall credentials in group_vars/firewalls/credentials.yml (vaulted)
#     OR passed via -e
#   - Stage 4 auto-detects scm_sase_base_url; pass -e to pin a shard
#
# Usage:
#   Full rollback for a single firewall:
#     ansible-playbook playbook_latest/rollback_firewall_to_panorama.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01,localhost
#
#   Pin SCM shard explicitly (skip Stage 4 auto-detection):
#     ansible-playbook playbook_latest/rollback_firewall_to_panorama.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01,localhost \
#       -e 'scm_sase_base_url=https://paas-17.prod.panorama.paloaltonetworks.com'
#
#   Skip the SCM unclaim stage (leave the device in SCM):
#     ansible-playbook playbook_latest/rollback_firewall_to_panorama.yml \
#       --vault-password-file .vault_pass \
#       --limit dicks-vmseries-lab22-firewall01,localhost \
#       --skip-tags unclaim
#
#   Run only a specific stage by tag:
#     --tags import_config             (Stage 1 only — XML config restore + reboot)
#     --tags disable_routing           (Stage 2 only)
#     --tags reenable_panorama         (Stage 3 only)
#     --tags unclaim                   (Stage 4 only)
#   Backward-compat tag aliases:
#     --tags import_state              (alias for --tags import_config)
# =============================================================================

# ---------------------------------------------------------------------------
# Stage 1 — Import pre-migration XML config back onto the firewall (REBOOT).
# Uploads firewalls_backups/running-config-<host>.xml, loads it into the
# candidate, commits, reboots, waits for the device to come back online.
# Replaces the previous import_device_state_firewall.yml at this stage —
# panos_import for category=device-state only uploads the .tgz file without
# triggering a restore, so the device-state path silently doesn't apply the
# saved state. The XML config path is the reliable rollback workflow.
# ---------------------------------------------------------------------------
- import_playbook: import_config_firewall.yml
  tags:
    - rollback
    - import_config
    - import_state   # backward-compat alias for users who scripted --tags import_state

# ---------------------------------------------------------------------------
# Stage 2 — Disable Advanced Routing Engine (typically no-op after restore).
# Idempotent: skips if state restore already disabled it.
# ---------------------------------------------------------------------------
- import_playbook: disable_advanced_routing.yml
  tags:
    - rollback
    - disable_routing

# ---------------------------------------------------------------------------
# Stage 3 — Re-enable on-prem Panorama management.
# Idempotent on config side; required for the CLI-only runtime settings
# (set system setting template/shared-policy enable) that the .tgz doesn't
# capture.
# ---------------------------------------------------------------------------
- import_playbook: reenable_panorama_management.yml
  tags:
    - rollback
    - reenable_panorama

# ---------------------------------------------------------------------------
# Stage 4 — Unclaim device(s) from SCM (OPTIONAL — use --skip-tags unclaim)
# ---------------------------------------------------------------------------
- import_playbook: unclaim_devices_from_scm.yml
  tags:
    - rollback
    - unclaim
