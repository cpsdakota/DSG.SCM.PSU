---
# =============================================================================
# Import a pre-migration configuration XML to the firewall.
#
# This is the firewall-direct, config-only counterpart of
# import_device_state_firewall.yml (which uses the device-state .tgz —
# but panos_import for category=device-state only UPLOADS the file, it
# does NOT trigger a state restore, so that path silently doesn't apply
# the saved config).
#
# This playbook IS the reliable rollback path: upload a saved XML config
# snapshot, load it into the candidate config, commit, and reboot to
# activate engine-level settings (notably the Advanced Routing flip).
#
# Flow per firewall:
#   1. Verify the local XML backup exists at
#      firewalls_backups/running-config-<inventory_hostname>.xml
#      (produced by STEP 2 of scm_migration_final_v2.yml).
#   2. Upload it via panos_import (category: configuration).
#      The file lands at /opt/pancfg/mgmt/saved-configs/<basename> on the
#      firewall.
#   3. 'load config from <basename>' via panos_op — replaces the candidate
#      config with the loaded XML in its entirety.
#   4. Commit the candidate. ignore_errors: true because the connection
#      may drop mid-commit if the restored config changes mgmt-side
#      settings.
#   5. Reboot the firewall. The Advanced Routing engine switch (legacy
#      Virtual Routers <-> Logical Routers) only takes effect at boot.
#   6. Wait for the firewall to come back online.
#
# What gets restored:
#   - Advanced Routing flag → reverts to whatever the XML had (typically
#     disabled in pre-migration backups)
#   - Legacy <virtual-router> definitions + their interface assignments
#   - <panorama-server> → on-prem Panorama IP
#   - <cloud-service/> → removed (was added during migration)
#   - All interfaces, zones, policies, security rules as captured
#
# What does NOT get restored (because not in the config XML):
#   - Dynamic state: DHCP leases, BGP sessions, IPsec SAs, ARP, sessions
#   - Runtime CLI flags: 'set system setting template/shared-policy
#     enable/disable' (these are restored by reenable_panorama_management.yml)
#
# Required input file (per firewall):
#     firewalls_backups/running-config-<inventory_hostname>.xml
#
# Usage:
#   All firewalls:
#     ansible-playbook playbook_latest/import_config_firewall.yml \
#       --vault-password-file .vault_pass
#
#   Single firewall:
#     ansible-playbook playbook_latest/import_config_firewall.yml \
#       --vault-password-file .vault_pass \
#       --limit Store1864fw1-440
#
# Variables:
#   config_backup_dir — local directory with the backup XML
#                       (default: firewalls_backups)
#   firewall_list     — optional list to target specific hosts
# =============================================================================

- hosts: firewalls
  strategy: linear
  connection: local
  gather_facts: false

  vars:
    config_backup_dir: "firewalls_backups"

  tasks:

    - name: 'Check if running for specific firewalls only'
      ansible.builtin.set_fact:
        run_for_this_host: "{{ (firewall_list is not defined) or (inventory_hostname in firewall_list) }}"

    - name: 'Skip host if not in firewall_list'
      ansible.builtin.meta: end_host
      when: not (run_for_this_host | bool)

    - name: 'Set firewall provider information'
      ansible.builtin.set_fact:
        fw_provider:
          ip_address: "{{ panorama_host }}"
          username: '{{ username | default(omit) }}'
          password: '{{ password | default(omit) }}'
          api_key: '{{ api_key | default(omit) }}'
      no_log: true

    # ==========================================
    # Locate the XML backup and confirm it's present.
    # ==========================================

    - name: 'Build local config XML path + short remote basename'
      ansible.builtin.set_fact:
        config_xml_path: "{{ config_backup_dir }}/running-config-{{ inventory_hostname }}.xml"
        # PAN-OS limits the uploaded config filename to 32 chars
        # (error: "upload -> config -> name can be at most 32 characters").
        # Our natural name 'running-config-{{ inventory_hostname }}.xml' easily
        # exceeds that for hostnames > ~16 chars. Build a short, deterministic
        # remote name from a 12-char MD5 hash of the hostname: 'rb-' (3) +
        # 12 hash chars + '.xml' (4) = 19 chars. Always under the limit,
        # collision-resistant, and reproducible per host across re-runs.
        config_xml_short_name: "rb-{{ (inventory_hostname | hash('md5'))[:12] }}.xml"

    - name: 'Verify local config XML exists'
      ansible.builtin.stat:
        path: "{{ config_xml_path }}"
      register: config_xml_stat
      delegate_to: localhost

    - name: 'Fail if local config XML is missing'
      ansible.builtin.fail:
        msg: >-
          Config XML backup not found at {{ config_xml_path }}.
          STEP 2 of scm_migration_final_v2.yml normally produces this file.
          If it was never captured, or was overwritten by a post-migration
          re-run, the rollback cannot proceed for this firewall.
      when: not config_xml_stat.stat.exists

    - name: 'Display import target'
      ansible.builtin.debug:
        msg:
          - "=== Importing Pre-Migration Config XML to Firewall ==="
          - "Firewall          : {{ inventory_hostname }}"
          - "Firewall IP       : {{ panorama_host }}"
          - "Source XML        : {{ config_xml_path }} ({{ config_xml_stat.stat.size }} bytes)"
          - "Remote short name : {{ config_xml_short_name }} (PAN-OS 32-char limit)"
          - "Will land at      : /opt/pancfg/mgmt/saved-configs/{{ config_xml_short_name }}"

    # ==========================================
    # Step 1 — Stage the XML to a temp file with a SHORT basename.
    # panos_import derives the remote filename from the local basename,
    # and panos_import doesn't expose any "rename on upload" option.
    # So copy the XML to /tmp/<short>.xml first, then upload from there.
    # ==========================================

    - name: 'Create local temp dir for short-named upload'
      ansible.builtin.tempfile:
        state: directory
        prefix: "rb-{{ inventory_hostname }}-"
      register: tmp_dir
      delegate_to: localhost

    - name: 'Copy XML backup to temp dir with short name'
      ansible.builtin.copy:
        src: "{{ config_xml_path }}"
        dest: "{{ tmp_dir.path }}/{{ config_xml_short_name }}"
        mode: '0644'
      delegate_to: localhost

    - name: 'Upload short-named XML to firewall (panos_import)'
      paloaltonetworks.panos.panos_import:
        provider: '{{ fw_provider }}'
        category: 'configuration'
        filename: "{{ tmp_dir.path }}/{{ config_xml_short_name }}"
      register: result_import
      delegate_to: localhost

    - name: 'Display upload result'
      ansible.builtin.debug:
        msg:
          - "Upload status : {{ 'SUCCESS' if result_import is succeeded else 'FAILED' }}"
          - "Changed       : {{ result_import.changed | default('N/A') }}"
          - "Remote name   : {{ config_xml_short_name }}"

    - name: 'Clean up local temp dir'
      ansible.builtin.file:
        path: "{{ tmp_dir.path }}"
        state: absent
      delegate_to: localhost
      ignore_errors: true   # don't let cleanup failure block the rollback

    # ==========================================
    # Step 2 — Load the uploaded config into the candidate config.
    # 'load config from <basename>' replaces the candidate config entirely.
    # ==========================================

    - name: 'Load uploaded config into candidate'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: "load config from {{ config_xml_short_name }}"
        cmd_is_xml: false
      register: result_load

    - name: 'Display load result'
      ansible.builtin.debug:
        msg:
          - "Load status : {{ 'SUCCESS' if result_load is succeeded else 'FAILED' }}"
          - "Output      : {{ result_load.stdout_xml | default(result_load.msg | default('N/A')) }}"

    # ==========================================
    # Step 3 — Commit the restored config.
    # ignore_errors: true because the restored config may change
    # mgmt-side settings (Panorama IP, route to mgmt subnet, etc.)
    # and the connection may drop mid-commit.
    # ==========================================

    - name: 'Commit restored config'
      paloaltonetworks.panos.panos_commit_firewall:
        provider: '{{ fw_provider }}'
        description: "Restore pre-migration config from {{ config_xml_short_name }}"
      register: result_commit
      ignore_errors: true

    - name: 'Display commit result'
      ansible.builtin.debug:
        msg:
          - "Commit status : {{ 'SUCCESS' if result_commit is succeeded else 'FAILED or connection dropped (expected if mgmt-side settings changed)' }}"

    # ==========================================
    # Step 4 — Reboot the firewall.
    # Necessary to switch the Advanced Routing engine. The committed
    # config sets <advance-routing>no</advance-routing> (if that was the
    # pre-migration state), but the live engine only switches at boot.
    # ==========================================

    - name: 'Reboot the firewall to activate engine-level settings'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: "<request><restart><system/></restart></request>"
        cmd_is_xml: true
      ignore_errors: true   # connection drops immediately on reboot

    # ==========================================
    # Step 5 — Wait for the firewall to come back online.
    # ==========================================

    - name: 'Wait for firewall to begin reboot (port 443 closes)'
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 15
        timeout: 180
        state: stopped
      delegate_to: localhost
      ignore_errors: true   # OK if it doesn't go down — maybe restore was no-op

    - name: 'Wait for firewall to come back online (port 443 reopens)'
      ansible.builtin.wait_for:
        host: "{{ panorama_host }}"
        port: 443
        delay: 30
        timeout: 900
        sleep: 30
        state: started
      delegate_to: localhost

    - name: 'Pause for management plane to fully initialize'
      ansible.builtin.pause:
        seconds: 60

    - name: 'Verify firewall is responsive (read system info)'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: 'show system info'
        cmd_is_xml: false
      register: result_post_restore_check
      retries: 5
      delay: 30
      until: result_post_restore_check is not failed
      ignore_errors: true

    # ==========================================
    # Step 6 — Wait for boot-time auto-commit to finish.
    # 'show system info' returns success while the firewall is still
    # running its boot-time auto-commit. If we hand control to the next
    # rollback stage (which tries to commit), PAN-OS rejects with:
    #   "Commit job was not queued since auto-commit not yet finished
    #    successfully. Please use 'commit force' to schedule commit job"
    # Poll 'show jobs all' every 30s for up to 15 minutes — proceed once
    # no Commit/AutoCom job is in ACT or PEND state. Same logic as
    # STEP 4B-POST in scm_migration_final_v2.yml.
    # ==========================================

    - name: 'Wait for boot-time auto-commit to finish (max 15 min)'
      paloaltonetworks.panos.panos_op:
        provider: '{{ fw_provider }}'
        cmd: 'show jobs all'
        cmd_is_xml: false
      register: post_boot_jobs_check
      vars:
        # PAN-OS XML-to-JSON returns 'job' as a dict if there's exactly one
        # job and a list otherwise — normalize to a list before filtering.
        _jobs_raw: "{{ (post_boot_jobs_check.stdout | default('{}') | from_json).response.result.job | default([]) }}"
        _jobs_list: "{{ [_jobs_raw] if (_jobs_raw is mapping) else _jobs_raw }}"
        active_commit_jobs: >-
          {{ _jobs_list
             | selectattr('type', 'in', ['Commit', 'AutoCom'])
             | selectattr('status', 'in', ['ACT', 'PEND'])
             | list }}
      until: active_commit_jobs | length == 0
      retries: 30      # 30 × 30s = 15 minutes max
      delay: 30
      changed_when: false
      ignore_errors: true

    - name: 'Display final commit-job state'
      ansible.builtin.debug:
        msg:
          - "Firewall          : {{ inventory_hostname }}"
          - "Auto-commit wait  : {{ 'CLEAR — no active commits, safe to proceed' if post_boot_jobs_check is succeeded else 'TIMEOUT — boot-time auto-commit still running after 15 min' }}"

    # ==========================================
    # Final summary
    # ==========================================

    - name: 'Display completion summary'
      ansible.builtin.debug:
        msg:
          - "=== Pre-Migration Config Restore Complete for {{ inventory_hostname }} ==="
          - "Source XML       : {{ config_xml_path }}"
          - "Upload           : {{ 'SUCCESS' if result_import is succeeded else 'FAILED' }}"
          - "Load into candid.: {{ 'SUCCESS' if result_load is succeeded else 'FAILED' }}"
          - "Commit           : {{ 'SUCCESS' if result_commit is succeeded else 'FAILED / dropped (expected)' }}"
          - "Post-reboot      : {{ 'REACHABLE' if result_post_restore_check is succeeded else 'NOT YET REACHABLE — check manually' }}"
          - "The firewall is now running the pre-migration configuration."
